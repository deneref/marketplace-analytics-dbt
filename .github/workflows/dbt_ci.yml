# Static checks: everything dbt can verify WITHOUT a warehouse — the project parses, every ref/source resolves,
# the yml files are valid, the Jinja compiles. No secrets, so it also runs on pull requests from forks.
# `dbt parse` never opens a connection; the profile's env vars only have to exist, hence the dummy values below.
# What this does NOT catch: SQL errors (`dbt compile` needs a live connection) and failing data tests —
# those belong to the warehouse build, see dbt_warehouse.yml.
name: dbt CI (static)

on:
  push:
    branches: [main]
  pull_request:

jobs:
  parse:
    runs-on: ubuntu-latest
    env:
      SNOWFLAKE_ACCOUNT: ci-does-not-connect
      SNOWFLAKE_USER: ci-does-not-connect
      SNOWFLAKE_PRIVATE_KEY_PATH: /dev/null
      SNOWFLAKE_ROLE: SYSADMIN
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: mkdir -p ~/.dbt && cp dbt/profiles.example.yml ~/.dbt/profiles.yml
      - name: dbt deps
        working-directory: dbt
        run: dbt deps

      - name: Parse the real-data path (models on sources)
        working-directory: dbt
        run: dbt parse --target ci

      # The demo path substitutes every source with a demo_* seed (macros/source_or_seed.sql). It fails while
      # seeds_gen/generate_demo_seeds.py still covers only 5 of the 12 sources — missing: orders_stats,
      # offer_mappings, goods_realization_{shipped,delivered,unredeemed,returned,lost}. Kept as a visible,
      # non-blocking step: it is the checklist for that work. Drop continue-on-error once the generator is done.
      - name: Parse the demo-seed path (non-blocking until the generator covers every source)
        continue-on-error: true
        working-directory: dbt
        run: |
          dbt parse --vars '{"use_demo_seeds": true}' --target ci
