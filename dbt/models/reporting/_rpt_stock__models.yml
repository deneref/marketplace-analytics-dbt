          - {sku: D, date_day: 2026-09-16, is_latest_day: true,  units_available_sod: 4,    is_in_stock: true,  is_stockout_day: false, is_demand_known: false, units_ordered: 0, units_kept: 0, units_in_flight: 0, latest_snapshot_date: 2026-09-15, latest_demand_date: 2026-09-04, first_stocked_date: 2026-09-01}
          - {sku: D, date_day: 2026-09-04, is_latest_day: false, units_available_sod: 4,    is_in_stock: true,  is_stockout_day: false, is_demand_known: true,  units_ordered: 3, units_kept: 3, units_in_flight: 0, latest_snapshot_date: 2026-09-15, latest_demand_date: 2026-09-04, first_stocked_date: 2026-09-01}
          - {sku: H, date_day: 2026-09-16, is_latest_day: true,  units_available_sod: null, is_in_stock: null,  is_stockout_day: null,  is_demand_known: false, units_ordered: 0, units_kept: 0, units_in_flight: 0, latest_snapshot_date: 2026-09-15, latest_demand_date: 2026-09-04, first_stocked_date: 2026-09-01}
          - {sku: H, date_day: 2026-09-04, is_latest_day: false, units_available_sod: 2,    is_in_stock: true,  is_stockout_day: false, is_demand_known: true,  units_ordered: 1, units_kept: 1, units_in_flight: 0, latest_snapshot_date: 2026-09-15, latest_demand_date: 2026-09-04, first_stocked_date: 2026-09-01}
    expect:
      rows:
        - {sku: C, velocity_prior: 2, velocity_recent: 2,   velocity_recent_own_share: 0,   velocity_recent_basis: prior,   is_in_stock: false, is_stockout_now: false, stockout_run_days: null, is_restock_candidate: false}
        - {sku: D, velocity_prior: 2, velocity_recent: 2.5, velocity_recent_own_share: 0.5, velocity_recent_basis: blended, is_in_stock: true,  is_stockout_now: false, stockout_run_days: null, is_restock_candidate: true}
        - {sku: H, velocity_prior: 2, velocity_recent: 1.5, velocity_recent_own_share: 0.5, velocity_recent_basis: prior,   is_in_stock: false, is_stockout_now: false, stockout_run_days: null, is_restock_candidate: false}

  - name: rpt_stock_sku_age_counts_in_stock_days
    description: >
      E sold 2 on a day a year before its latest in-stock day, with no in-stock days in between. With a half-life of
      ONE in-stock day the older day is one in-stock day back and gets weight 0.5 (calendar age would give ≈ 0).
      Evidence = 0·1 + 2·0.5 = 1 unit in 1.5 days.
    model: rpt_stock_sku
    overrides:
      vars: {velocity_prior_units: 3, season_prior_units: 10, index_prior_units: 10, kept_prior_units: 10, velocity_half_life_days: 1, velocity_min_units: 10, season_index_clamp: [0.5, 1.5], restock_lead_days: 60, restock_horizon_days: 120}
    given:
      - input: ref('dim_products')
        rows:
          - {sku: E, product_type_code: SC, lifecycle_status: core, model_colour_code: SC-E, size: ONE, size_order: 0}
      - input: ref('fct_stock_sku_daily')
        rows:
          - {sku: E, date_day: 2026-09-16, is_latest_day: true,  units_available_sod: 1, is_in_stock: true, is_stockout_day: false, is_demand_known: false, units_ordered: 0, units_kept: 0, units_in_flight: 0, latest_snapshot_date: 2026-09-15, latest_demand_date: 2026-09-04, first_stocked_date: 2025-09-01}
          - {sku: E, date_day: 2026-09-04, is_latest_day: false, units_available_sod: 1, is_in_stock: true, is_stockout_day: false, is_demand_known: true,  units_ordered: 0, units_kept: 0, units_in_flight: 0, latest_snapshot_date: 2026-09-15, latest_demand_date: 2026-09-04, first_stocked_date: 2025-09-01}
          - {sku: E, date_day: 2025-09-04, is_latest_day: false, units_available_sod: 2, is_in_stock: true, is_stockout_day: false, is_demand_known: true,  units_ordered: 2, units_kept: 2, units_in_flight: 0, latest_snapshot_date: 2026-09-15, latest_demand_date: 2026-09-04, first_stocked_date: 2025-09-01}
    expect:
      rows:
        - {sku: E, velocity_evidence_units: 1, velocity_evidence_days: 1.5, life_units_ordered: 2}

  - name: rpt_stock_sku_size_ratio_within_colourway
    description: >
      One colourway, M ordered 2 and XL 0 on one day each. Mantel–Haenszel gives XL vs M = (0 + k) / (2·1/2 + k) = 0.5
      with k = 1, which is the size split of the next batch.
    model: rpt_stock_sku
    overrides:
      vars: {velocity_prior_units: 3, season_prior_units: 10, index_prior_units: 1, kept_prior_units: 10, velocity_half_life_days: 60, velocity_min_units: 10, season_index_clamp: [0.5, 1.5], restock_lead_days: 60, restock_horizon_days: 120}
    given:
