          - {sku: XX, product_type_code: T, lifecycle_status: core, model_colour_code: T-X, size: XL, size_order: 4}
      - input: ref('fct_stock_sku_daily')
        rows:
          - {sku: XM, date_day: 2026-09-16, is_latest_day: true,  units_available_sod: 1, is_in_stock: true, is_stockout_day: false, is_demand_known: false, units_ordered: 0, units_kept: 0, units_in_flight: 0, latest_snapshot_date: 2026-09-15, latest_demand_date: 2026-09-04, first_stocked_date: 2026-09-01}
          - {sku: XM, date_day: 2026-09-04, is_latest_day: false, units_available_sod: 3, is_in_stock: true, is_stockout_day: false, is_demand_known: true,  units_ordered: 2, units_kept: 2, units_in_flight: 0, latest_snapshot_date: 2026-09-15, latest_demand_date: 2026-09-04, first_stocked_date: 2026-09-01}
          - {sku: XX, date_day: 2026-09-16, is_latest_day: true,  units_available_sod: 1, is_in_stock: true, is_stockout_day: false, is_demand_known: false, units_ordered: 0, units_kept: 0, units_in_flight: 0, latest_snapshot_date: 2026-09-15, latest_demand_date: 2026-09-04, first_stocked_date: 2026-09-01}
          - {sku: XX, date_day: 2026-09-04, is_latest_day: false, units_available_sod: 3, is_in_stock: true, is_stockout_day: false, is_demand_known: true,  units_ordered: 0, units_kept: 0, units_in_flight: 0, latest_snapshot_date: 2026-09-15, latest_demand_date: 2026-09-04, first_stocked_date: 2026-09-01}
    expect:
      rows:
