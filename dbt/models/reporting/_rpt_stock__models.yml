          - {sku: D, product_type_code: SH, lifecycle_status: core, model_colour_code: SH-D, size: M, size_order: 2}
          - {sku: H, product_type_code: SH, lifecycle_status: core, model_colour_code: SH-H, size: M, size_order: 2}
      - input: ref('fct_stock_sku_daily')
        rows:
