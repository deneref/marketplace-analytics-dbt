  - name: rpt_stock_sku_never_delivered_gets_the_prior
    description: >
      C was never delivered. Its velocity is the type × size prior (2) and it is not a candidate. H has a hole in
      today's row (no stock report), and its flags come out FALSE, not NULL. D and H get the same prior on their own
      day: D = (3 + 2) / (1 + 1) = 2.5, H = (1 + 2) / (1 + 1) = 1.5.
    model: rpt_stock_sku
    overrides:
      vars: {velocity_prior_units: 2, season_prior_units: 2, index_prior_units: 10, kept_prior_units: 1, velocity_half_life_days: 60, velocity_min_units: 10, season_index_clamp: [0.5, 1.5], restock_lead_days: 60, restock_horizon_days: 120}
