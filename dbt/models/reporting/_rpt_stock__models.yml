  - name: rpt_stock_sku_restock_base_is_brought_to_now
    description: >
      The v4 bug this guards: a sku at zero for months carried its old rate into velocity_restock. Two shirts of one
      type. B sold 2 on 2026-04-10 and is at zero since; A sold 2 that day too and 1 on 2026-09-04, so the type's
      month curve halved (April 2, September 1; k = 0). B's type rate on its own days is 2 (type_curve_on_evidence),
      its strength (2 + 1) / (2 + 1) = 1, so velocity_now = 1 × the curve now (1) = 1, not the April 2 (v4 gives
      1.85). No type history a year back → season index 1; no own days in the window → velocity_restock = 1.
      A's type rate on its own days is (1·1 + 0.5·2) / 1.5 = 4/3 (the double nearest to it, exact in both engines).
    model: rpt_stock_sku
    overrides:
      vars: {velocity_prior_units: 1, season_prior_units: 2, index_prior_units: 0, kept_prior_units: 10, velocity_half_life_days: 1, velocity_min_units: 10, season_index_clamp: [0.5, 1.5], season_min_coverage: 0.5, restock_lead_days: 60, restock_horizon_days: 120}
    given:
      - input: ref('dim_products')
        rows:
          - {sku: A, product_type_code: SH, lifecycle_status: core, model_colour_code: SH-A, size: M, size_order: 2}
          - {sku: B, product_type_code: SH, lifecycle_status: core, model_colour_code: SH-B, size: M, size_order: 2}
      - input: ref('fct_stock_sku_daily')
        rows:
          - {sku: A, date_day: 2026-09-16, is_latest_day: true,  units_available_sod: 5, is_in_stock: true,  is_stockout_day: false, is_demand_known: false, units_ordered: 0, units_kept: 0, units_in_flight: 0, latest_snapshot_date: 2026-09-15, latest_demand_date: 2026-09-04, first_stocked_date: 2026-04-10}
          - {sku: A, date_day: 2026-09-04, is_latest_day: false, units_available_sod: 5, is_in_stock: true,  is_stockout_day: false, is_demand_known: true,  units_ordered: 1, units_kept: 1, units_in_flight: 0, latest_snapshot_date: 2026-09-15, latest_demand_date: 2026-09-04, first_stocked_date: 2026-04-10}
          - {sku: A, date_day: 2026-04-10, is_latest_day: false, units_available_sod: 5, is_in_stock: true,  is_stockout_day: false, is_demand_known: true,  units_ordered: 2, units_kept: 2, units_in_flight: 0, latest_snapshot_date: 2026-09-15, latest_demand_date: 2026-09-04, first_stocked_date: 2026-04-10}
          - {sku: B, date_day: 2026-09-16, is_latest_day: true,  units_available_sod: 0, is_in_stock: false, is_stockout_day: true,  is_demand_known: false, units_ordered: 0, units_kept: 0, units_in_flight: 0, latest_snapshot_date: 2026-09-15, latest_demand_date: 2026-09-04, first_stocked_date: 2026-04-10}
          - {sku: B, date_day: 2026-04-10, is_latest_day: false, units_available_sod: 3, is_in_stock: true,  is_stockout_day: false, is_demand_known: true,  units_ordered: 2, units_kept: 2, units_in_flight: 0, latest_snapshot_date: 2026-09-15, latest_demand_date: 2026-09-04, first_stocked_date: 2026-04-10}
    expect:
      rows:
        - {sku: A, type_curve_on_evidence: 1.3333333333333333, velocity_strength: 1, type_curve_now: 1, type_curve_now_coverage: 1, velocity_now: 1, season_index_basis: no_history, type_season_index: 1, velocity_restock_prior: 1, velocity_restock: 1}
        - {sku: B, type_curve_on_evidence: 2,                  velocity_strength: 1, type_curve_now: 1, type_curve_now_coverage: 1, velocity_now: 1, season_index_basis: no_history, type_season_index: 1, velocity_restock_prior: 1, velocity_restock: 1}

  - name: rpt_stock_sku_orphan_and_stale_type_keep_a_base
    description: >
      X sells but is missing from dim_products, so there is no curve under its days: velocity_strength is NULL and
      velocity_now falls back to velocity_recent = (2 + 2) / (1 + 2 / 2) = 2 (brand rate 2 as the prior), instead of
      exploding against a zero expectation. F is the only cap and was last in stock in April 2023; with a half-life of
      one day its months carry no weight around 2026-09-04 (0.5^1243 underflows to 0), so type_curve_now_coverage is 0
      and the season index is not applied. X, without a product, gets coverage 0 too; F's strength is (2 + 2) / (2 + 2) = 1 and,
      with no curve now, velocity_now = 1 × its type rate 2.
    model: rpt_stock_sku
    overrides:
      vars: {velocity_prior_units: 2, season_prior_units: 2, index_prior_units: 10, kept_prior_units: 1, velocity_half_life_days: 1, velocity_min_units: 10, season_index_clamp: [0.5, 1.5], season_min_coverage: 0.5, restock_lead_days: 60, restock_horizon_days: 120}
    given:
      - input: ref('dim_products')
        rows:
          - {sku: F, product_type_code: CAP, lifecycle_status: core, model_colour_code: CAP-F, size: ONE, size_order: 0}
      - input: ref('fct_stock_sku_daily')
        rows:
          - {sku: X, date_day: 2026-09-16, is_latest_day: true,  units_available_sod: 1, is_in_stock: true,  is_stockout_day: false, is_demand_known: false, units_ordered: 0, units_kept: 0, units_in_flight: 0, latest_snapshot_date: 2026-09-15, latest_demand_date: 2026-09-04, first_stocked_date: 2026-09-01}
          - {sku: X, date_day: 2026-09-04, is_latest_day: false, units_available_sod: 1, is_in_stock: true,  is_stockout_day: false, is_demand_known: true,  units_ordered: 2, units_kept: 2, units_in_flight: 0, latest_snapshot_date: 2026-09-15, latest_demand_date: 2026-09-04, first_stocked_date: 2026-09-01}
          - {sku: F, date_day: 2026-09-16, is_latest_day: true,  units_available_sod: 0, is_in_stock: false, is_stockout_day: true,  is_demand_known: false, units_ordered: 0, units_kept: 0, units_in_flight: 0, latest_snapshot_date: 2026-09-15, latest_demand_date: 2026-09-04, first_stocked_date: 2023-04-10}
          - {sku: F, date_day: 2023-04-10, is_latest_day: false, units_available_sod: 2, is_in_stock: true,  is_stockout_day: false, is_demand_known: true,  units_ordered: 2, units_kept: 2, units_in_flight: 0, latest_snapshot_date: 2026-09-15, latest_demand_date: 2026-09-04, first_stocked_date: 2023-04-10}
    expect:
      rows:
        - {sku: X, velocity_strength: null, velocity_recent: 2, velocity_now: 2, type_curve_now_coverage: 0, season_index_basis: no_history, type_season_index: 1}
        - {sku: F, velocity_strength: 1,    velocity_recent: 2, velocity_now: 2, type_curve_now_coverage: 0, season_index_basis: no_history, type_season_index: 1}
