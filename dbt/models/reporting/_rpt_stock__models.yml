version: 2

# rpt_stock_sku (v4.2, 2026-09-22: gamma-Poisson velocity, restock base brought to now) + rpt_stock_days (v3, 2026-09-17). Replaces the previous
# _rpt_stock__models.yml in place. fct_stock_sku_daily is described in models/marts/_fct_stock_sku_daily.yml.

models:
  - name: rpt_stock_sku
    description: >
      The restock page, one row per sku as of the latest stock report. It has stock this morning, how long the sku has
      been at zero, the raw evidence per window, the current velocity (with its prior, interval and the weight of the
      sku's own data), the arrival-season velocity, the kept share, cover in days, units lost to stockouts and the
      batch size. Every sku gets a number, no NULLs; velocity_*_basis says how much of it comes from the sku's own
      data.


      Method (v4, 2026-09-22): gamma-Poisson shrinkage. It replaces the v3 cascade, which fell back from recent to
      lifetime to weak to type_avg. Evidence days are weighted 0.5^(age / velocity_half_life_days) with age counted in
      IN-STOCK days, so a stockout pauses the clock. The prior is type_velocity (shrunk to the brand) × size_index
      (Mantel–Haenszel rate ratio to M within the same colourway, shrunk to 1, rescaled per type). velocity_recent =
      (n + a) / (t + a / prior). kept_share is beta-binomial over resolved units.


      velocity_restock (v4.2): the sku's own sales in the arrival window a year back, shrunk to velocity_now ×
      type_season_index. Until v4.2 the base was velocity_recent. The in-stock clock puts the "now" of a sku at zero
      since March in winter or spring, while the index moves a rate from "now" to the arrival window, so for such a
      sku the season was counted twice (9 skus on the 2026-09-15 export had 30–70 % of their weight in Nov–Mar).
      velocity_now fixes the base: type_curve is the type's rate per sku-day in each calendar month (pooled, a month
      shrunk to the type's rate with index_prior_units); velocity_strength = the sku's weighted units ÷ the units the
      curve expects on the same days, shrunk to size_index; velocity_now = strength × the curve decay-weighted around
      latest_demand_date. The index itself is unchanged from v4, and is applied only when the curve covers at least
      season_min_coverage of the weight around now (a type at zero for months has no "now" to start from).


      Backtest setup: 51 skus, 5 cut-offs from 2025-11 to 2026-07, target is units ordered over the next 60 days on
      in-stock days, scored on the 145 sku × cut-off rows that both models can score. Against the cascade, Poisson
      deviance is −25 % (cluster bootstrap over skus, 95 %: −35 … −13 %) and MAE is −14 % (−22 … −5 %). v4 is better
      on 4 cut-offs and ties on 2026-05. h = 60 and a = 3 were picked on the same cut-offs, so that choice is
      in-sample. Still, any point of the grid h 30–120 × a 1–10 beats the cascade, and a = 3 is in line with the
      negative-binomial maximum likelihood on the pool (1.7–3.4). The interval covers Poisson sampling noise only.
      Realised 60-day rates fall inside it about half the time, since season and drift dominate. With one year of
      history the size index can't be backtested.


      Backtest of velocity_restock (v4.2 against v4; cut-offs a year into the data, target units ordered on in-stock
      days lead … lead + horizon after the cut, cluster bootstrap over skus). Four cut-offs 2025-12 … 2026-03 with the
      season index inactive (no year behind them; 138 sku × cut rows): Poisson deviance +0.4 % (95 %: −3 … +4 %).
      Five spring cut-offs for H and L, where the index is active (76 rows): +1.7 % (−8 … +11 %). No difference either
      way: the sku's own window a year back dominates the estimate, and only 11 rows (two caps and three long
      sleeves) had the sku out of stock for over 30 days before the cut. Every variant misses by type in both
      directions (caps −52 %, shirts +101 %), so treat a batch as a point inside a wide band.


      Tried and rejected for v4.2: a sku × type-month Poisson fit (backfitting) to free the curve from which skus were
      in stock. It moved the cap season index from 0.74 to 1.08 and the cap batch up by a third, but it assumes a
      sku sells the same whatever else is on the shelf, and the caps show the opposite (the 006 colourways sell 0.5–0.8
      times as much when the 007 caps are in stock). It was no better in the backtest either.
    config:
      materialized: table
    data_tests:
      - dbt_utils.expression_is_true:
          name: rpt_stock_sku_velocity_recent_is_a_number
          arguments:
            expression: "velocity_recent > 0"
      - dbt_utils.expression_is_true:
          name: rpt_stock_sku_evidence_has_a_type_curve
          arguments:
            # a sku with evidence days but no curve under them is missing from dim_products; velocity_now then falls
            # back to velocity_recent, and the season base is the old one
            expression: "velocity_evidence_days = 0 or type_curve_on_evidence > 0"
      - dbt_utils.expression_is_true:
          name: rpt_stock_sku_velocity_restock_is_a_number
          arguments:
            expression: "velocity_restock > 0"
      - dbt_utils.expression_is_true:
          name: rpt_stock_sku_interval_contains_estimate
          arguments:
            expression: "velocity_recent_lo >= 0 and velocity_recent_lo <= velocity_recent and velocity_recent <= velocity_recent_hi"
      - dbt_utils.expression_is_true:
          name: rpt_stock_sku_estimate_between_own_and_prior
          arguments:
            # the posterior mean is a weighted average of the own rate and the prior, so it can never fall outside them
            # a NULL own rate (never on sale) makes the expression NULL, which passes; the check does not depend on OR short-circuiting
            expression: >
              velocity_recent between least(velocity_prior, velocity_evidence_units / nullif(velocity_evidence_days, 0)) - 1e-9
                                  and greatest(velocity_prior, velocity_evidence_units / nullif(velocity_evidence_days, 0)) + 1e-9
      - dbt_utils.expression_is_true:
          name: rpt_stock_sku_flags_are_never_null
          arguments:
            expression: "is_restock_candidate is not null and is_stockout_now is not null and is_in_stock is not null"
      - dbt_utils.expression_is_true:
          name: rpt_stock_sku_candidate_implies_delivered_live
          arguments:
            expression: "not is_restock_candidate or (first_stocked_date is not null and lifecycle_status not in ('discontinued', 'limited'))"
      - dbt_utils.expression_is_true:
          name: rpt_stock_sku_stockout_run_only_at_zero
          arguments:
            expression: "(stockout_run_days is null) = (not is_stockout_now)"
      - dbt_utils.expression_is_true:
          name: rpt_stock_sku_demand_feed_not_stale
          arguments:
            expression: "latest_demand_date >= latest_snapshot_date - 3"
          config:
            severity: warn     # the page still works (is_demand_known guards the windows), but the "now" rows go blind
    columns:
      - name: sku
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments: {to: ref('dim_products'), field: sku}
      - name: latest_snapshot_date
        description: The evening of the latest stock report; stock columns are the morning after it.
      - name: latest_demand_date
        description: The last day the order feed covers; no evidence day is later.
      - name: first_stocked_date
        description: First morning with good stock anywhere. NULL = never delivered (a card, not a product).
      - name: last_in_stock_date
        description: Last morning with at least one available unit, up to the latest report.
      - name: units_available_sod
        description: Available (sellable, unreserved) units this morning, network without returns warehouses.
      - name: units_fit_sod
        description: Good units this morning, available and reserved.
      - name: units_freeze_sod
        description: Good units reserved under placed orders this morning.
      - name: units_unsellable_sod
        description: Defective, expired or quarantined units this morning.
      - name: units_fit_at_returns_sod
        description: Good units at returns warehouses (parcels on their way back, arrival date unknown). Shown but never deducted.
      - name: is_in_stock
        description: At least one available unit this morning.
      - name: is_stockout_now
        description: Zero available this morning AND delivered at least once. FALSE for a never-delivered card.
      - name: stockout_run_days
        description: Mornings at zero in the current run, today's included. NULL when in stock.
      - name: stockout_days_90
        description: Report days at zero (after the first delivery) in the last 90 calendar days.
      - name: life_in_stock_days
        description: Evidence days (in stock AND demand known) since the first delivery. Raw count, for the reader.
      - name: life_units_ordered
        description: Units ordered on the evidence days, lifetime.
      - name: life_units_kept
        description: Of them, received and kept (not unredeemed, not returned).
      - name: r180_in_stock_days
        description: Evidence days in the last 180 calendar days up to latest_demand_date. Raw, for the reader.
      - name: r180_units_ordered
        description: Units ordered on them.
      - name: season_in_stock_days
        description: >
          Evidence days in the window a batch started today would sell in, taken one year back. The window is
          (latest_snapshot_date + restock_lead_days, + restock_lead_days + restock_horizon_days]. This is the data
          behind velocity_restock.
      - name: season_units_ordered
        description: Units ordered on them.
      - name: velocity_lifetime
        description: life_units_ordered / life_in_stock_days, unshrunk. NULL without an evidence day. For the reader.
      - name: velocity_recent_180
        description: r180_units_ordered / r180_in_stock_days, unshrunk. For the reader.
      - name: velocity_season_ly
        description: season_units_ordered / season_in_stock_days, unshrunk. For the reader.
      - name: velocity_evidence_units
        description: >
          Units ordered on the evidence days, each day weighted 0.5^(age / velocity_half_life_days), where age =
          in-stock days back from the latest one. The "n" of the estimate (not an integer).
      - name: velocity_evidence_days
        description: The same weights summed, i.e. the "days" of the estimate. velocity_evidence_units / velocity_evidence_days is the own rate.
      - name: type_velocity
        description: The product type's decay-weighted rate per sku-day, shrunk to the brand's (the brand's for a type with no evidence).
        data_tests:
          - not_null
      - name: size_ratio_to_m
        description: >
          How this size sells against M of the SAME colourway. Mantel–Haenszel rate ratio pooled over colourways,
          shrunk to 1 with index_prior_units. 1 for M, one-size and unparsed sizes. Gives the size split of a new
          batch.
        data_tests:
          - not_null
      - name: size_index
        description: size_ratio_to_m rescaled so the type's exposure-weighted average is 1. Used as the multiplier on type_velocity.
        data_tests:
          - not_null
      - name: velocity_prior
        description: type_velocity × size_index. What a sku of this type and size is expected to sell before its own data.
        data_tests:
          - not_null
      - name: velocity_recent_own_share
        description: >
          The weight of the sku's own data in velocity_recent, velocity_evidence_days / (velocity_evidence_days +
          velocity_prior_units / velocity_prior). 0 = pure prior, tending to 1 = pure own rate.
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 1}
      - name: velocity_recent_basis
        description: >
          Set by the orders behind the estimate (velocity_evidence_units): 'own' if ≥ velocity_min_units, 'blended' if
          ≥ 3, 'prior' below that. With 'prior' the number is mostly the type × size average.
        data_tests:
          - accepted_values:
              arguments: {values: [own, blended, prior]}
      - name: velocity_recent
        description: >
          How the sku sells now, in units ORDERED per day in stock: (velocity_evidence_units + a) /
          (velocity_evidence_days + a / velocity_prior), a = velocity_prior_units. This is the gamma posterior mean.
          Drives cover_days, lost_units_90 and is_restock_candidate.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 10}
      - name: velocity_recent_lo
        description: >
          2.5 % quantile of the posterior gamma (Wilson–Hilferty). Sampling noise only; with season and drift the real
          spread is about twice as wide. Used by is_restock_candidate.
        data_tests:
          - not_null
      - name: velocity_recent_hi
        description: 97.5 % quantile of the posterior gamma. Never rank two skus by a difference inside [lo, hi].
        data_tests:
          - not_null
      - name: type_season_index_raw
        description: >
          The product type's orders in the arrival window a year back ÷ the orders its rate "now, a year back"
          (calendar-decayed around that date) predicted for those days. Shrunk to 1 with index_prior_units. NULL when
          the type had under 30 weighted sku-days a year back. With one year of history it carries growth as well as
          season.
      - name: type_season_index
        description: type_season_index_raw clamped to var('season_index_clamp'); 1 when NULL.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: "{{ var('season_index_clamp')[0] }}", max_value: "{{ var('season_index_clamp')[1] }}"}
      - name: season_index_basis
        description: >
          'type_last_year': used as measured. 'clamped': the raw index was outside the clamp. 'no_history': index 1,
          because the type did not sell a year back or has no month curve around now (type_curve_now_coverage below
          season_min_coverage).
        data_tests:
          - accepted_values:
              arguments: {values: [type_last_year, clamped, no_history]}
      - name: type_curve_on_evidence
        description: >
          The type's month curve averaged over the sku's own evidence days, with their weights: the type's rate when
          the sku's velocity was measured. NULL for a sku never on sale. For a sku at zero since March it is a spring
          rate, which is what velocity_recent carried into the restock base until v4.2.
      - name: velocity_strength
        description: >
          The sku against its type on the SAME days: (velocity_evidence_units + a) / (units the type curve expects on
          those days + a / size_index). 1 = sells at the type's rate; a sku never on sale gets its size index. NULL
          only when the sku has sales but no curve under them (missing from dim_products).
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, inclusive: false}
      - name: type_curve_now
        description: >
          The type's month curve, decay-weighted (velocity_half_life_days, calendar days) around latest_demand_date:
          the type's rate over roughly the last two months. The type's own rate when it has no curve.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, inclusive: false}
      - name: type_curve_now_coverage
        description: >
          Share of the calendar's decay weight around latest_demand_date that falls in months the type has a curve
          for. Low when the whole type has been at zero for months; the season index then is not applied.
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 1}
      - name: velocity_now
        description: >
          velocity_strength × type_curve_now: what the sku would sell per in-stock day now, whenever its own days were.
          The base of velocity_restock. For skus in stock lately it is within −15 … +14 % of velocity_recent (median
          −2 %, 2026-09-15); it differs by design for skus at zero for months. velocity_recent when velocity_strength
          is NULL.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, inclusive: false}
      - name: velocity_restock_prior
        description: velocity_now × type_season_index, the arrival-season rate before the sku's own sales in that window a year back.
        data_tests:
          - not_null
      - name: velocity_restock_own_share
        description: Weight of the sku's own arrival-window sales a year back in velocity_restock (same formula as velocity_recent_own_share).
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 1}
      - name: velocity_restock_basis
        description: >
          Set by the sku's own orders in the arrival window a year back (season_units_ordered): 'own_season' if ≥
          velocity_min_units, 'blended' if ≥ 3, 'recent_x_season' below that. In the last case it is velocity_now ×
          type_season_index (the label keeps its v3 name for BI).
        data_tests:
          - accepted_values:
              arguments: {values: [own_season, blended, recent_x_season]}
      - name: velocity_restock
        description: >
          How the sku will sell when the batch lands: (season_units_ordered + a_s) / (season_in_stock_days + a_s /
          velocity_restock_prior), a_s = season_prior_units. The prior is stronger than for velocity_recent, so a few
          days a year back can't swing a batch. Drives units_ordered_horizon / units_kept_horizon. The backtest
          (model description) can't tell it from v4; the season index in it is untested for the winter.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 10}
      - name: kept_share
        description: >
          Share of RESOLVED units (ordered minus still in flight) that were received and kept. Decay-weighted like
          velocity_recent and shrunk to the type's share with kept_prior_units (the type's share is in turn shrunk to
          the brand's).
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 1}
      - name: cover_days
        description: units_available_sod / velocity_recent. Mornings of stock left.
      - name: lost_units_90
        description: stockout_days_90 × velocity_recent. An UPPER estimate, since size substitution is not deducted.
      - name: units_ordered_horizon
        description: velocity_restock × restock_horizon_days. Orders in the batch's first horizon days.
      - name: units_kept_horizon
        description: units_ordered_horizon × kept_share. This is the batch size BEFORE today's stock and parcels on their way back are deducted.
      - name: restock_lead_days
        description: var('restock_lead_days'), carried for BI labels.
      - name: restock_horizon_days
        description: var('restock_horizon_days'), carried for BI labels.
      - name: is_restock_candidate
        description: >
          TRUE for a live model that was delivered at least once and sells ≥ 1 unit during the lead time even at
          velocity_recent_lo (the prior alone does not make a candidate). It also has to be at zero now or run out
          before a batch started today lands (cover_days < restock_lead_days). Otherwise FALSE, never NULL. A minimum
          batch is a BI filter on units_kept_horizon.
      - name: product_type_code
      - name: model_colour_code
        description: The colourway, the grain a print run is ordered for. SUM its sku rows in BI.
      - name: size
      - name: size_order
      - name: lifecycle_status

  - name: rpt_stock_days
    description: >
      Feeds the history pages (availability heatmap, seasonality, sizes). One row per day × sku, dense over the
      calendar. Holds stock at the start of the day, demand during it, the colourway's size run that morning, additive
      0/1 counters for BI ratios and the loss of a stockout day at the sku's current rate. Anything about "now" is in
      rpt_stock_sku.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [date_day, sku]
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: ref('fct_stock_sku_daily')
      - dbt_utils.expression_is_true:
          name: rpt_stock_days_counters_follow_flags
          arguments:
            expression: "in_stock_day_n <= report_day_n and stockout_day_n <= report_day_n and evidence_day_n <= in_stock_day_n and full_run_evidence_day_n <= evidence_day_n"
    columns:
      - name: stock_day_key
        data_tests: [unique, not_null]
      - name: date_day
        data_tests: [not_null]
      - name: sku
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_products'), field: sku}
      - name: is_report_missing
      - name: is_in_stock
        description: units_available_sod > 0; NULL on a hole.
      - name: is_stockout_day
        description: Zero available after the first delivery; FALSE before it; NULL on a hole.
      - name: sizes_total_count
        description: Sizes of the colourway listed on the page that day (1 for sizeless items). Grows as cards appear, so before XL's card "full" is M + L.
      - name: sizes_in_stock_count
      - name: is_full_size_run
        description: Every size listed that day in stock.
      - name: mcc_sizes_current_count
        description: Sizes the colourway has in dim_products today.
      - name: is_full_current_run
        description: Every size the colourway has TODAY was in stock that morning. A size share is only meaningful on these days, and the full_run_* counters use this.
      - name: is_sized
        description: sizes_total_count > 1. The size page filters on it, because for sizeless items is_full_size_run is the same as is_in_stock.
      - name: stock_state
        data_tests:
          - accepted_values:
              arguments: {values: [no_report, in_stock, stockout, not_delivered]}
      - name: is_demand_known
        description: date_day ≤ latest_demand_date. FALSE means the day's zero orders are "unknown", not "none".
      - name: units_ordered
      - name: units_kept
      - name: report_day_n
      - name: in_stock_day_n
      - name: stockout_day_n
      - name: evidence_day_n
        description: In stock and demand known (the days a velocity is measured on). Velocity in BI = SUM(evidence_units_ordered) / SUM(evidence_day_n).
      - name: evidence_units_ordered
      - name: full_run_evidence_day_n
      - name: full_run_units_ordered
      - name: mcc_full_run_units_ordered
        description: The colourway's full-run orders that day, repeated on each size row, so NOT additive across sizes. Size share = SUM(full_run_units_ordered) / SUM(mcc_full_run_units_ordered) grouped by model_colour_code × size.
      - name: velocity_recent
        description: The sku's current rate from rpt_stock_sku, constant per sku. MAX() in BI, never SUM().
      - name: expected_lost_units
        description: velocity_recent on a stockout day, 0 in stock, NULL on a hole. SUM() over any period; an upper estimate.

unit_tests:
  # Every expect row of a test lists the SAME columns in the SAME order. dbt pads given rows with NULLs but not
  # expect rows: it takes the columns from the first row and unions the rows by position, so a row with other keys
  # breaks the UNION ("invalid number of result columns for set operator input branches") or silently shifts values.
  - name: rpt_stock_sku_shrinks_to_the_prior
    description: >
      Two caps, one evidence day each (weight 1), a = 2. A ordered 3 (kept 1), B ordered 1 (kept 1). Brand = type =
      prior = 2/day; A = (3 + 2) / (1 + 1) = 2.5 and B = 1.5, so both are pulled towards 2 and own share is 1/2. Kept
      (k = 1, brand 1/2): A (1 + 0.5) / 4 = 0.375, B 0.75. With no type history a year back the season index is 1 and
      restock = recent.
    model: rpt_stock_sku
    overrides:
      vars: {velocity_prior_units: 2, season_prior_units: 2, index_prior_units: 10, kept_prior_units: 1, velocity_half_life_days: 60, velocity_min_units: 10, season_index_clamp: [0.5, 1.5], restock_lead_days: 60, restock_horizon_days: 120}
    given:
      - input: ref('dim_products')
        rows:
          - {sku: A, product_type_code: CAP, lifecycle_status: core, model_colour_code: CAP-A, size: ONE, size_order: 0}
          - {sku: B, product_type_code: CAP, lifecycle_status: core, model_colour_code: CAP-B, size: ONE, size_order: 0}
      - input: ref('fct_stock_sku_daily')
        rows:
          - {sku: A, date_day: 2026-09-16, is_latest_day: true,  units_available_sod: 0, is_in_stock: false, is_stockout_day: true,  is_demand_known: false, units_ordered: 0, units_kept: 0, units_in_flight: 0, latest_snapshot_date: 2026-09-15, latest_demand_date: 2026-09-04, first_stocked_date: 2026-09-01}
          - {sku: A, date_day: 2026-09-04, is_latest_day: false, units_available_sod: 3, is_in_stock: true,  is_stockout_day: false, is_demand_known: true,  units_ordered: 3, units_kept: 1, units_in_flight: 0, latest_snapshot_date: 2026-09-15, latest_demand_date: 2026-09-04, first_stocked_date: 2026-09-01}
          - {sku: B, date_day: 2026-09-16, is_latest_day: true,  units_available_sod: 5, is_in_stock: true,  is_stockout_day: false, is_demand_known: false, units_ordered: 0, units_kept: 0, units_in_flight: 0, latest_snapshot_date: 2026-09-15, latest_demand_date: 2026-09-04, first_stocked_date: 2026-09-01}
          - {sku: B, date_day: 2026-09-04, is_latest_day: false, units_available_sod: 5, is_in_stock: true,  is_stockout_day: false, is_demand_known: true,  units_ordered: 1, units_kept: 1, units_in_flight: 0, latest_snapshot_date: 2026-09-15, latest_demand_date: 2026-09-04, first_stocked_date: 2026-09-01}
    expect:
      rows:
        - {sku: A, velocity_prior: 2, velocity_recent: 2.5, velocity_recent_own_share: 0.5, velocity_recent_basis: blended, kept_share: 0.375, season_index_basis: no_history, type_season_index: 1, velocity_restock: 2.5, is_restock_candidate: true}
