        - {sku: XX, size_ratio_to_m: 0.5}

  - name: rpt_stock_sku_season_from_last_year_window
    description: >
      F sold 4 on one day inside the arrival window a year back, which is (2025-11-14, 2026-03-14] for a report of
      2026-09-15 with lead 60 and horizon 120. 3–9 own units give 'blended'. The type did not sell before 2025-09-04,
      so the season index has no base and is 1, 'no_history'.
    model: rpt_stock_sku
    overrides:
      vars: {velocity_prior_units: 3, season_prior_units: 10, index_prior_units: 10, kept_prior_units: 10, velocity_half_life_days: 60, velocity_min_units: 10, season_index_clamp: [0.5, 1.5], restock_lead_days: 60, restock_horizon_days: 120}
    given:
