version: 2

models:
  - name: fct_order_lines
    description: >
      Transaction fact at the grain of order × line — the unit of sale. One row per line of every order in
      orders_stats since 2025-01, test orders included (filter on is_test_order). Money: price_buyer_total is what
      the buyer paid after all discounts (reconciles to the realization report's total_after_discount exactly),
      price_total adds the marketplace-funded discount (reconciles to total_before_discount within 0.7 %), revenue
      is the delivered share of price_total and is restated when a return arrives. Fees are the order's fees
      allocated to the line in int_order_lines and are charged regardless of delivery. Sales are dated by
      delivered_date (receipt), not ordered_date. Cost of goods is joined here at the line grain (unit cost of the
      version valid on delivered_date, from the partner's finance workbooks) so that contribution_margin exists at the
      finest grain and fct_sales_daily is one group by over this table. Incremental: delete+insert by order_id with
      a 30-day window on status_updated_at, widened to all rows when the cost file was reloaded;
      tests/assert_fct_order_lines_is_current.sql proves the window is wide enough.
    data_tests:
      # incremental must not lose rows against its parent
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: ref('int_order_lines')
      # revenue exists only for delivered units
      - dbt_utils.expression_is_true:
          arguments:
            expression: "not (units_delivered = 0 and revenue <> 0)"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "not (delivered_date is not null and units_delivered > 0 and revenue <= 0)"
          config: {severity: warn}          # a delivered line at 0 ₽ is possible (full discount) but worth a look
      # nothing is recognised before receipt: in-flight lines have forecast units but no money
      - dbt_utils.expression_is_true:
          arguments:
            expression: "not (delivered_date is null and (revenue <> 0 or cogs <> 0))"
      # a sale has a date of receipt; an unsold line has none
      - dbt_utils.expression_is_true:
          arguments:
            expression: "(delivered_date is not null) = (order_status in ('DELIVERED', 'PARTIALLY_DELIVERED', 'RETURNED'))"
      # price arithmetic
      - dbt_utils.expression_is_true:
          arguments:
            expression: "price_total = price_buyer_total + coalesce(price_marketplace_total, 0)"
      # cost arithmetic: cogs only for delivered units, at the version's unit cost; estimated part never exceeds the whole
      - dbt_utils.expression_is_true:
          arguments:
            expression: "cogs = round(units_delivered * coalesce(unit_cost, 0), 2)"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "not (units_delivered = 0 and cogs <> 0)"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "cogs_estimated = iff(is_cost_estimate, cogs, 0)"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "contribution_margin = revenue - fee_total - cogs"
      # a costed line carries its cost version; an uncosted delivered line is caught (warn) by tests/assert_delivered_lines_have_unit_cost.sql
      - dbt_utils.expression_is_true:
          arguments:
            expression: "(unit_cost is not null) = (sku_cost_key is not null)"
    columns:
      - name: order_line_key
        description: "Surrogate key (order_id + line_index), same as int_order_lines."
        data_tests: [unique, not_null]
      - name: order_id
        description: "Marketplace order id — degenerate dimension, no dim_orders. Incremental key."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('int_order_lines')
                field: order_id
      - name: line_index
        data_tests: [not_null]
      - name: sku
        description: "Seller's SKU — FK to dim_products."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_products')
                field: sku
        data_tests: [not_null]
      - name: market_sku
        description: "Marketplace's SKU of the same offer."
      - name: warehouse_id
        description: "FK to dim_warehouses (add the relationships test when dim_warehouses exists)."
      - name: ordered_date
        description: "Order creation date — for cohort and demand questions, NOT the sales date."
        data_tests: [not_null]
      - name: delivered_date
        description: >
          Date the buyer received the order (Moscow wall clock) — THE sales date. status_updated_at of a
          DELIVERED / PARTIALLY_DELIVERED order; for RETURNED (delivered, then fully returned) the status timestamp
          is the return, so this is an upper bound. NULL for anything not (yet) delivered.
      - name: rejected_date
        description: "Date the unredeemed parcel was registered back, from line events."
      - name: returned_date
        description: "Date the return was registered, from line events."
      - name: status_updated_at
        description: "Last order status change (ISO with +03:00). Incremental watermark."
        data_tests: [not_null]
      - name: order_status
        data_tests: [not_null]
      - name: line_status
        description: "delivered | partially_delivered | returned | unredeemed | cancelled | in_flight — see int_order_lines."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['delivered', 'unredeemed', 'cancelled', 'returned', 'partially_delivered', 'in_flight']
      - name: is_final
        description: "Order in a terminal status; while FALSE, units_delivered and revenue are provisional."
        data_tests: [not_null]
      - name: payment_type
        description: "PREPAID | POSTPAID — the strongest predictor of unredeemed orders (11 % vs 59 %)."
      - name: delivery_region_id
      - name: delivery_region_name
      - name: is_test_order
        description: "Marketplace test order (fake = true). Exclude from every metric."
        data_tests: [not_null]
      - name: returned_stock_type
        description: "FIT | DEFECT | EXPIRED — condition of the returned goods."
      - name: units_ordered
        data_tests: [not_null]
      - name: units_rejected
        description: "Units the buyer did not collect (REJECTED events)."
        data_tests: [not_null]
      - name: units_returned
        description: "Units returned after delivery (RETURNED events)."
        data_tests: [not_null]
      - name: units_delivered
        description: "units_ordered − units_rejected − units_returned; 0 for cancelled orders. Restated as events arrive."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: price_buyer_total
        description: "Paid by the buyer for the whole line after all discounts, Plus points included, RUB. = realization total_after_discount."
        data_tests: [not_null]
      - name: price_marketplace_total
        description: "Marketplace-funded discount on the line (promo, Plus points, coupons), compensated to the seller, RUB. The API docs call it 'coupons'; the data says it is the whole discount."
      - name: cashback_total
        description: "Plus points spent on the line, RUB — a component of price_marketplace_total, kept for the unredeemed/cashback analysis."
      - name: price_total
        description: "price_buyer_total + price_marketplace_total — the price before marketplace discounts, RUB. = realization total_before_discount (−0.7 %)."
        data_tests: [not_null]
      - name: revenue
        description: "Seller's revenue recognised on delivered_date: price_total × units_delivered / units_ordered, RUB. 0 until delivered; drops on returns (restatement)."
        data_tests: [not_null]
      - name: fee_commission
        description: "Sales commission (FEE) allocated to the line, RUB."
      - name: fee_delivery
        description: "Delivery to the buyer (DELIVERY_TO_CUSTOMER), allocated by price share — a simplification, the marketplace bills by dimensions."
      - name: fee_boost
        description: "Paid promotion (AUCTION_PROMOTION)."
      - name: fee_payment_transfer
        description: "Payment acceptance/transfer (PAYMENT_TRANSFER)."
      - name: fee_agency
      - name: fee_crossregional
      - name: fee_return_processing
        description: "Return / unredeemed parcel processing — the fee that arrives weeks after the order and is the reason for the incremental window."
      - name: fee_loyalty
      - name: fee_total
        description: "All fees of the order allocated to this line, RUB; positive = charged. Sum per order = stg_ym__order_fees (tests/assert_fees_allocation_sums.sql)."
        data_tests: [not_null]
      - name: bid_fee
        description: "Bid fee reported on the line itself (items[].bidFee), RUB — not part of fee_total."
      - name: sku_cost_key
        description: "Cost version (stg_finance__unit_costs) valid on delivered_date; null until the line is delivered or when no version covers the date."
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_finance__unit_costs')
                field: sku_cost_key
      - name: unit_cost
        description: "Unit cost of that version, RUB per unit. Reference only — not additive, do not sum in BI."
      - name: cost_basis
        description: "batch_actual | supply_allocated | plan_2024 — how much to trust the cost of this line."
        data_tests:
          - accepted_values:
              arguments:
                values: ['batch_actual', 'supply_allocated', 'plan_2024']
      - name: is_cost_estimate
        description: "true when the line is costed at a planned, not actual, unit cost (cost_basis = plan_2024). false when uncosted."
        data_tests: [not_null]
      - name: cogs
        description: "Cost of goods sold, RUB = units_delivered × unit_cost. 0 until delivered; restated with units_delivered on returns."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: cogs_estimated
        description: "The part of cogs that rests on a planned cost (= cogs when is_cost_estimate, else 0). Additive: share of margin on estimated cost = sum(cogs_estimated) / sum(cogs) in BI."
        data_tests: [not_null]
      - name: contribution_margin
        description: "revenue − fee_total − cogs, RUB. Negative for unredeemed and returned lines (fees without revenue) — the cost of невыкуп lives here, not in fct_sales_daily."
        data_tests: [not_null]
      - name: dbt_updated_at
        description: "When this row was last (re)written by dbt — shows which orders the incremental window touched."

  - name: fct_sales_daily
    description: >
      Daily sales at the grain of delivered_date × sku — the one table a dashboard page reads. A pure aggregate of
      fct_order_lines: one group by under the sales filter (delivered_date is not null, units_delivered > 0, not a
      test order), no joins, no new formulas; tests/assert_sales_daily_sums_to_order_lines.sql proves every measure
      equals the sum over the fact. Dated by receipt and restated on returns, like the fact. contribution_margin is
      the margin of what was SOLD: unredeemed and returned lines (fees without revenue) are not here — their cost
      lives in fct_order_lines. Sparse: days without sales are absent; BI fills zeros. Names and categories come
      from dim_products via reporting; ratios (margin %, fee share, estimated-cost share) are divisions of these
      sums in BI, never stored.
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "contribution_margin = revenue - fee_total - cogs"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "cogs_estimated between 0 and cogs"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "sku_orders_count between 1 and lines_count"
    columns:
      - name: sales_daily_key
        description: "Surrogate key: delivered_date + sku."
        data_tests: [unique, not_null]
      - name: delivered_date
        description: "Day the buyer received the goods (the sales date). Never null here."
        data_tests: [not_null]
      - name: sku
        description: "Seller's SKU — join key to dim_products."
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_products')
                field: sku
        data_tests: [not_null]
      - name: sku_orders_count
        description: "Orders that contained this sku on this day. Not additive across skus (an order with two skus counts once per sku) — 'orders per day' is count(distinct order_id) over fct_order_lines in BI."
        data_tests: [not_null]
      - name: lines_count
        description: "Order lines aggregated into the row."
      - name: units_delivered
        description: "Units received and kept, after returns."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: false
      - name: revenue
        description: "Seller's revenue recognised on this day, RUB (delivered share of price before marketplace discounts)."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
              config: {severity: warn}     # a fully discounted line can be 0; negative would be a bug
      - name: fee_commission
      - name: fee_delivery
      - name: fee_boost
      - name: fee_payment_transfer
      - name: fee_agency
      - name: fee_crossregional
      - name: fee_return_processing
      - name: fee_loyalty
      - name: fee_total
        description: "All marketplace fees allocated to the sold lines, RUB. Only the fees of SOLD lines — see the model description."
        data_tests: [not_null]
      - name: bid_fee
        description: "Bid fee reported on the lines, RUB — not part of fee_total."
      - name: cogs
        description: "Cost of goods sold, RUB — units_delivered × the unit cost valid on delivered_date."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: cogs_estimated
        description: "The part of cogs that rests on a planned (not actual) unit cost, RUB. Share of margin on estimated cost = sum(cogs_estimated) / sum(cogs)."
        data_tests: [not_null]
      - name: contribution_margin
        description: "revenue − fee_total − cogs, RUB — the margin of what was sold."
        data_tests: [not_null]
      - name: dbt_updated_at
        description: "Timestamp of the dbt run that built the table."

  - name: fct_inventory_turnover_monthly
    description: >
      Periodic snapshot at the grain of report_month × sku × cluster_name: the marketplace's goods-turnover
      report taken as is, one row per sku per warehouse cluster per monthly report. turnover_days is the
      marketplace's figure (stock ÷ average daily sales), NULL when the sku had no sales in the cluster; it is
      non-additive — aggregate units_on_stock and avg_daily_units_sold instead. storage_amount is paid storage for
      the period in RUB, 0 when the report shows '-' (is_storage_billed FALSE). No own turnover, no product
      attributes (dim_products). Reports exist for month ends only, enforced on stg_ym__turnover_report.
    data_tests:
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: ref('stg_ym__turnover_report')
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [report_month, sku, cluster_name]
      # 'No sales' is the only reason for a NULL turnover
      - dbt_utils.expression_is_true:
          arguments:
            expression: "has_sales = (turnover_days is not null)"
      # not billed → 0; a billed 0 is possible and is kept apart by the flag
      - dbt_utils.expression_is_true:
          arguments:
            expression: "is_storage_billed or storage_amount = 0"
    columns:
      - name: turnover_report_key
        description: "Surrogate key (report_date + sku + cluster_name), same as stg_ym__turnover_report."
        data_tests: [unique, not_null]
      - name: report_month
        description: "First day of the report month; the report itself is dated its last day."
        data_tests: [not_null]
      - name: sku
        description: "Seller's SKU as printed by the report — for the five caps this is the warehouse label (K1…K5 = dim_products.warehouse_sku), not the seller's code; resolve through dim_products before joining. Until then the relationships test warns on those rows."
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_products')
                field: sku
              config: {severity: warn}
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_ym__offers')
                field: sku
              config: {severity: warn}
      - name: cluster_name
        description: "Warehouse cluster / macro-region as the report names it (Москва, Санкт-Петербург, …) — the natural key, the marketplace has no cluster id; dim_warehouses maps warehouse_id to this name."
        data_tests: [not_null]
      - name: has_sales
        description: "FALSE when the report says 'Нет продаж' for the sku in this cluster."
        data_tests: [not_null]
      - name: market_recommendation
        description: "Marketplace's free-text advice for the sku in this cluster."
      - name: units_on_stock
        description: "Units in stock on the last day of the month — numerator of turnover_days; compare with int_stock_daily on last_day(report_month) summed over the cluster's warehouses."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: avg_daily_units_sold
        description: "Average units sold per day over the report period — denominator of turnover_days."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: avg_daily_volume_sold_l
        description: "Average volume sold per day, litres."
      - name: avg_daily_volume_on_stock_l
        description: "Average volume in stock per day, litres — the unit storage is billed in."
      - name: turnover_days
        description: "Marketplace's turnover in days; NULL when has_sales is FALSE. Non-additive: never sum or average across rows, show per sku × cluster × month."
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: storage_amount
        description: "Paid storage for the period, RUB; 0 when not billed (every row so far)."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: is_storage_billed
        description: "TRUE when the report printed an amount rather than '-'; keeps a billed 0 apart from 'not billed'."
        data_tests: [not_null]
      - name: dbt_updated_at
        description: "Timestamp of the dbt run that built the table."

  - name: dim_products
    description: >
      Conformed product dimension: one row per seller SKU (offerId = shopSku), the key every fact carries
      (fct_order_lines, fct_sales_daily, fct_inventory_daily, fct_inventory_turnover_monthly). Type 1 — the current
      card; card history is snap_offers, the price at the time of sale is in fct_order_lines. A SKU's row comes from
      the last catalogue snapshot in which it was seen: a deleted card stays with is_in_catalogue = FALSE and keeps
      its attributes. Size, colour, model and colourway are parsed from the seller's SKU code
      (<type>-<size>-<colour>-<model number>, no size segment for one-size types); a code outside the convention
      gets NULLs and is_sku_parsed = FALSE. Names, drops and lifecycle come from the seeds product_types,
      colour_codes and product_models. Lifecycle dates only — no sales sums (those are measures of the facts).
      The contract is enforced: this is the one table the whole reporting layer joins to.
    config:
      contract:
        enforced: true
    data_tests:
      # the parse is the source of four hierarchy columns: they exist together or not at all
      - dbt_utils.expression_is_true:
          arguments:
            expression: "is_sku_parsed = (model_code is not null and colour_code is not null and size is not null)"
      # a colourway is the model plus its colour
      - dbt_utils.expression_is_true:
          arguments:
            expression: "not is_sku_parsed or model_colour_code = product_type_code || '-' || colour_code || '-' || split_part(model_code, '-', 2)"
      # a one-size type has no size to sort; sized types do
      - dbt_utils.expression_is_true:
          arguments:
            expression: "not is_sku_parsed or (size = 'ONE') = (size_order = 0)"
      # a card in the catalogue is priced and measured; a missing value is a heads-up, not a broken build
      - dbt_utils.expression_is_true:
          arguments:
            expression: "not is_in_catalogue or (current_basic_price >= 1 and volume_l > 0 and weight_kg > 0)"
          config: {severity: warn}
      # nothing was delivered before it was ordered
      - dbt_utils.expression_is_true:
          arguments:
            expression: "last_delivered_date is null or last_delivered_date >= first_ordered_date"
    columns:
      - name: sku
        data_type: varchar
        description: "Seller's SKU (offerId = shopSku) — the grain and the conformed key of every fact. Immutable on the marketplace: a card can only be deleted and re-created under a new code."
        data_tests: [unique, not_null]
      - name: market_sku
        data_type: varchar
        description: "Marketplace SKU the card is bound to (mapping.marketSku). Secondary lookup only: absent while the card is not bound (card_status NO_CARD_*), and a card can be re-bound."
        data_tests:
          - not_null:
              config:
                where: "is_in_catalogue and card_status like 'HAS_CARD%'"
          - unique:
              config: {severity: warn}     # the marketplace can merge two seller cards into one of its own
      - name: warehouse_sku
        data_type: varchar
        description: "Label the marketplace warehouse prints for the SKU (WAREHOUSE_SKU of the realization report, e.g. K4 for CAP-Bur-006) — the code the turnover report uses as SHOP_SKU. Equals sku for most cards and for cards never sold. Lookup key for fct_inventory_turnover_monthly."
        data_tests: [unique, not_null]
      - name: product_name
        data_type: varchar
        description: "Card name as the seller filled it in, from the last snapshot the SKU was seen in."
        data_tests: [not_null]
      - name: market_category_name
        data_type: varchar
        description: "Marketplace category (mapping.marketCategoryName), e.g. 'Худи для взрослых'. Reference only — the dashboard axis is product_type."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Худи для взрослых', 'Лонгсливы для взрослых', 'Футболки для взрослых', 'Рубашки для взрослых', 'Кепки', 'Шарфы']
              config: {severity: warn}     # a new category is a heads-up: check product_types and the parser
      - name: product_type_code
        data_type: varchar
        description: "First segment of the SKU code in upper case (H, L, T, SH, CAP, SC). Present even when the rest of the code does not parse."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('product_types')
                field: product_type_code
              config: {severity: warn}     # unknown type = new garment type or a typo; add it to the seed
      - name: product_type
        data_type: varchar
        description: "Product type label from product_types (Hoodie, Long sleeve, T-shirt, Shirt, Cap, Scarf) — the category axis of the dashboard. NULL when the type code is not in the seed."
      - name: model_code
        data_type: varchar
        description: "The design without size and colour: product_type_code + '-' + 3-digit model number (H-001). Model numbers repeat across types, so the type is part of the code. NULL when the SKU code does not parse."
        data_tests:
          - not_null:
              config:
                where: "is_sku_parsed"
          - relationships:
              arguments:
                to: ref('product_models')
                field: model_code
              config: {severity: warn}     # a model missing from the seed shows as its code (model_name falls back)
      - name: model_name
        data_type: varchar
        description: "Design name from product_models (cumming of age, lotus); falls back to model_code when the seed has no row yet, NULL when the code does not parse."
      - name: model_colour_code
        data_type: varchar
        description: "Colourway — the model in one colour across all sizes: product_type_code + colour_code + model number (H-B-001). The level at which a production batch is decided."
      - name: colour_code
        data_type: varchar
        description: "Colour segment of the SKU code in upper case (W, E, BG, P, BUR, RD, LB, B, GR). A colour FAMILY, not a shade: B is cobalt on a hoodie and sky blue on a t-shirt."
        data_tests:
          - relationships:
              arguments:
                to: ref('colour_codes')
                field: colour_code
              config: {severity: warn}     # new colour = add a row to the seed
      - name: colour_name
        data_type: varchar
        description: "Colour family in words, from colour_codes."
      - name: size
        data_type: varchar
        description: "S / M / L / XL from the SKU code; ONE for one-size types (caps, scarves); NULL when the code does not parse."
        data_tests:
          - accepted_values:
              arguments:
                values: ['S', 'M', 'L', 'XL', 'ONE']
      - name: size_order
        data_type: number
        description: "Sort key for size: ONE = 0, S = 1, M = 2, L = 3, XL = 4 — Looker Studio sorts strings alphabetically (L, M, S, XL)."
      - name: is_sku_parsed
        data_type: boolean
        description: "TRUE when the SKU code fits the convention its type demands. FALSE rows are listed by tests/assert_sku_codes_parse.sql (warn)."
        data_tests: [not_null]
      - name: collection
        data_type: varchar
        description: "Drop / collection / season from product_models; NULL until the brand fills it in."
      - name: lifecycle_status
        data_type: varchar
        description: "Production status from product_models: new / core / limited / discontinued. Not 'is active': the card status is card_status / is_archived, the stock status is in fct_inventory_daily."
        data_tests:
          - accepted_values:
              arguments:
                values: ['new', 'core', 'limited', 'discontinued']
      - name: launch_date
        data_type: date
        description: "Day the model went on sale, from product_models (editorial). Compare with first_ordered_date, the observed first demand."
      - name: discontinued_date
        data_type: date
        description: "Day production stopped, from product_models; NULL unless lifecycle_status = discontinued."
      - name: first_ordered_date
        data_type: date
        description: "First order containing the SKU, every order counted (cancelled included): the first time somebody wanted it. NULL for SKUs never ordered."
      - name: last_delivered_date
        data_type: date
        description: "Last day a unit of the SKU was received by a buyer (status timestamp of a DELIVERED / PARTIALLY_DELIVERED order with units_delivered > 0, Moscow date — the same rule as delivered_date in fct_order_lines; RETURNED orders excluded, their timestamp is the return). NULL for SKUs never delivered."
      - name: current_basic_price
        data_type: number(18,2)
        description: "Seller's price list value today (basicPrice.value), RUB. NOT the price of past sales — that is price_buyer_per_item in fct_order_lines. Never multiply units by this column."
      - name: current_price_before_discount
        data_type: number(18,2)
        description: "Strike-through price today (basicPrice.discountBase), RUB; equals current_basic_price when no discount is shown, so a discount share never divides by NULL."
      - name: volume_l
        data_type: number(18,3)
        description: "Package volume, litres: length × width × height in cm / 1000. Comparable with volume_l of the turnover report."
      - name: weight_kg
        data_type: number(10,3)
        description: "Package weight, kg (weightDimensions.weight). Candidate base for delivery-fee allocation."
      - name: card_status
        data_type: varchar
        description: "Marketplace card status at the last snapshot (HAS_CARD_CAN_UPDATE, NO_CARD_* while the card is being created)."
      - name: is_archived
        data_type: boolean
        description: "TRUE when the seller archived the card (offer.archived)."
        data_tests: [not_null]
      - name: is_in_catalogue
        data_type: boolean
        description: "TRUE when the SKU is present in the latest catalogue snapshot; FALSE for a card that has been deleted since — the row stays so history keeps its attributes (tests/assert_no_orphans.sql warns when this happens)."
        data_tests: [not_null]
      - name: catalogue_snapshot_date
        data_type: date
        description: "Snapshot the row comes from: the latest export for cards in the catalogue, the last day the SKU was seen for deleted ones."
        data_tests: [not_null]
      - name: dbt_updated_at
        data_type: timestamp_ltz
        description: "Timestamp of the dbt run that built the table."

unit_tests:
  - name: dim_products_parses_sku_codes
    description: >
      The SKU-code parser on one row per branch: sized type, one-size type in lower case, short model number,
      missing size segment, unknown type, size outside the list. Everything else is mocked empty.
    model: dim_products
    given:
      - input: ref('stg_ym__offers')
        rows:
          - {sku: 'H-L-B-001',   snapshot_date: 2026-09-09}
          - {sku: 'sc-Gr-001',   snapshot_date: 2026-09-09}
          - {sku: 'CAP-Bg-6',    snapshot_date: 2026-09-09}
          - {sku: 'H-B-001',     snapshot_date: 2026-09-09}
          - {sku: 'SW-M-B-015',  snapshot_date: 2026-09-09}
          - {sku: 'H-XXL-B-001', snapshot_date: 2026-09-09}
      - input: ref('product_types')
        rows:
          - {product_type_code: 'H',   product_type: 'Hoodie', has_sizes: true,  sort_order: 1}
          - {product_type_code: 'CAP', product_type: 'Cap',    has_sizes: false, sort_order: 5}
          - {product_type_code: 'SC',  product_type: 'Scarf',  has_sizes: false, sort_order: 6}
