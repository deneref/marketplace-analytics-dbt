version: 2

models:
  - name: fct_order_lines
    description: >
      Transaction fact at the grain of order × line, the unit of sale. One row per line of each order in
      orders_stats since 2025-01, test orders included (filter on is_test_order). Money: price_buyer_total is what
      the buyer paid after all discounts and reconciles to the realization report's total_after_discount exactly.
      price_total adds the marketplace-funded discount (reconciles to total_before_discount within 0.7 %). revenue
      is the delivered share of price_total and is restated when a return arrives. Fees are the order's fees allocated
      to the line in int_order_lines; they are charged whether or not the line gets delivered. Sales are dated by
      delivered_date (receipt), not ordered_date. Cost of goods is joined here at the line grain (unit cost of the
      version valid on delivered_date, from the partner's finance workbooks). That way contribution_margin exists at
      the finest grain and fct_sales_daily is one group by over this table.
      Incremental: delete+insert by order_id with a 30-day window on status_updated_at. The window widens to all rows
      when the cost file was reloaded. It also picks up orders whose row in the business-orders source was loaded
      after the last run. The loss reason comes from a source with its own schedule, and a window anchored to the
      order's own clock would never revisit those orders. A change to the reason tree or to var pickup_storage_days
      reloads nothing, so it has to be followed by a run with --full-refresh. The same applies to the first release of
      the loss columns. tests/assert_fct_order_lines_is_current.sql compares all columns that can go stale against
      int_order_lines, so a forgotten --full-refresh shows up as a red test.
    data_tests:
      # incremental must not lose rows against its parent
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: ref('int_order_lines')
      # revenue exists only for delivered units
      - dbt_utils.expression_is_true:
          arguments:
            expression: "not (units_delivered = 0 and revenue <> 0)"
      # A reason exists where units were refused and only there, checked in both directions. Left to right it guards
      # against an order-level attribute smeared over the lines the buyer kept. Right to left it catches a refused line
      # that lost its reason (a tree change, a gap in the source). The same test runs on int_order_lines; this table is
      # a materialised copy, and the incremental window is one more way for the two to diverge.
      - dbt_utils.expression_is_true:
          arguments:
            expression: "(loss_reason is not null) = (units_rejected > 0)"
      # a flag about a reason that does not exist is meaningless
      - dbt_utils.expression_is_true:
          arguments:
            expression: "loss_reason_is_inferred is null or loss_reason is not null"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "not (delivered_date is not null and units_delivered > 0 and revenue <= 0)"
          config: {severity: warn}          # a delivered line at 0 ₽ is possible (full discount), so warn and check it
      # nothing is recognised before receipt: in-flight lines have forecast units but no money
      - dbt_utils.expression_is_true:
          arguments:
            expression: "not (delivered_date is null and (revenue <> 0 or cogs <> 0))"
      # a sale has a date of receipt; an unsold line has none
      - dbt_utils.expression_is_true:
          arguments:
            expression: "(delivered_date is not null) = (order_status in ('DELIVERED', 'PARTIALLY_DELIVERED', 'RETURNED'))"
      # price arithmetic
      - dbt_utils.expression_is_true:
          arguments:
            expression: "price_total = price_buyer_total + coalesce(price_marketplace_total, 0)"
      # cost arithmetic: cogs only for delivered units, at the version's unit cost; estimated part never exceeds the whole
      - dbt_utils.expression_is_true:
          arguments:
            expression: "cogs = round(units_delivered * coalesce(unit_cost, 0), 2)"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "not (units_delivered = 0 and cogs <> 0)"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "cogs_estimated = iff(is_cost_estimate, cogs, 0)"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "contribution_margin = revenue - fee_total - cogs"
      # a costed line carries its cost version; an uncosted delivered line is caught (warn) by tests/assert_delivered_lines_have_unit_cost.sql
      - dbt_utils.expression_is_true:
          arguments:
            expression: "(unit_cost is not null) = (sku_cost_key is not null)"
    columns:
      - name: order_line_key
        description: "Surrogate key (order_id + line_index), same as int_order_lines."
        data_tests: [unique, not_null]
      - name: order_id
        description: "Marketplace order id. Degenerate dimension (there is no dim_orders). Incremental key."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('int_order_lines')
                field: order_id
      - name: line_index
        data_tests: [not_null]
      - name: sku
        description: "Seller's SKU, FK to dim_products."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_products')
                field: sku
      - name: market_sku
        description: "Marketplace's SKU of the same offer."
      - name: warehouse_id
        description: "FK to dim_warehouses (add the relationships test when dim_warehouses exists)."
      - name: ordered_date
        description: "Order creation date. Use it for cohort and demand questions; it is NOT the sales date."
        data_tests: [not_null]
      - name: delivered_date
        description: >
          Date the buyer received the order (Moscow wall clock). This is THE sales date: status_updated_at of a
          DELIVERED / PARTIALLY_DELIVERED order. For RETURNED (delivered, then fully returned) the status timestamp
          is the return, so this is an upper bound. NULL for anything not (yet) delivered.
      - name: rejected_date
        description: "Date the unredeemed parcel was registered back, from line events."
      - name: returned_date
        description: "Date the return was registered, from line events."
      - name: status_updated_at
        description: "Last order status change (ISO with +03:00). Incremental watermark."
        data_tests: [not_null]
      - name: order_status
        data_tests: [not_null]
      - name: line_status
        description: "delivered | partially_delivered | returned | unredeemed | cancelled | in_flight (see int_order_lines)."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['delivered', 'unredeemed', 'cancelled', 'returned', 'partially_delivered', 'in_flight']
      - name: is_final
        description: "Order in a terminal status; while FALSE, units_delivered and revenue are provisional."
        data_tests: [not_null]
      - name: payment_type
        description: "PREPAID | POSTPAID. The strongest predictor of unredeemed orders (11 % vs 59 %)."
      - name: delivery_region_id
      - name: delivery_region_name
      - name: is_test_order
        description: "Marketplace test order (fake = true). Exclude from all metrics."
        data_tests: [not_null]
      - name: returned_stock_type
        description: "FIT | DEFECT | EXPIRED: condition of the returned goods."
      - name: is_order_partly_kept
        description: >
          The order kept some units and lost others. So the parcel was opened and the buyer handed this line back.
          This is the only evidence in stats/orders that tells a refusal from a no-show (the report has no
          substatus), and rpt_sales_daily splits unredeemed on it. See int_order_lines for the caveat.
        data_tests: [not_null]
      - name: loss_reason
        description: >
          Why the units of this line were refused. The values and how each one is decided are documented in
          int_order_lines.loss_reason and int_order_cancellations. This column is a materialised copy of that one and has
          no definition of its own. NULL where nothing was refused, including all returned lines: a return happens after
          receipt, and its stated reason lives in the returns API, which is not ingested.
          It is easy to misread in three ways.
          (1) It combines with units_rejected, fee_total and contribution_margin, never with revenue. A fully lost line
          has revenue 0, but a line that lost only part of its units keeps the revenue of the rest (line_status
          partially_delivered; there was one such line in the whole history as of 2026-09-12). So "revenue by loss reason"
          returns a small plausible number where an obvious zero would be expected.
          (2) Filtering losses on `loss_reason is not null` drops the returned lines (81 lines, ≈65 000 ₽ of fees as of
          2026-09-12), because a return has no reason here. Filter on line_status or units_rejected instead.
          (3) The population differs from the loss rows of rpt_sales_daily. That view takes lines with line_status in
          ('unredeemed','returned'), while a reason also sits on partially refused lines that the view counts as sales.
          Both are defensible, and a number has to say which question it answers.
          'not_in_source' is not a reason. It means the order has not been pulled from the business-orders source yet;
          tests/assert_loss_reason_coverage.sql watches its share.
        data_tests:
          - accepted_values:
              arguments:
                values: ['refused_at_handover', 'not_collected', 'cancelled_by_buyer', 'not_paid', 'delivery_failed',
                         'unknown', 'not_in_source']
      - name: loss_reason_is_inferred
        description: "TRUE when this line's reason rests on the storage-window inference instead of a statement by the marketplace. As of 2026-09-12 that held for 402 of the 415 refusals among the 693 unredeemed orders. FALSE for the line-level evidence (the parcel was demonstrably opened). NULL where there is no reason to speak of, including 'unknown' and 'not_in_source'."
      - name: units_ordered
        data_tests: [not_null]
      - name: units_rejected
        description: "Units the buyer did not collect (REJECTED events)."
        data_tests: [not_null]
      - name: units_returned
        description: "Units returned after delivery (RETURNED events)."
        data_tests: [not_null]
      - name: units_rejected_defect
        description: "Of units_rejected, the units booked as DEFECT at the warehouse, i.e. unsellable. Lower bound (stockType appears only after processing). Their cost is not written off anywhere in the model yet."
        data_tests: [not_null]
      - name: units_returned_defect
        description: "Of units_returned, the units booked as DEFECT. Same lower bound, same gap in the cost."
        data_tests: [not_null]
      - name: units_delivered
        description: "units_ordered − units_rejected − units_returned; 0 for cancelled orders. Restated as events arrive."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: price_buyer_total
        description: "Paid by the buyer for the whole line after all discounts, Plus points included, RUB. = realization total_after_discount."
        data_tests: [not_null]
      - name: price_marketplace_total
        description: "Marketplace-funded discount on the line (promo, Plus points, coupons), compensated to the seller, RUB. The API docs call it 'coupons', but the data shows it is the whole discount."
      - name: cashback_total
        description: "Plus points spent on the line, RUB. A component of price_marketplace_total, kept for the unredeemed/cashback analysis."
      - name: price_total
        description: "price_buyer_total + price_marketplace_total, i.e. the price before marketplace discounts, RUB. = realization total_before_discount (−0.7 %)."
        data_tests: [not_null]
      - name: revenue
        description: "Seller's revenue recognised on delivered_date: price_total × units_delivered / units_ordered, RUB. 0 until delivered; drops on returns (restatement)."
        data_tests: [not_null]
      - name: fee_commission
        description: "Sales commission (FEE) allocated to the line, RUB."
      - name: fee_delivery
        description: "Delivery to the buyer (DELIVERY_TO_CUSTOMER), allocated by price share. This is a simplification, since the marketplace bills by dimensions."
      - name: fee_boost
        description: "Paid promotion (AUCTION_PROMOTION)."
      - name: fee_payment_transfer
        description: "Payment acceptance/transfer (PAYMENT_TRANSFER)."
      - name: fee_agency
      - name: fee_crossregional
      - name: fee_return_processing
        description: "Return / unredeemed parcel processing. This fee arrives weeks after the order and is the reason for the incremental window."
      - name: fee_loyalty
      - name: fee_total
        description: "All fees of the order allocated to this line, RUB; positive = charged. Sum per order = stg_ym__order_fees (tests/assert_fees_allocation_sums.sql)."
        data_tests: [not_null]
      - name: bid_fee
        description: "Bid fee reported on the line itself (items[].bidFee), RUB. Not part of fee_total."
      - name: sku_cost_key
        description: "Cost version (stg_finance__unit_costs) valid on delivered_date; null until the line is delivered or when no version covers the date."
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_finance__unit_costs')
                field: sku_cost_key
      - name: unit_cost
        description: "Unit cost of that version, RUB per unit. Reference only; it is not additive, so do not sum it in BI."
      - name: cost_basis
        description: "batch_actual | supply_allocated | plan_2024: how much to trust the cost of this line."
        data_tests:
          - accepted_values:
              arguments:
                values: ['batch_actual', 'supply_allocated', 'plan_2024']
      - name: is_cost_estimate
        description: "true when the line is costed at a planned, not actual, unit cost (cost_basis = plan_2024). false when uncosted."
        data_tests: [not_null]
      - name: cogs
        description: "Cost of goods sold, RUB = units_delivered × unit_cost. 0 until delivered; restated with units_delivered on returns."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: cogs_estimated
        description: "The part of cogs that rests on a planned cost (= cogs when is_cost_estimate, else 0). It is additive, so in BI the share of margin on estimated cost = sum(cogs_estimated) / sum(cogs)."
        data_tests: [not_null]
      - name: contribution_margin
        description: "revenue − fee_total − cogs, RUB. Negative for unredeemed and returned lines (fees without revenue). The cost of невыкуп shows up here; fct_sales_daily does not carry it."
        data_tests: [not_null]
      - name: dbt_updated_at
        description: "When dbt last (re)wrote this row. Shows which orders the incremental window touched."

  - name: fct_sales_daily
    description: >
      Daily sales at the grain of delivered_date × sku. This is the only table a dashboard page reads. It is a pure
      aggregate of fct_order_lines: one group by under the sales filter (delivered_date is not null, units_delivered > 0,
      not a test order), with no joins and no new formulas. tests/assert_sales_daily_sums_to_order_lines.sql checks that
      each measure equals the sum over the fact. Like the fact, it is dated by receipt and restated on returns.
      contribution_margin is the margin of what was SOLD. Unredeemed and returned lines (fees without revenue) are
      left out, and their cost stays in fct_order_lines. The table is sparse: days without sales are absent and BI
      fills zeros. Names and categories come from dim_products via reporting. Ratios (margin %, fee share,
      estimated-cost share) are computed in BI as divisions of these sums and are never stored.
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "contribution_margin = revenue - fee_total - cogs"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "cogs_estimated between 0 and cogs"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "sku_orders_count between 1 and lines_count"
    columns:
      - name: sales_daily_key
        description: "Surrogate key: delivered_date + sku."
        data_tests: [unique, not_null]
      - name: delivered_date
        description: "Day the buyer received the goods (the sales date). Never null here."
        data_tests: [not_null]
      - name: sku
        description: "Seller's SKU, join key to dim_products."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_products')
                field: sku
      - name: sku_orders_count
        description: "Orders that contained this sku on this day. Not additive across skus (an order with two skus counts once per sku). For 'orders per day' use count(distinct order_id) over fct_order_lines in BI."
        data_tests: [not_null]
      - name: lines_count
        description: "Order lines aggregated into the row."
      - name: units_delivered
        description: "Units received and kept, after returns."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: false
      - name: revenue
        description: "Seller's revenue recognised on this day, RUB (delivered share of price before marketplace discounts)."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
              config: {severity: warn}     # a fully discounted line can be 0; negative would be a bug
      - name: fee_commission
      - name: fee_delivery
      - name: fee_boost
      - name: fee_payment_transfer
      - name: fee_agency
      - name: fee_crossregional
      - name: fee_return_processing
      - name: fee_loyalty
      - name: fee_total
        description: "All marketplace fees allocated to the sold lines, RUB. Only the fees of SOLD lines (see the model description)."
        data_tests: [not_null]
      - name: bid_fee
        description: "Bid fee reported on the lines, RUB. Not part of fee_total."
      - name: cogs
        description: "Cost of goods sold, RUB: units_delivered × the unit cost valid on delivered_date."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: cogs_estimated
        description: "The part of cogs that rests on a planned (not actual) unit cost, RUB. Share of margin on estimated cost = sum(cogs_estimated) / sum(cogs)."
        data_tests: [not_null]
      - name: contribution_margin
        description: "revenue − fee_total − cogs, RUB. The margin of what was sold."
        data_tests: [not_null]
      - name: dbt_updated_at
        description: "Timestamp of the dbt run that built the table."

  - name: fct_inventory_turnover_monthly
    description: >
      Periodic snapshot at the grain of report_month × sku × cluster_name. It is the marketplace's goods-turnover
      report taken as is, one row per sku per warehouse cluster per monthly report. turnover_days is the
      marketplace's figure (stock ÷ average daily sales), NULL when the sku had no sales in the cluster. It is
      non-additive, so aggregate units_on_stock and avg_daily_units_sold instead. storage_amount is paid storage for
      the period in RUB, 0 when the report shows '-' (is_storage_billed FALSE). The model computes no turnover of its
      own and carries no product attributes (those are in dim_products). Reports exist for month ends only, which is
      enforced on stg_ym__turnover_report.
    data_tests:
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: ref('stg_ym__turnover_report')
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [report_month, sku, cluster_name]
      # 'No sales' is the only reason for a NULL turnover
      - dbt_utils.expression_is_true:
          arguments:
            expression: "has_sales = (turnover_days is not null)"
      # not billed means 0; a billed 0 is possible, and the flag keeps it apart
      - dbt_utils.expression_is_true:
          arguments:
            expression: "is_storage_billed or storage_amount = 0"
    columns:
      - name: turnover_report_key
        description: "Surrogate key (report_date + sku + cluster_name), same as stg_ym__turnover_report."
        data_tests: [unique, not_null]
      - name: report_month
        description: "First day of the report month; the report itself is dated its last day."
        data_tests: [not_null]
      - name: sku
        description: "SKU as printed by the report. This is the WAREHOUSE label and not always the seller's code; the five caps come as K1…K5. Join on dim_products.warehouse_sku (unique, equals sku for all other cards), and resolve to the seller's sku through dim_products before joining any other fact."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_products')
                field: warehouse_sku
      - name: cluster_name
        description: "Warehouse cluster / macro-region as the report names it (Москва, Санкт-Петербург, …). It is the natural key, since the marketplace has no cluster id; dim_warehouses maps warehouse_id to this name."
        data_tests: [not_null]
      - name: has_sales
        description: "FALSE when the report says 'Нет продаж' for the sku in this cluster."
        data_tests: [not_null]
      - name: market_recommendation
        description: "Marketplace's free-text advice for the sku in this cluster."
      - name: units_on_stock
        description: "Units in stock on the last day of the month, the numerator of turnover_days. Compare with int_stock_daily on last_day(report_month) summed over the cluster's warehouses."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: avg_daily_units_sold
        description: "Average units sold per day over the report period (denominator of turnover_days)."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: avg_daily_volume_sold_l
        description: "Average volume sold per day, litres."
      - name: avg_daily_volume_on_stock_l
        description: "Average volume in stock per day, litres. Storage is billed in this unit."
      - name: turnover_days
        description: "Marketplace's turnover in days; NULL when has_sales is FALSE. Non-additive: never sum or average across rows, show per sku × cluster × month."
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: storage_amount
        description: "Paid storage for the period, RUB; 0 when not billed (every row so far)."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: is_storage_billed
        description: "TRUE when the report printed an amount instead of '-'. Keeps a billed 0 apart from 'not billed'."
        data_tests: [not_null]
      - name: dbt_updated_at
        description: "Timestamp of the dbt run that built the table."

  - name: fct_inventory_daily
    description: >
      Periodic snapshot of stock at the grain of snapshot_date × sku × warehouse_id. The table is DENSE: one row per
      report day for each sku × warehouse pair the stocks-on-warehouses report has ever listed, starting from the day
      the pair first appeared. So the denominator of "days in stock" starts on a different day for each pair (the day
      the card reached that warehouse, not 2025-01-08).
      snapshot_date is the END of that day (Moscow). An order placed on day D is reserved in the row of D, so the stock
      a buyer saw when ordering on D is the row of D − 1. Demand therefore joins on ordered_date − 1 and never on
      delivered_date.
      Absence is zero. A pair the report skips on a given day gets a row of zeros with is_reported = FALSE. The report
      prints its zeros itself and has never dropped a pair that still had units, so the fill is a guarantee. A day with
      no report is absent from the table and is not treated as zero.
      sku is the seller's code (the report's ARTICLE); the warehouse label (K4) is reported_sku. The buckets are the
      report's own and are not additive, so read one column at a time.
      There is no is_out_of_stock column, because on this grain BI would average it into "share of warehouses without
      the sku". "In stock for a buyer" is sum(units_available) > 0 over warehouses in rpt_stock_days. last_stocked_date
      and next_stocked_date tell a stock-out apart from a card before its first delivery or after its last unit.
      Rows whose warehouse name has no id are excluded, and tests/assert_inventory_daily_excludes_no_units.sql raises
      an error if that drops any units. Names, demand and ratios are left out; velocity and days of cover live in
      reporting.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [snapshot_date, sku, warehouse_id]
      # a filled row is all zeros; a reported row carries its label
      - dbt_utils.expression_is_true:
          arguments:
            expression: "is_reported or (units_fit = 0 and units_available = 0 and units_freeze = 0 and units_quarantine = 0 and units_defect = 0 and units_expired = 0 and units_utilization = 0)"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "is_reported = (reported_sku is not null)"
      # good stock is sellable + reserved. The report occasionally shows a reservation after the unit left the good
      # stock (fit short by 1–2). Fit is never above the sum or below available (0 rows of either in 611 reports)
      - dbt_utils.expression_is_true:
          arguments:
            expression: "units_fit between units_available and units_available + units_freeze"
      # a report requested for the current day is a mid-day state (daily.sh asks for yesterday at most)
      - dbt_utils.expression_is_true:
          arguments:
            expression: "snapshot_date < convert_timezone('Europe/Moscow', current_timestamp())::date"
          config: {severity: warn}
      # the life-of-pair dates must agree with the row's own stock
      - dbt_utils.expression_is_true:
          arguments:
            expression: "(units_fit > 0) = coalesce(last_stocked_date = snapshot_date, false)"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "next_stocked_date is null or next_stocked_date > snapshot_date"
    columns:
      - name: inventory_daily_key
        description: "Surrogate key: snapshot_date + sku + warehouse_id."
        data_tests: [unique, not_null]
      - name: snapshot_date
        description: "Day the stock is as of: END of day, Moscow (= reportDate of the report). The stock available to buyers during day D is the row of D − 1."
        data_tests: [not_null]
      - name: sku
        description: "Seller's SKU, join key to dim_products. Taken from the report's ARTICLE column, so the five caps (K1…K5) and a decommissioned card ('dcmp-…', which becomes Sh-M-W-012) arrive already resolved."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_products')
                field: sku
      - name: warehouse_id
        description: "Marketplace warehouse id (GET v2/warehouses), resolved from the report's warehouse name in int_stock_daily."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_ym__warehouses')
                field: warehouse_id
      - name: reported_sku
        description: "SKU exactly as the report printed it (K4 for CAP-Bur-006, equal to sku otherwise). NULL on a filled row (is_reported = FALSE). For tracing only, never use it as a join key."
      - name: is_reported
        description: "TRUE when the report listed this sku at this warehouse that day (even with all buckets 0). FALSE when the calendar filled the row in: the pair was absent from the report, which means nothing was there."
        data_tests: [not_null]
      - name: units_available
        description: "Units a buyer could order at the end of the day (AVAILABLE_FOR_ORDER). Use this column for 'in stock'."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: units_freeze
        description: "Units reserved for placed orders, not yet shipped (RESERVED). Grows by the units ordered that day."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: units_fit
        description: "Good stock (VALID) = units_available + units_freeze, occasionally 1–2 short when a reservation outlives the unit. Base for stock value and days of cover."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: units_quarantine
        description: "Units held back from sale by the warehouse (QUARANTINE)."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: units_defect
        description: "Units marked defective (DEFECT), not for sale. The loss is not in cogs yet."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: units_expired
        description: "Units past their date (EXPIRED). 0 for apparel so far; kept because the report has the bucket."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: units_utilization
        description: "Units awaiting disposal (UTILIZATION)."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: last_stocked_date
        description: "Latest day up to and including this one when the pair had good stock (units_fit > 0). NULL = the card is listed at this warehouse but no unit has arrived yet. Equals snapshot_date when the row itself has stock."
      - name: next_stocked_date
        description: "First LATER day when the pair has good stock again; NULL = none so far (a stock-out that has not ended, or a sold-out card). Rebuilt every run, so it changes as reports arrive. A zero row with last_stocked_date set and next_stocked_date set is a stock-out inside the life of the pair."
      - name: dbt_updated_at
        description: "Timestamp of the dbt run that built the table."

  - name: dim_products
    description: >
      Conformed product dimension: one row per seller SKU (offerId = shopSku), the key all facts carry
      (fct_order_lines, fct_sales_daily, fct_inventory_daily, fct_inventory_turnover_monthly). Type 1, i.e. the current
      card. Card history is in snap_offers, and the price at the time of sale is in fct_order_lines. A SKU's row comes
      from the last catalogue snapshot in which it was seen, so a deleted card stays with is_in_catalogue = FALSE and
      keeps its attributes. Size, colour, model and colourway are parsed from the seller's SKU code
      (<type>-<size>-<colour>-<model number>, no size segment for one-size types). A code outside the convention
      gets NULLs and is_sku_parsed = FALSE. Names, drops and lifecycle come from the seeds product_types,
      colour_codes and product_models. Only lifecycle dates are kept here; sales sums are measures of the facts.
      The contract is enforced since this is the one table the whole reporting layer joins to.
    config:
      contract:
        enforced: true
    data_tests:
      # the parse feeds four hierarchy columns, so they are either all present or all missing
      - dbt_utils.expression_is_true:
          arguments:
            expression: "is_sku_parsed = (model_code is not null and colour_code is not null and size is not null)"
      # a colourway is the model plus its colour
      - dbt_utils.expression_is_true:
          arguments:
            expression: "not is_sku_parsed or model_colour_code = product_type_code || '-' || colour_code || '-' || split_part(model_code, '-', 2)"
      # a one-size type has no size to sort; sized types do
      - dbt_utils.expression_is_true:
          arguments:
            expression: "not is_sku_parsed or (size = 'ONE') = (size_order = 0)"
      # a card in the catalogue is priced and measured; a missing value only warns and does not break the build
      - dbt_utils.expression_is_true:
          arguments:
            expression: "not is_in_catalogue or coalesce(current_basic_price >= 1 and volume_l > 0 and weight_kg > 0, false)"
          config: {severity: warn}
      # nothing was delivered before it was ordered
      - dbt_utils.expression_is_true:
          arguments:
            expression: "last_delivered_date is null or last_delivered_date >= first_ordered_date"
      # last-seen semantics: a row is "in the catalogue" if and only if it comes from the latest export
      - dbt_utils.expression_is_true:
          arguments:
            expression: "is_in_catalogue = (catalogue_snapshot_date = (select max(snapshot_date) from {{ ref('stg_ym__offers') }}))"
      # all warehouse labels of the realization report resolve to their sku (tests/assert_warehouse_labels_resolve.sql)
    columns:
      - name: sku
        data_type: varchar
        description: "Seller's SKU (offerId = shopSku), the grain and the conformed key of all facts. Immutable on the marketplace; a card can only be deleted and re-created under a new code."
        data_tests: [unique, not_null]
      - name: market_sku
        data_type: varchar
        description: "Marketplace SKU the card is bound to (mapping.marketSku). Secondary lookup only. It is absent while the card is not bound (card_status NO_CARD_*), and a card can be re-bound."
        data_tests:
          - not_null:
              config:
                where: "is_in_catalogue and card_status like 'HAS_CARD%'"
          - unique:
              config: {severity: warn}     # the marketplace can merge two seller cards into one of its own
      - name: warehouse_sku
        data_type: varchar
        description: "Label the marketplace warehouse prints for the SKU (WAREHOUSE_SKU of the realization report, e.g. K4 for CAP-Bur-006). The turnover report uses this code as SHOP_SKU. Equals sku for most cards and for cards never sold. Join key of fct_inventory_turnover_monthly."
        data_tests:
          - not_null
          - unique:
              config:
                where: "is_in_catalogue"    # a re-created card may inherit the warehouse label of the deleted one
      - name: product_name
        data_type: varchar
        description: "Card name as the seller filled it in, from the last snapshot the SKU was seen in."
        data_tests: [not_null]
      - name: market_category_name
        data_type: varchar
        description: "Marketplace category (mapping.marketCategoryName), e.g. 'Худи для взрослых'. Reference only; the dashboard axis is product_type. Absent while the card is not yet bound (NO_CARD_*)."
        data_tests:
          - not_null:
              config:
                where: "is_in_catalogue and card_status like 'HAS_CARD%'"
          - accepted_values:
              arguments:
                values: ['Худи для взрослых', 'Лонгсливы для взрослых', 'Футболки для взрослых', 'Рубашки для взрослых', 'Кепки', 'Шарфы']
              config: {severity: warn}     # a new category only warns; check product_types and the parser
      - name: product_type_code
        data_type: varchar
        description: "First segment of the SKU code in upper case (H, L, T, SH, CAP, SC). Present even when the rest of the code does not parse."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('product_types')
                field: product_type_code
              config: {severity: warn}     # unknown type = new garment type or a typo; add it to the seed
      - name: product_type
        data_type: varchar
        description: "Product type label from product_types (Hoodie, Long sleeve, T-shirt, Shirt, Cap, Scarf), used as the category axis of the dashboard. NULL when the type code is not in the seed."
      - name: model_code
        data_type: varchar
        description: "The design without size and colour: product_type_code + '-' + 3-digit model number (H-001). Model numbers repeat across types, so the type is part of the code. NULL when the SKU code does not parse."
        data_tests:
          - not_null:
              config:
                where: "is_sku_parsed"
          - relationships:
              arguments:
                to: ref('product_models')
                field: model_code
              config: {severity: warn}     # a model missing from the seed shows as its code (model_name falls back)
      - name: model_name
        data_type: varchar
        description: "Design name from product_models (cumming of age, lotus); falls back to model_code when the seed has no row yet, NULL when the code does not parse."
      - name: model_colour_code
        data_type: varchar
        description: "Colourway, i.e. the model in one colour across all sizes: product_type_code + colour_code + model number (H-B-001). Production batches are decided at this level."
      - name: colour_code
        data_type: varchar
        description: "Colour segment of the SKU code in upper case (W, E, BG, P, BUR, RD, LB, B, GR). A colour FAMILY, not a shade: B is cobalt on a hoodie and sky blue on a t-shirt."
        data_tests:
          - relationships:
              arguments:
                to: ref('colour_codes')
                field: colour_code
              config: {severity: warn}     # new colour = add a row to the seed
      - name: colour_name
        data_type: varchar
        description: "Colour family in words, from colour_codes."
      - name: size
        data_type: varchar
        description: "S / M / L / XL from the SKU code; ONE for one-size types (caps, scarves); NULL when the code does not parse."
        data_tests:
          - accepted_values:
              arguments:
                values: ['S', 'M', 'L', 'XL', 'ONE']
      - name: size_order
        data_type: number
        description: "Sort key for size: ONE = 0, S = 1, M = 2, L = 3, XL = 4. Needed because Looker Studio sorts strings alphabetically (L, M, S, XL)."
      - name: is_sku_parsed
        data_type: boolean
        description: "TRUE when the SKU code fits the convention its type demands. FALSE rows are listed by tests/assert_sku_codes_parse.sql (warn)."
        data_tests: [not_null]
      - name: collection
        data_type: varchar
        description: "Drop / collection / season from product_models; NULL until the brand fills it in."
      - name: lifecycle_status
        data_type: varchar
        description: "Production status from product_models: new / core / limited / discontinued. It does not mean 'is active'. Card status is card_status / is_archived, and stock status is in fct_inventory_daily."
        data_tests:
          - accepted_values:
              arguments:
                values: ['new', 'core', 'limited', 'discontinued']
      - name: launch_date
        data_type: date
        description: "Day the model went on sale, from product_models (editorial). Compare with first_ordered_date, the observed first demand."
      - name: discontinued_date
        data_type: date
        description: "Day production stopped, from product_models; NULL unless lifecycle_status = discontinued."
      - name: first_ordered_date
        data_type: date
        description: "First order containing the SKU, counting all orders (cancelled included), i.e. the first time somebody wanted it. NULL for SKUs never ordered."
      - name: last_delivered_date
        data_type: date
        description: "Last day a unit of the SKU was received by a buyer: the status timestamp of a DELIVERED / PARTIALLY_DELIVERED order with units_delivered > 0, as a Moscow date (same rule as delivered_date in fct_order_lines). RETURNED orders are excluded, since their timestamp is the return. NULL for SKUs never delivered."
      - name: current_basic_price
        data_type: number(18,2)
        description: "Seller's price list value today (basicPrice.value), RUB. NOT the price of past sales; for that, see price_buyer_per_item in fct_order_lines. Never multiply units by this column."
      - name: current_price_before_discount
        data_type: number(18,2)
        description: "Strike-through price today (basicPrice.discountBase), RUB; equals current_basic_price when no discount is shown, so a discount share never divides by NULL."
      - name: volume_l
        data_type: number(18,3)
        description: "Package volume, litres: length × width × height in cm / 1000. Comparable with volume_l of the turnover report."
      - name: weight_kg
        data_type: number(10,3)
        description: "Package weight, kg (weightDimensions.weight). Candidate base for delivery-fee allocation."
      - name: card_status
        data_type: varchar
        description: "Marketplace card status at the last snapshot (HAS_CARD_CAN_UPDATE, NO_CARD_* while the card is being created)."
      - name: is_archived
        data_type: boolean
        description: "TRUE when the seller archived the card (offer.archived)."
        data_tests: [not_null]
      - name: is_in_catalogue
        data_type: boolean
        description: "TRUE when the SKU is present in the latest catalogue snapshot; FALSE for a card that has been deleted since. The row stays so history keeps its attributes (tests/assert_catalogue_deletions_reviewed.sql warns when this happens)."
        data_tests: [not_null]
      - name: catalogue_snapshot_date
        data_type: date
        description: "Snapshot the row comes from: the latest export for cards in the catalogue, the last day the SKU was seen for deleted ones."
        data_tests: [not_null]
      - name: dbt_updated_at
        data_type: timestamp_ltz
        description: "Timestamp of the dbt run that built the table."

  - name: dim_warehouses
    description: >
      One row per marketplace (FBY) warehouse ever listed by GET v2/warehouses (13 as of 2026-09-15). It holds the
      names, places and roles behind warehouse_id in fct_order_lines (shipped from) and fct_inventory_daily (where the
      stock sits). The marketplace's list gives name, address and whether the warehouse is still listed (is_current).
      The seed warehouse_attributes adds the turnover cluster (join key to fct_inventory_turnover_monthly.cluster_name)
      and the role, which is fulfillment, oversized or returns. Units at a returns warehouse are parcels on their way
      back and cannot be ordered by a buyer, so rpt_stock_days counts "in stock" over is_return_warehouse = false.
      has_stock_history and the first/last stock report dates say whether the warehouse has ever held our goods.
    columns:
      - name: warehouse_id
        description: "Marketplace warehouse id, the key facts carry."
        data_tests: [unique, not_null]
      - name: warehouse_name
        description: "Name exactly as the stock report prints it ('МО Софьино (кроме КГТ) - 1'). Orders print another name for the same id ('Яндекс.Маркет (Софьино)'), and the id links the two."
        data_tests: [unique, not_null]
      - name: city
        description: "City or settlement from the marketplace's address record ('Софьино', 'посёлок Шушары'). Not a region; cluster_name is the analytical grouping."
      - name: street
      - name: latitude
      - name: longitude
      - name: is_current
        description: "TRUE when the warehouse is in the latest GET v2/warehouses pull; a warehouse that left the list keeps its row (history still resolves)."
        data_tests: [not_null]
      - name: last_seen_date
        description: "Date of the latest pull that listed the warehouse."
        data_tests: [not_null]
      - name: cluster_name
        description: "Turnover cluster / macro-region as the goods-turnover report names it (Москва, Санкт-Петербург, Екатеринбург, Казань, Ростов). NULL until warehouse_attributes has the row. The test only warns, so a new warehouse never breaks the build."
        data_tests:
          - not_null:
              config: {severity: warn}
      - name: warehouse_role
        description: "fulfillment | oversized | returns | unknown (no seed row yet)."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [fulfillment, oversized, returns, unknown]
      - name: is_return_warehouse
        description: "TRUE for the two returns warehouses (500 МО Софьино (возвраты), 501 Домодедово возвратный). Exclude from 'in stock for a buyer'."
        data_tests: [not_null]
      - name: sort_order
        description: "Display order from the seed; NULL without a seed row."
      - name: first_stock_report_date
        description: "First day the stock report listed the warehouse (with or without units); NULL = never held our goods."
      - name: last_stock_report_date
        description: "Last day the stock report listed the warehouse."
      - name: has_stock_history
        description: "TRUE when the stock report has ever listed the warehouse (8 of 13)."
        data_tests: [not_null]
      - name: dbt_updated_at
        description: "Timestamp of the dbt run that built the table."

  - name: dim_dates
    description: >
      Calendar: one row per day from 2025-01-01 (first stock report 2025-01-08, first order 2025-01-10) to two
      months past today, rebuilt every run. Dense reporting views (rpt_stock_days) join to it so that a day without
      data shows up as a visible hole instead of a missing row. tests/assert_dim_dates_is_contiguous.sql checks that
      there are no gaps. The attributes are the ones Looker Studio cannot derive consistently: ISO week (Monday-based),
      month and quarter starts as dates, weekend flag. The table is role-playing and serves ordered_date,
      delivered_date and snapshot_date.
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "is_weekend = (day_of_week in (6, 7))"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "iso_week_start_date <= date_day and datediff('day', iso_week_start_date, date_day) < 7"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "month_start_date = date_trunc('month', date_day)"
    columns:
      - name: date_day
        description: "The day (Moscow calendar, as every date in the project)."
        data_tests: [unique, not_null]
      - name: day_of_week
        description: "ISO day of week: 1 = Monday … 7 = Sunday."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5, 6, 7]
                quote: false
      - name: day_name
        description: "Abbreviated English day name (Snowflake DAYNAME)."
      - name: is_weekend
        description: "TRUE on Saturday and Sunday."
        data_tests: [not_null]
      - name: iso_week_start_date
        description: "Monday of the ISO week. Group by this to chart weeks in order."
        data_tests: [not_null]
      - name: iso_week_number
        description: "ISO week number (1–53) within iso_year."
        data_tests: [not_null]
      - name: iso_year
        description: "ISO week-numbering year (differs from year_number around New Year)."
        data_tests: [not_null]
      - name: month_start_date
        description: "First day of the month. Group by this to chart months in order."
        data_tests: [not_null]
      - name: month_number
        data_tests: [not_null]
      - name: month_name
        description: "Abbreviated English month name (Snowflake MONTHNAME)."
      - name: is_month_end
        description: "TRUE on the last day of the month, the day the turnover report is dated."
        data_tests: [not_null]
      - name: quarter_start_date
        data_tests: [not_null]
      - name: quarter_number
        data_tests: [not_null]
      - name: year_number
        data_tests: [not_null]

unit_tests:
  - name: dim_products_parses_sku_codes
    description: >
      The SKU-code parser on one row per branch: sized type, one-size type in lower case, short model number,
      missing size segment, unknown type, size outside the list. There is also one card seen only in an older snapshot
      (is_in_catalogue = false, attributes kept) whose warehouse label comes from the realization report.
    model: dim_products
    given:
      - input: ref('stg_ym__offers')
        rows:
          - {sku: 'H-L-B-001',   snapshot_date: 2026-09-09}
          - {sku: 'sc-Gr-001',   snapshot_date: 2026-09-09}
          - {sku: 'CAP-Bg-6',    snapshot_date: 2026-09-09}
          - {sku: 'H-B-001',     snapshot_date: 2026-09-09}
          - {sku: 'SW-M-B-015',  snapshot_date: 2026-09-09}
          - {sku: 'H-XXL-B-001', snapshot_date: 2026-09-09}
          - {sku: 'CAP-Bur-006', snapshot_date: 2026-09-01}      # seen only in an older snapshot: deleted since
      - input: ref('product_types')
        rows:
          - {product_type_code: 'H',   product_type: 'Hoodie', has_sizes: true,  sort_order: 1}
          - {product_type_code: 'CAP', product_type: 'Cap',    has_sizes: false, sort_order: 5}
          - {product_type_code: 'SC',  product_type: 'Scarf',  has_sizes: false, sort_order: 6}
      - input: ref('colour_codes')
        rows:
          - {colour_code: 'B',  colour_name: 'blue',     sort_order: 8}
          - {colour_code: 'GR', colour_name: 'graphite', sort_order: 9}
          - {colour_code: 'BG', colour_name: 'beige',    sort_order: 3}
      - input: ref('product_models')
        rows:
          - {model_code: 'H-001', model_name: 'cumming of age', lifecycle_status: 'core'}
      - input: ref('stg_ym__realization_lines')
        rows:
          - {sku: 'CAP-Bur-006', warehouse_sku: 'K4', report_month: 2026-08-01}
      - input: ref('int_order_lines')
        rows: []
    expect:
      rows:
        - {sku: 'H-L-B-001',   product_type_code: 'H',   product_type: 'Hoodie', size: 'L',   size_order: 3, colour_code: 'B',  colour_name: 'blue',     model_code: 'H-001',   model_name: 'cumming of age', model_colour_code: 'H-B-001',   is_sku_parsed: true,  is_in_catalogue: true, warehouse_sku: 'H-L-B-001', catalogue_snapshot_date: 2026-09-09}
        - {sku: 'sc-Gr-001',   product_type_code: 'SC',  product_type: 'Scarf',  size: 'ONE', size_order: 0, colour_code: 'GR', colour_name: 'graphite', model_code: 'SC-001',  model_name: 'SC-001',         model_colour_code: 'SC-GR-001',  is_sku_parsed: true,  is_in_catalogue: true, warehouse_sku: 'sc-Gr-001', catalogue_snapshot_date: 2026-09-09}
        - {sku: 'CAP-Bg-6',    product_type_code: 'CAP', product_type: 'Cap',    size: 'ONE', size_order: 0, colour_code: 'BG', colour_name: 'beige',    model_code: 'CAP-006', model_name: 'CAP-006',        model_colour_code: 'CAP-BG-006', is_sku_parsed: true,  is_in_catalogue: true, warehouse_sku: 'CAP-Bg-6', catalogue_snapshot_date: 2026-09-09}
        - {sku: 'H-B-001',     product_type_code: 'H',   product_type: 'Hoodie', size: null,  size_order: null, colour_code: null, colour_name: null,   model_code: null,      model_name: null,             model_colour_code: null,         is_sku_parsed: false, is_in_catalogue: true, warehouse_sku: 'H-B-001', catalogue_snapshot_date: 2026-09-09}
        - {sku: 'SW-M-B-015',  product_type_code: 'SW',  product_type: null,     size: null,  size_order: null, colour_code: null, colour_name: null,   model_code: null,      model_name: null,             model_colour_code: null,         is_sku_parsed: false, is_in_catalogue: true, warehouse_sku: 'SW-M-B-015', catalogue_snapshot_date: 2026-09-09}
        - {sku: 'H-XXL-B-001', product_type_code: 'H',   product_type: 'Hoodie', size: null,  size_order: null, colour_code: null, colour_name: null,   model_code: null,      model_name: null,             model_colour_code: null,         is_sku_parsed: false, is_in_catalogue: true, warehouse_sku: 'H-XXL-B-001', catalogue_snapshot_date: 2026-09-09}
        - {sku: 'CAP-Bur-006', product_type_code: 'CAP', product_type: 'Cap',    size: 'ONE', size_order: 0, colour_code: 'BUR', colour_name: null,   model_code: 'CAP-006', model_name: 'CAP-006',        model_colour_code: 'CAP-BUR-006', is_sku_parsed: true, is_in_catalogue: false, warehouse_sku: 'K4', catalogue_snapshot_date: 2026-09-01}

  - name: fct_inventory_daily_fills_the_calendar
    description: >
      Three report days, 01, 02 and 04 (03 has no report), with one resolved warehouse plus one unresolved. Day 01
      lists the cap under its label K4 (sku already CAP-Bur-006 from staging) with stock, and a hoodie with a printed
      zero. Day 02 lists only the hoodie, now in stock. Day 04 lists the hoodie and a tee seen for the first time.
      Expected: the cap gets filled zero rows on 02 and 04 (is_reported false, label null), and no row exists for the
      missing day 03. The tee has no rows before 04, and the row on the unresolved warehouse is excluded.
      last_/next_stocked_date follow the cap's life (stocked 01, never again) and the hoodie's (zero on 01 with stock
      ahead on 02).
    model: fct_inventory_daily
    given:
