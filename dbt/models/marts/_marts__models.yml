        - {sku: 'CAP-Bg-6',    product_type_code: 'CAP', product_type: 'Cap',    size: 'ONE', size_order: 0, colour_code: 'BG', colour_name: 'beige',    model_code: 'CAP-006', model_name: 'CAP-006',        model_colour_code: 'CAP-BG-006', is_sku_parsed: true,  is_in_catalogue: true}
        - {sku: 'H-B-001',     product_type_code: 'H',   product_type: 'Hoodie', size: null,  size_order: null, colour_code: null, colour_name: null,   model_code: null,      model_name: null,             model_colour_code: null,         is_sku_parsed: false, is_in_catalogue: true}
