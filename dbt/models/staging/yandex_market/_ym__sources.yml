# GENERATED by scripts/gen_sources_yml.py — edit the descriptions there, then re-run it. Do not edit by hand.
# Table names = <report dir>_<CSV sheet name> as produced by ingest/load_to_snowflake.table_name().
# Column lists come from the files in data/raw/; all RAW columns are VARCHAR (typing is staging's job).
# load_to_snowflake.py also pushes these descriptions into Snowflake as table / column COMMENTs.

version: 2
sources:
  - name: yandex_market
    description: >-
      Raw exports from the marketplace seller API, loaded as-is (all VARCHAR) by ingest/load_to_snowflake.py.
    database: MARKETPLACE
    schema: RAW
    loader: ingest/load_to_snowflake.py
    config:
      loaded_at_field: >-
        _LOADED_AT::timestamp_ntz
      freshness:
        warn_after:
          count: 2
          period: day
        error_after:
          count: 7
          period: day
    tables:
      - name: united_orders_orders
        identifier: UNITED_ORDERS_ORDERS_AND_OFFERS_TRANSACTIONS
        description: >-
          Sheet 'orders_and_offers_transactions' of the united-orders report (POST v2/reports/united-orders/generate): one
          row per order × SHOP_SKU × OFFER_STATUS (a partially unredeemed multi-unit order is split into a 'Delivered to
          buyer' row and an 'Unredeemed…' row). No quantity column: TRANSFERRED_FOR_DELIVERY / DELIVERED_OR_RETURNED hold
          unit counts. CREATION_DATE, DELIVERY_DATE, SHIPMENT_DATE and all *_BANK_ORDER_DATE / *_HANDLING_TIME are DD.MM.YYYY;
          STATUS_CHANGED is YYYY-MM-DD HH24:MI:SS. The report window is NOT by creation date: a 2026-06-06..2026-09-03 request
          returned orders created from 2026-02-09. Without a subscription the API serves only the last 90 days. Report language
          = EN (values like 'Delivered to buyer').
        columns:
          - name: BUSINESS_ID
            description: >-
              Business-account id ('ID бизнес-аккаунта'). Constant for this seller.
          - name: MODEL
            description: >-
              Placement model ('Модели работы'): FBY (Market's warehouse and delivery) for every row here.
          - name: PARTNER_ID
            description: >-
              Campaign / shop id ('ID магазинов'). Constant for this seller.
          - name: SHOP_NAME
            description: >-
              Shop name as shown on the marketplace ('Названия магазинов').
          - name: INN
            description: >-
              Seller's tax id ('ИНН'). Constant; not needed downstream.
          - name: PLACEMENT_CONTRACT
            description: >-
              Placement contract number ('Номера договоров на размещение').
          - name: PROMOTION_CONTRACT
            description: >-
              Promotion contract number ('Номера договоров на продвижение').
          - name: ORDER_ID
            description: >-
              Marketplace order number ('Номер заказа'). Joins ORDERS_STATS.ID and GOODS_REALIZATION_*.PARTNER_ORDER_ID.
          - name: PARTNER_ORDER_ID
            description: >-
              Seller's own order number ('Ваш номер заказа'); equals ORDER_ID for this seller (no external system).
          - name: CREATION_DATE
            description: >-
              Order creation date ('Дата оформления'), DD.MM.YYYY.
          - name: ORDER_TYPE
            description: >-
              Order type ('Тип заказа'): 'Sale to individual' for every row so far (B2B orders would differ).
          - name: SHOP_SKU
            description: >-
              Seller's SKU ('Ваш SKU') — the product key across all sources (offerId / shopSku elsewhere).
          - name: OFFER_NAME
            description: >-
              Product name as listed on the marketplace ('Название товара').
          - name: PARTNER_PRICE_FOR_DELIVERY
            description: >-
              Seller's own price per unit at order time ('Ваша цена (за шт.)'), before marketplace discounts.
          - name: BILLING_PRICE
            description: >-
              Selling price per unit ('Цена продажи (за шт.)') — what the buyer pays before marketplace-funded discounts
              and points; the base for fee calculation.
          - name: COFINANCE_TRESHOLD
            description: >-
              Seller's price-reduction threshold for co-financed ('скидки с Маркетом') discounts ('Ваш порог снижения цены
              для участия в софинансировании'). Spelling is the report's. Empty for this seller.
          - name: COFINANCE_VALUE
            description: >-
              Seller's share of a co-financed discount per unit ('Ваша скидка при софинансировании (за шт.)').
          - name: COFINANCE_SUBSIDY
            description: >-
              Marketplace's share of a co-financed discount per unit ('Скидка Маркета при софинансировании').
          - name: MARKETPLACE_SUBSIDY
            description: >-
              Other marketplace-funded discounts per unit ('Другие скидки Маркета (за шт.)') — promo the marketplace pays
              for; reimbursed to the seller via NETTING_AMOUNT or MARKETPLACE_DISCOUNT_PAYMENT_*.
          - name: SPASIBO
            description: >-
              Part of the price paid with SberSpasibo bonuses per unit ('Оплата бонусами СберСпасибо (за шт.)'). 0 so far.
          - name: YANDEX_PLUS
            description: >-
              Part of the price paid with Yandex Plus points per unit ('Оплата баллами Яндекс Плюса (за шт.)').
          - name: TRANSFERRED_FOR_DELIVERY
            description: >-
              Units handed to delivery ('Передано в доставку'). One of the two quantity columns; empty on cancelled lines.
          - name: DELIVERED_OR_RETURNED
            description: >-
              Units delivered, or returned / unredeemed — meaning depends on OFFER_STATUS ('Доставлено или возвращено').
          - name: DELIVERY_DATE
            description: >-
              Delivery date ('Дата доставки заказа'), DD.MM.YYYY; empty until delivered.
          - name: OFFER_STATUS
            description: >-
              Line status ('Статус товара'): Delivered to buyer | Shipped | Cancelled | Unredeemed in transit | Unredeemed
              received | Unredeemed received in warehouse | Return in transit | Return received in warehouse.
          - name: STATUS_CHANGED
            description: >-
              Timestamp of the last status change ('Статус изменен'), YYYY-MM-DD HH24:MI:SS, Moscow time.
          - name: PAYMENT_TYPE
            description: >-
              Buyer's payment method ('Способ оплаты'): Prepayment with a bank card | Postpaid with a bound card | Yandex
              Split (prepayment) | Postpaid Split | Postpaid Super Split | Faster Payments System. 'Postpaid…' = pay on
              receipt (drives the unredeemed rate).
          - name: SHIPMENT_WAREHOUSE
            description: >-
              Market warehouse the order shipped from ('Склад отгрузки'), e.g. 'Яндекс.Маркет (Софьино)'.
          - name: SHIPMENT_DATE
            description: >-
              Date the order left the warehouse ('Дата отгрузки'), DD.MM.YYYY.
          - name: DELIVERY_REGION
            description: >-
              Delivery region name ('Регион доставки'), e.g. Москва, Санкт-Петербург.
          - name: BUYER_PAYMENT_AMOUNT
            description: >-
              Payout of the buyer's payment to the seller: amount, ₽ ('Сумма платежа'). Empty when no such transfer.
          - name: BUYER_PAYMENT_BANK_ORDER_ID
            description: >-
              Payout of the buyer's payment to the seller: bank payment-order number ('Номер платежного поручения').
          - name: BUYER_PAYMENT_BANK_ORDER_DATE
            description: >-
              Payout of the buyer's payment to the seller: bank payment-order date ('Дата платежного поручения'), DD.MM.YYYY.
          - name: BUYER_PAYMENT_ID
            description: >-
              Payout of the buyer's payment to the seller: payment identifier ('Идентификатор платежа').
          - name: BUYER_PAYMENT_HANDLING_TIME
            description: >-
              Payout of the buyer's payment to the seller: payment-register date ('Дата реестра платежей'), DD.MM.YYYY.
          - name: NETTING_AMOUNT
            description: >-
              Points credited to the seller's balance to cover marketplace-funded discounts ('Сумма баллов') — netting instead
              of a bank transfer; usually equals MARKETPLACE_SUBSIDY.
          - name: NETTING_TRANSACTION_STATUS
            description: >-
              Netting status ('Статус (справочно)'): Balance topped up | Balance will be topped up | empty (nothing to net).
          - name: MARKETPLACE_DISCOUNT_PAYMENT_AMOUNT
            description: >-
              Payout reimbursing the marketplace-funded discount (MARKETPLACE_SUBSIDY + COFINANCE_SUBSIDY): amount, ₽ ('Сумма
              платежа'). Empty when no such transfer.
          - name: MARKETPLACE_DISCOUNT_PAYMENT_BANK_ORDER_ID
            description: >-
              Payout reimbursing the marketplace-funded discount (MARKETPLACE_SUBSIDY + COFINANCE_SUBSIDY): bank payment-order
              number ('Номер платежного поручения').
          - name: MARKETPLACE_DISCOUNT_PAYMENT_BANK_ORDER_DATE
            description: >-
              Payout reimbursing the marketplace-funded discount (MARKETPLACE_SUBSIDY + COFINANCE_SUBSIDY): bank payment-order
              date ('Дата платежного поручения'), DD.MM.YYYY.
          - name: MARKETPLACE_DISCOUNT_PAYMENT_ID
            description: >-
              Payout reimbursing the marketplace-funded discount (MARKETPLACE_SUBSIDY + COFINANCE_SUBSIDY): payment identifier
              ('Идентификатор платежа').
          - name: MARKETPLACE_DISCOUNT_PAYMENT_HANDLING_TIME
            description: >-
              Payout reimbursing the marketplace-funded discount (MARKETPLACE_SUBSIDY + COFINANCE_SUBSIDY): payment-register
              date ('Дата реестра платежей'), DD.MM.YYYY.
          - name: SPASIBO_PAYMENT_AMOUNT
            description: >-
              Payout of the part paid with SberSpasibo bonuses: amount, ₽ ('Сумма платежа'). Empty when no such transfer.
          - name: SPASIBO_PAYMENT_BANK_ORDER_ID
            description: >-
              Payout of the part paid with SberSpasibo bonuses: bank payment-order number ('Номер платежного поручения').
          - name: SPASIBO_PAYMENT_BANK_ORDER_DATE
            description: >-
              Payout of the part paid with SberSpasibo bonuses: bank payment-order date ('Дата платежного поручения'), DD.MM.YYYY.
          - name: SPASIBO_PAYMENT_ID
            description: >-
              Payout of the part paid with SberSpasibo bonuses: payment identifier ('Идентификатор платежа').
          - name: SPASIBO_PAYMENT_HANDLING_TIME
            description: >-
              Payout of the part paid with SberSpasibo bonuses: payment-register date ('Дата реестра платежей'), DD.MM.YYYY.
          - name: YANDEX_PLUS_PAYMENT_AMOUNT
            description: >-
              Payout of the part paid with Yandex Plus points: amount, ₽ ('Сумма платежа'). Empty when no such transfer.
          - name: YANDEX_PLUS_PAYMENT_BANK_ORDER_ID
            description: >-
              Payout of the part paid with Yandex Plus points: bank payment-order number ('Номер платежного поручения').
          - name: YANDEX_PLUS_PAYMENT_BANK_ORDER_DATE
            description: >-
              Payout of the part paid with Yandex Plus points: bank payment-order date ('Дата платежного поручения'), DD.MM.YYYY.
          - name: YANDEX_PLUS_PAYMENT_ID
            description: >-
              Payout of the part paid with Yandex Plus points: payment identifier ('Идентификатор платежа').
          - name: YANDEX_PLUS_PAYMENT_HANDLING_TIME
            description: >-
              Payout of the part paid with Yandex Plus points: payment-register date ('Дата реестра платежей'), DD.MM.YYYY.
          - name: REFUND_BUYER_PAYMENT_AMOUNT
            description: >-
              Refund of the buyer's payment (cancelled / unredeemed / returned line): amount, ₽ ('Сумма возврата'). Empty
              when no such transfer.
          - name: REFUND_BUYER_PAYMENT_BANK_ORDER_ID
            description: >-
              Refund of the buyer's payment (cancelled / unredeemed / returned line): bank payment-order number ('Номер
              платежного поручения').
          - name: REFUND_BUYER_PAYMENT_BANK_ORDER_DATE
            description: >-
              Refund of the buyer's payment (cancelled / unredeemed / returned line): bank payment-order date ('Дата платежного
              поручения'), DD.MM.YYYY.
          - name: REFUND_BUYER_PAYMENT_ID
            description: >-
              Refund of the buyer's payment (cancelled / unredeemed / returned line): payment identifier ('Идентификатор
              платежа').
          - name: REFUND_BUYER_PAYMENT_HANDLING_TIME
            description: >-
              Refund of the buyer's payment (cancelled / unredeemed / returned line): payment-register date ('Дата реестра
              платежей'), DD.MM.YYYY.
          - name: REFUND_MARKETPLACE_DISCOUNT_PAYMENT_AMOUNT
            description: >-
              Reversal of the marketplace-discount payout: amount, ₽ ('Сумма возврата'). Empty when no such transfer.
          - name: REFUND_MARKETPLACE_DISCOUNT_PAYMENT_BANK_ORDER_ID
            description: >-
              Reversal of the marketplace-discount payout: bank payment-order number ('Номер платежного поручения').
          - name: REFUND_MARKETPLACE_DISCOUNT_PAYMENT_BANK_ORDER_DATE
            description: >-
              Reversal of the marketplace-discount payout: bank payment-order date ('Дата платежного поручения'), DD.MM.YYYY.
          - name: REFUND_MARKETPLACE_DISCOUNT_PAYMENT_ID
            description: >-
              Reversal of the marketplace-discount payout: payment identifier ('Идентификатор платежа').
          - name: REFUND_MARKETPLACE_DISCOUNT_PAYMENT_HANDLING_TIME
            description: >-
              Reversal of the marketplace-discount payout: payment-register date ('Дата реестра платежей'), DD.MM.YYYY.
          - name: REFUND_SPASIBO_PAYMENT_AMOUNT
            description: >-
              Reversal of the SberSpasibo payout: amount, ₽ ('Сумма возврата'). Empty when no such transfer.
          - name: REFUND_SPASIBO_PAYMENT_BANK_ORDER_ID
            description: >-
              Reversal of the SberSpasibo payout: bank payment-order number ('Номер платежного поручения').
          - name: REFUND_SPASIBO_PAYMENT_BANK_ORDER_DATE
            description: >-
              Reversal of the SberSpasibo payout: bank payment-order date ('Дата платежного поручения'), DD.MM.YYYY.
          - name: REFUND_SPASIBO_PAYMENT_ID
            description: >-
              Reversal of the SberSpasibo payout: payment identifier ('Идентификатор платежа').
          - name: REFUND_SPASIBO_PAYMENT_HANDLING_TIME
            description: >-
              Reversal of the SberSpasibo payout: payment-register date ('Дата реестра платежей'), DD.MM.YYYY.
          - name: REFUND_YANDEX_PLUS_PAYMENT_AMOUNT
            description: >-
              Reversal of the Yandex Plus payout: amount, ₽ ('Сумма возврата'). Empty when no such transfer.
          - name: REFUND_YANDEX_PLUS_PAYMENT_BANK_ORDER_ID
            description: >-
              Reversal of the Yandex Plus payout: bank payment-order number ('Номер платежного поручения').
          - name: REFUND_YANDEX_PLUS_PAYMENT_BANK_ORDER_DATE
            description: >-
              Reversal of the Yandex Plus payout: bank payment-order date ('Дата платежного поручения'), DD.MM.YYYY.
          - name: REFUND_YANDEX_PLUS_PAYMENT_ID
            description: >-
              Reversal of the Yandex Plus payout: payment identifier ('Идентификатор платежа').
          - name: REFUND_YANDEX_PLUS_PAYMENT_HANDLING_TIME
            description: >-
              Reversal of the Yandex Plus payout: payment-register date ('Дата реестра платежей'), DD.MM.YYYY.
          - name: DEFECT_REFUND_PAYMENT_AMOUNT
            description: >-
              Amount withheld from the seller for a defective-item refund: amount, ₽ ('Удержанная сумма'). Empty when no
              such transfer.
          - name: DEFECT_REFUND_PAYMENT_BANK_ORDER_ID
            description: >-
              Amount withheld from the seller for a defective-item refund: bank payment-order number ('Номер платежного
              поручения').
          - name: DEFECT_REFUND_PAYMENT_BANK_ORDER_DATE
            description: >-
              Amount withheld from the seller for a defective-item refund: bank payment-order date ('Дата платежного поручения'),
              DD.MM.YYYY.
          - name: DEFECT_REFUND_PAYMENT_ID
            description: >-
              Amount withheld from the seller for a defective-item refund: payment identifier ('Идентификатор платежа').
          - name: DEFECT_REFUND_PAYMENT_HANDLING_TIME
            description: >-
              Amount withheld from the seller for a defective-item refund: payment-register date ('Дата реестра платежей'),
              DD.MM.YYYY.
          - name: _LOADED_AT
            description: >-
              UTC timestamp (ISO 8601) when load_to_snowflake.py wrote the row. Freshness field; with _SOURCE_FILE it identifies
              a load batch.
          - name: _SOURCE_FILE
            description: >-
              Path of the source file relative to data/raw/ (e.g. orders_stats/2026-09-04/2025-01-01_2025-03-31.jsonl).
              Carries the download date and the requested period; replay / dedup key.
      - name: united_orders_services
        identifier: UNITED_ORDERS_SERVICES_AND_ORDERS_MARGIN
        description: >-
          Sheet 'services_and_orders_margin' of the united-orders report: one row per ORDER_ID with order-level status and
          every marketplace fee as a separate column (SALE_COMMISSION, BUYER_DELIVERY, BUYER_PAYMENT_ACCEPT/TRANSFER, LOYALTY_PROGRAM,
          BOOST, …), plus SUMMARY_COMMISSION, SUM_BILLING_PRICE_OF_ITEMS, INCOME_WITHOUT_SERVICES. Fees are per order —
          allocation to order lines happens in int_order_items_enriched. Fee benchmark for ORDERS_STATS.COMMISSIONS.
        columns:
          - name: BUSINESS_ID
            description: >-
              Business-account id ('ID бизнес-аккаунта'). Constant for this seller.
          - name: MODEL
            description: >-
              Placement model ('Модели работы'): FBY (Market's warehouse and delivery) for every row here.
          - name: PARTNER_ID
            description: >-
              Campaign / shop id ('ID магазинов'). Constant for this seller.
          - name: SHOP_NAME
            description: >-
              Shop name as shown on the marketplace ('Названия магазинов').
          - name: INN
            description: >-
              Seller's tax id ('ИНН'). Constant; not needed downstream.
          - name: PLACEMENT_CONTRACT
            description: >-
              Placement contract number ('Номера договоров на размещение').
          - name: PROMOTION_CONTRACT
            description: >-
              Promotion contract number ('Номера договоров на продвижение').
          - name: ORDER_ID
            description: >-
              Marketplace order number ('Номер заказа'). Joins ORDERS_STATS.ID and GOODS_REALIZATION_*.PARTNER_ORDER_ID.
            data_tests:
              - unique
              - not_null
          - name: PARTNER_ORDER_ID
            description: >-
              Seller's own order number ('Ваш номер заказа'); equals ORDER_ID for this seller (no external system).
          - name: ORDER_STATUS
            description: >-
              Order-level status ('Статус заказа'): Delivered | Not bought in stock (= unredeemed) | Canceled during delivery
              | Canceled during processing | Order canceled before processing | Handed over for delivery | Full return accepted
              at warehouse | Partially unclaimed orders accepted at warehouse | …
          - name: CREATION_DATE
            description: >-
              Order creation date ('Дата оформления'), DD.MM.YYYY.
          - name: ORDER_TYPE
            description: >-
              Order type ('Тип заказа'): 'Sale to individual' for every row so far (B2B orders would differ).
          - name: SUMMARY_COMMISSION
            description: >-
              Total of all marketplace services for the order ('Все услуги Маркета за заказы') = sum of the fee columns.
          - name: SUM_BILLING_PRICE_OF_ITEMS
            description: >-
              Order total at selling price: sum of BILLING_PRICE × units over the order's lines (report header says 'Цена
              продажи (за шт.)' but the value is per order).
          - name: INCOME_WITHOUT_SERVICES
            description: >-
              Income net of marketplace services ('Доход за вычетом услуг Маркета') = SUM_BILLING_PRICE_OF_ITEMS − SUMMARY_COMMISSION.
          - name: BUYER_PAYMENT
            description: >-
              Buyer's payment for the order ('Платёж покупателя'), excludes marketplace-funded discounts and Plus points.
          - name: BUYER_PAYMENT_STATUS
            description: >-
              Payout status ('Статус платежа покупателя'): Transferred | Will be transferred | Will not be transferred because
              order was canceled.
          - name: BANK_ORDER_ID
            description: >-
              Bank payment-order number of the payout ('Номер платежного поручения').
          - name: SALE_COMMISSION
            description: >-
              Placement fee ('Размещение товаров на витрине') — the sale commission, % of BILLING_PRICE. = ORDERS_STATS
              commission type FEE.
          - name: WAREHOUSE_PROCESSING
            description: >-
              Warehouse handling fee ('Складская обработка'). Discontinued since 2024-01-01 — 0.
          - name: LOYALTY_PROGRAM
            description: >-
              Loyalty programme and reviews-for-points fee ('Программа лояльности и отзывы'). = LOYALTY_PARTICIPATION_FEE.
          - name: BOOST
            description: >-
              Boost-for-sales fee, charged only on sales ('Буст продаж'). = AUCTION_PROMOTION.
          - name: INSTALLMENT
            description: >-
              Instalment-plan fee ('Рассрочка'). Discontinued since 2022 — 0.
          - name: BUYER_DELIVERY
            description: >-
              Delivery-to-buyer fee ('Доставка покупателю'). = DELIVERY_TO_CUSTOMER. Largest fee for this seller.
          - name: CROSSREGIONAL_DELIVERY
            description: >-
              Middle-mile delivery fee ('Доставка (средняя миля)') for orders shipped to another region's cluster.
          - name: BUYER_EXPRESS_DELIVERY
            description: >-
              Express-delivery fee ('Экспресс-доставка покупателю'). 0 for FBY.
          - name: CROSSBORDER_DELIVERY
            description: >-
              Cross-border delivery fee ('Доставка из-за рубежа'). 0.
          - name: BUYER_PAYMENT_ACCEPT
            description: >-
              Payment-acceptance (acquiring) fee ('Приём платежа покупателя'). = AGENCY.
          - name: BUYER_PAYMENT_TRANSFER
            description: >-
              Payment-transfer fee ('Перевод платежа покупателя'). = PAYMENT_TRANSFER.
          - name: ORDER_INTAKE
            description: >-
              Pickup of orders from the seller's warehouse ('Организация забора заказов'); FBS only — 0.
          - name: ORDER_PROCESSING
            description: >-
              Order processing at a sorting centre or pickup point ('Обработка заказов в СЦ или ПВЗ'); FBS only — 0.
          - name: RESUPPLY_HANDLING
            description: >-
              Storage of unredeemed and returned items ('Хранение невыкупов и возвратов'). 0 so far.
          - name: RETURN_RESUPPLY
            description: >-
              Return processing at the warehouse ('Обработка заказов на складе') — charged on unredeemed / returned orders,
              15 ₽ per unit here. = RETURN_PROCESSING.
          - name: EXPROPRIATION_RESALE
            description: >-
              Marketplace's reward for selling goods the seller did not collect from the warehouse ('Вознаграждение за продажу
              товара'). 0.
          - name: _LOADED_AT
            description: >-
              UTC timestamp (ISO 8601) when load_to_snowflake.py wrote the row. Freshness field; with _SOURCE_FILE it identifies
              a load batch.
          - name: _SOURCE_FILE
            description: >-
              Path of the source file relative to data/raw/ (e.g. orders_stats/2026-09-04/2025-01-01_2025-03-31.jsonl).
              Carries the download date and the requested period; replay / dedup key.
      - name: united_orders_decoupling
        identifier: UNITED_ORDERS_SERVICES_WITH_DECOUPLING
        description: >-
          Sheet 'services_with_decoupling' — orders sold through the marketplace's 'smart offer' (умное предложение: Market
          sells above the seller's price and splits the extra). Empty for this seller so far (header only). Not used.
        columns:
          - name: BUSINESS_ID
            description: >-
              Business-account id ('ID бизнес-аккаунта'). Constant for this seller.
          - name: MODEL
            description: >-
              Placement model ('Модели работы'): FBY (Market's warehouse and delivery) for every row here.
          - name: PARTNER_ID
            description: >-
              Campaign / shop id ('ID магазинов'). Constant for this seller.
          - name: SHOP_NAME
            description: >-
              Shop name as shown on the marketplace ('Названия магазинов').
          - name: INN
            description: >-
              Seller's tax id ('ИНН'). Constant; not needed downstream.
          - name: PLACEMENT_CONTRACT
            description: >-
              Placement contract number ('Номера договоров на размещение').
          - name: PROMOTION_CONTRACT
            description: >-
              Promotion contract number ('Номера договоров на продвижение').
          - name: ORDER_ID
            description: >-
              Marketplace order number ('Номер заказа').
          - name: SHOP_ORDER_ID
            description: >-
              Seller's own order number (same as PARTNER_ORDER_ID on the other sheets).
          - name: ORDER_STATUS
            description: >-
              Order-level status ('Статус заказа'): Delivered | Not bought in stock (= unredeemed) | Canceled during delivery
              | Canceled during processing | Order canceled before processing | Handed over for delivery | Full return accepted
              at warehouse | Partially unclaimed orders accepted at warehouse | …
          - name: CREATION_DATE
            description: >-
              Order creation date ('Дата оформления'), DD.MM.YYYY.
          - name: ORDER_TYPE
            description: >-
              Order type ('Тип заказа'): 'Sale to individual' for every row so far (B2B orders would differ).
          - name: SHOP_SKU
            description: >-
              Seller's SKU ('Ваш SKU') — the product key across all sources (offerId / shopSku elsewhere).
          - name: OFFER_NAME
            description: >-
              Product name as listed on the marketplace ('Название товара').
          - name: COUNT
            description: >-
              Units in the line ('Количество').
          - name: SHOP_PRICE
            description: >-
              Seller's price per unit ('Ваша цена (за шт.)').
          - name: SELLING_PRICE
            description: >-
              Marketplace's selling price per unit under the smart offer ('Цена продажи (за шт.)').
          - name: BUYER_PAYMENT
            description: >-
              Buyer's payment for the order ('Платёж покупателя'), excludes marketplace-funded discounts and Plus points.
          - name: EXTRA_INCOME
            description: >-
              Difference between the selling price and the seller's price ('Разница между вашей ценой и ценой продажи').
          - name: SUMMARY_COMMISSION
            description: >-
              Total of all marketplace services for the order ('Все услуги Маркета за заказы') = sum of the fee columns.
          - name: INCOME_WITHOUT_SERVICES
            description: >-
              Income net of marketplace services ('Доход за вычетом услуг Маркета') = SUM_BILLING_PRICE_OF_ITEMS − SUMMARY_COMMISSION.
          - name: EXTRA_DECOUPLING_MARGIN
            description: >-
              Extra revenue from the smart offer ('Доп. выручка от умного предложения').
          - name: NET_DECOUPLING_GAIN
            description: >-
              Extra income from the smart offer after its fee ('Доп. доход от умного предложения').
          - name: SALE_COMMISSION
            description: >-
              Placement fee ('Размещение товаров на витрине') — the sale commission, % of BILLING_PRICE. = ORDERS_STATS
              commission type FEE.
          - name: EXTRA_DECOUPLING_SALE_COMMISSION
            description: Additional placement fee charged on the smart-offer uplift.
          - name: WAREHOUSE_HANDLING
            description: >-
              Warehouse handling fee ('Складская обработка') — same as WAREHOUSE_PROCESSING on the services sheet.
          - name: LOYALTY_PROGRAM
            description: >-
              Loyalty programme and reviews-for-points fee ('Программа лояльности и отзывы'). = LOYALTY_PARTICIPATION_FEE.
          - name: BOOST
            description: >-
              Boost-for-sales fee, charged only on sales ('Буст продаж'). = AUCTION_PROMOTION.
          - name: INSTALLMENT
            description: >-
              Instalment-plan fee ('Рассрочка'). Discontinued since 2022 — 0.
          - name: DELIVERY
            description: Delivery-to-buyer fee — same as BUYER_DELIVERY on the services sheet.
          - name: EXPRESS_DELIVERY
            description: Express-delivery fee — same as BUYER_EXPRESS_DELIVERY.
          - name: PAYMENT_ACCEPTING
            description: Payment-acceptance fee — same as BUYER_PAYMENT_ACCEPT.
          - name: PAYMENT_TRANSFER
            description: Payment-transfer fee — same as BUYER_PAYMENT_TRANSFER.
          - name: ORDER_INTAKE
            description: >-
              Pickup of orders from the seller's warehouse ('Организация забора заказов'); FBS only — 0.
          - name: ORDER_PROCESSING
            description: >-
              Order processing at a sorting centre or pickup point ('Обработка заказов в СЦ или ПВЗ'); FBS only — 0.
          - name: RESUPPLY_STORAGE
            description: Storage of unredeemed and returned items — same as RESUPPLY_HANDLING.
          - name: RESUPPLY_RETURN
            description: Return processing at the warehouse — same as RETURN_RESUPPLY.
          - name: _LOADED_AT
            description: >-
              UTC timestamp (ISO 8601) when load_to_snowflake.py wrote the row. Freshness field; with _SOURCE_FILE it identifies
              a load batch.
          - name: _SOURCE_FILE
            description: >-
              Path of the source file relative to data/raw/ (e.g. orders_stats/2026-09-04/2025-01-01_2025-03-31.jsonl).
              Carries the download date and the requested period; replay / dedup key.
      - name: goods_turnover
        identifier: GOODS_TURNOVER_TURNOVER
        description: >-
          Marketplace's own turnover report (POST v2/reports/goods-turnover/generate) for a given date, one row per SHOP_SKU
          × MACROREGION_NAME (Москва, Санкт-Петербург…). TURNOVER is a string: a number of days or 'Нет продаж'; AMOUNT
          may be '-'. Cast with try_to_decimal. Used as the reconciliation benchmark for stock/velocity marts. The date
          requested is in _SOURCE_FILE (…/<YYYY-MM-DD>/turnover.csv); a request for 'today' returns an empty file.
        columns:
          - name: MACROREGION_NAME
            description: >-
              Warehouse cluster / macro-region ('Кластер'): Москва, Санкт-Петербург, Екатеринбург, Казань, Ростов…
          - name: CATEGORY
            description: >-
              Marketplace category of the product ('Категория').
          - name: SHOP_SKU
            description: >-
              Seller's SKU ('Ваш SKU').
          - name: MARKET_SKU
            description: >-
              Marketplace SKU — id of the product card on Market ('SKU на Маркете').
          - name: OFFER_NAME
            description: >-
              Product name ('Название товара').
          - name: LENGTH
            description: >-
              Package length, mm ('Длина, мм').
          - name: WIDTH
            description: >-
              Package width, mm ('Ширина, мм').
          - name: HEIGHT
            description: >-
              Package height, mm ('Высота, мм').
          - name: VOLUME
            description: >-
              Package volume, litres ('Объём, л') — the unit storage is billed in.
          - name: TURNOVER
            description: >-
              Turnover in days ('Оборачиваемость') = stock ÷ average daily sales; the string 'Нет продаж' when nothing sold
              in the period. Cast with try_to_decimal.
          - name: AMOUNT
            description: >-
              Paid-storage cost for the period ('Стоимость платного хранения'); '-' when storage was free.
          - name: MARKET_RECOMMENDATION
            description: >-
              Marketplace's free-text advice for the SKU in this cluster ('Рекомендация Маркета'): increase supply / cut
              price / withdraw stock.
          - name: AVG_SOLD_VOLUME
            description: >-
              Average daily volume sold, litres ('Среднесуточный объём проданных товаров, л').
          - name: AVG_SOLD_ITEMS
            description: >-
              Average daily units sold ('Среднесуточное количество проданных товаров, шт.').
          - name: AVG_SOLD_VOLUME_ON_STOCK
            description: >-
              Average daily volume in stock, litres ('Среднесуточный объём товаров на складе, л').
          - name: ITEMS_ON_STOCK
            description: >-
              Units in stock on the last day of the period ('Остаток на последний день периода, шт.').
          - name: _LOADED_AT
            description: >-
              UTC timestamp (ISO 8601) when load_to_snowflake.py wrote the row. Freshness field; with _SOURCE_FILE it identifies
              a load batch.
          - name: _SOURCE_FILE
            description: >-
              Path of the source file relative to data/raw/ (e.g. orders_stats/2026-09-04/2025-01-01_2025-03-31.jsonl).
              Carries the download date and the requested period; replay / dedup key.
      - name: stock_snapshots
        identifier: STOCK_SNAPSHOTS
        description: >-
          SUPERSEDED on 2026-09-14 by stock_reports — kept as an archive of the 2026-09-03..2026-09-13 daily JSON snapshots,
          referenced by no model. Was: stock per offerId × warehouse_id from POST v2/campaigns/{id}/offers/stocks (current
          moment only, no history), STOCKS = JSON array [{type: FIT|AVAILABLE|FREEZE|…, count}], '[]' for an offer listed
          with no stock. Replaced because the report can be requested for any past date and holds end-of-day stock; the
          JSON snapshot for a missed cron day is lost forever (2026-09-04 was).
        columns:
          - name: OFFERID
            description: >-
              Seller's SKU (= SHOP_SKU) the stock row is for.
          - name: SNAPSHOT_DATE
            description: Download date YYYY-MM-DD (added by ingest/yandex_market.py). Take the latest per offer.
          - name: STOCKS
            description: >-
              JSON array [{type, count}], type ∈ FIT (sellable or reserved) | AVAILABLE (sellable now) | FREEZE (reserved
              for orders) | QUARANTINE | DEFECT | EXPIRED | UTILIZATION. '[]' when the offer has no stock.
          - name: UPDATEDAT
            description: >-
              Date-time the marketplace last updated this stock figure, ISO 8601 with offset. Absent for offers without
              stock.
          - name: WAREHOUSE_ID
            description: >-
              Market warehouse id the stock is held at (FBY: Market's warehouse), copied from the response's warehouseId
              by ingest/yandex_market.py.
          - name: _RAW_JSON
            description: >-
              The whole source record as JSON text — parse_json() in staging for anything not broken out into a column.
          - name: _LOADED_AT
            description: >-
              UTC timestamp (ISO 8601) when load_to_snowflake.py wrote the row. Freshness field; with _SOURCE_FILE it identifies
              a load batch.
          - name: _SOURCE_FILE
            description: >-
              Path of the source file relative to data/raw/ (e.g. orders_stats/2026-09-04/2025-01-01_2025-03-31.jsonl).
              Carries the download date and the requested period; replay / dedup key.
      - name: stock_reports
        identifier: STOCK_REPORTS_STOCKS_ON_WAREHOUSES
        description: >-
          Stock per SHOP_SKU × WAREHOUSE on a past date — the 'Остатки на складах' report (POST v2/reports/stocks-on-warehouses/generate
          with reportDate; FBY). Backfilled daily for 2025-01-08..2026-09-02 (603 reports) because the JSON endpoint behind
          STOCK_SNAPSHOTS only knows the current day. The date is NOT a column: it is the folder in _SOURCE_FILE (stock_reports/<run_date>/<reportDate>/stocks_on_warehouses.csv),
          and the report holds the stock at the END of the day BEFORE reportDate (verified against the 2026-09-05 JSON snapshot:
          VALID = FIT to the unit, AVAILABLE_FOR_ORDER = AVAILABLE, RESERVED = FREEZE) → snapshot_date = reportDate − 1
          in staging. Warehouses come as names, not ids (map in staging / dim_warehouses); warehouses with zero stock are
          omitted from the report; caps appear under their warehouse SKU (K1…K5) like in GOODS_TURNOVER_TURNOVER. Source
          of stg_ym__stock_levels since 2026-09-14; ingest/daily.sh requests reportDate = today every morning.
        config:
          freshness:
            warn_after:
              count: 1
              period: day
            error_after:
              count: 3
              period: day
        columns:
          - name: SHOP_SKU
            description: >-
              Seller's SKU ('Ваш SKU'); caps come as the warehouse SKU (K1…K5) — resolve via dim_products.warehouse_sku.
          - name: ARTICLE
            description: >-
              Seller's article ('Артикул') — equals SHOP_SKU in every row so far.
          - name: MARKET_SKU
            description: >-
              Marketplace SKU ('SKU на Маркете').
          - name: PRODUCT_NAME
            description: >-
              Product name on the card ('Название товара').
          - name: VALID
            description: >-
              Good stock, units ('Годный') = FIT in the JSON snapshot: AVAILABLE_FOR_ORDER + RESERVED.
          - name: RESERVED
            description: >-
              Units reserved for placed orders ('Резерв') = FREEZE in the JSON snapshot.
          - name: AVAILABLE_FOR_ORDER
            description: >-
              Units buyers can order right now ('Доступно для заказа') = AVAILABLE in the JSON snapshot.
          - name: QUARANTINE
            description: >-
              Units in quarantine ('Карантин') — awaiting a decision after intake / return; not sellable.
          - name: UTILIZATION
            description: >-
              Units handed over for disposal ('Передан на утилизацию').
          - name: DEFECT
            description: >-
              Defective units ('Брак').
          - name: EXPIRED
            description: >-
              Expired units ('Просрочен') — never for apparel.
          - name: LENGTH
            description: >-
              Package length, mm ('Длина, мм') — 0 in the backfill.
          - name: WIDTH
            description: >-
              Package width, mm ('Ширина, мм') — 0 in the backfill.
          - name: HEIGHT
            description: >-
              Package height, mm ('Высота, мм') — 0 in the backfill.
          - name: WEIGHT
            description: >-
              Package weight, kg ('Вес, кг') — 0 in the backfill.
          - name: WAREHOUSE
            description: >-
              Warehouse NAME ('Склад'), e.g. 'МО Софьино (кроме КГТ) - 1', 'ЛО Шушары', 'Ростов-на-Дону-2' — the JSON snapshot
              uses warehouse ids; map name → id in staging. 'ЛО Парголово' appears only in 2025.
          - name: SELLING_STATUS
            description: >-
              Selling status text ('Статус продаж'): 'Продажи идут', 'Нет на складе', …
          - name: RECOMMENDATIONS
            description: >-
              Marketplace's replenishment recommendation text ('Рекомендации'); mostly empty.
          - name: TURNOVER
            description: >-
              Turnover in days ('Оборачиваемость') as text, or 'Нет продаж' — cast with try_to_decimal.
          - name: _LOADED_AT
            description: >-
              UTC timestamp (ISO 8601) when load_to_snowflake.py wrote the row. Freshness field; with _SOURCE_FILE it identifies
              a load batch.
          - name: _SOURCE_FILE
            description: >-
              Path of the source file relative to data/raw/ (e.g. orders_stats/2026-09-04/2025-01-01_2025-03-31.jsonl).
              Carries the download date and the requested period; replay / dedup key.
      - name: warehouses
        identifier: WAREHOUSES
        description: >-
          FBY warehouses of the marketplace from GET v2/warehouses (one row per warehouse per daily snapshot, snapshot_date
          added by ingest/yandex_market.py): ID, NAME, ADDRESS as JSON text; _RAW_JSON holds the whole record. The bridge
          between the stock report, which prints warehouse NAMES, and orders / the old JSON snapshot, which carry warehouse
          ids. Small (≈10 rows); latest snapshot wins in stg_ym__warehouses. Warehouses that no longer exist (e.g. 'ЛО Парголово',
          2025) may be absent — the staging keeps every id ever seen.
        columns:
          - name: SNAPSHOT_DATE
            description: Day the list was pulled (added by ingest/yandex_market.py); one pull per day by cron.
          - name: ID
            description: >-
              Marketplace warehouse id — the value orders and the old STOCK_SNAPSHOTS carry (172 = МО Софьино, 313 = ЛО
              Шушары, 305 = Ростов-на-Дону-2, 300 = Екатеринбург, 302 = Самара, 501 = Домодедово возвратный).
          - name: NAME
            description: >-
              Warehouse name as the marketplace prints it — must match STOCK_REPORTS_STOCKS_ON_WAREHOUSES.WAREHOUSE exactly;
              int_stock_daily joins on it and warns on any name it cannot resolve.
          - name: ADDRESS
            description: JSON {city, street, number, building, block, gps {latitude, longitude}} — kept as text.
      - name: orders_stats
        identifier: ORDERS_STATS
        description: >-
          Full order history from POST v2/campaigns/{id}/stats/orders, one row per order per download (2025-01 → today,
          2 346 orders on 2026-09-04; no 90-day limit). Downloaded by quarter, so an order re-appears in every later file
          that covers its creation date — deduplicate in staging by ID, keeping the latest _LOADED_AT. Nested JSON is kept
          as text (ITEMS, COMMISSIONS, PAYMENTS, SUBSIDIES, DELIVERYREGION); _RAW_JSON holds the whole record. Primary source
          for fct_order_items; the united-orders report is the fee benchmark.
        columns:
          - name: BUYERTYPE
            description: PERSON (individual) | BUSINESS (organisation).
          - name: COMMISSIONS
            description: >-
              JSON array of marketplace fees for the order: [{type, actual}], type ∈ FEE (placement) | DELIVERY_TO_CUSTOMER
              | AGENCY (payment acceptance) | PAYMENT_TRANSFER | AUCTION_PROMOTION (boost) | LOYALTY_PARTICIPATION_FEE |
              CROSSREGIONAL_DELIVERY | RETURN_PROCESSING | RETURNED_ORDERS_STORAGE | … Empty ('[]') until the order is finally
              processed (e.g. DELIVERED).
          - name: CREATIONDATE
            description: Order creation date, YYYY-MM-DD.
          - name: CURRENCY
            description: Currency of all amounts in the order; RUR.
          - name: DELIVERYREGION
            description: >-
              JSON {id, name} of the delivery region, e.g. {"id": 213, "name": "Москва"}.
          - name: FAKE
            description: false = real buyer order; true = marketplace test (sandbox) order — filter out.
          - name: ID
            description: >-
              Marketplace order id (int64). Joins UNITED_ORDERS_*.ORDER_ID and GOODS_REALIZATION_*.PARTNER_ORDER_ID. Not
              unique in RAW — one row per download that covered the order.
            data_tests:
              - not_null
          - name: ITEMS
            description: >-
              JSON array of order lines after any changes: [{offerName, marketSku, shopSku, count, prices [{type: BUYER|MARKETPLACE|CASHBACK,
              costPerItem, total}], warehouse {id, name}, details [{itemStatus: REJECTED|RETURNED, itemCount, updateDate,
              stockType}], bidFee, cofinanceThreshold, cofinanceValue, initialCount}]. prices.BUYER = price after all discounts;
              MARKETPLACE = marketplace coupons / promo; CASHBACK = Plus points. Delivery may appear as a line with offerName
              'Доставка'. bidFee = boost bid in 1/100 %.
          - name: PARTNERORDERID
            description: >-
              Order id in the seller's own system; equals ID for this seller.
          - name: PAYMENTTYPE
            description: PREPAID (paid before receipt) | POSTPAID (paid on receipt) | UNKNOWN (cancelled / unpaid).
          - name: PAYMENTS
            description: >-
              JSON array of money transfers for the order: [{id, date YYYY-MM-DD, type: PAYMENT|REFUND, source: BUYER|MARKET_CESSION|CASHBACK|MARKETPLACE|SPLIT,
              total, paymentOrder}]. Empty while the order is only being processed or if cancelled before shipping.
          - name: STATUS
            description: >-
              Current order status: DELIVERED | CANCELLED_IN_DELIVERY (= unredeemed) | CANCELLED_IN_PROCESSING | CANCELLED_BEFORE_PROCESSING
              | RETURNED | PARTIALLY_DELIVERED | PARTIALLY_RETURNED | PICKUP | DELIVERY | PROCESSING | PENDING | RESERVED
              | UNPAID | LOST | UNKNOWN.
          - name: STATUSUPDATEDATE
            description: >-
              Date-time of the last status change, ISO 8601 with offset (+03:00, Moscow).
          - name: SUBSIDIES
            description: >-
              JSON array of marketplace points that reduce the placement fee: [{operationType: ACCRUAL|DEDUCTION, type:
              SUBSIDY (marketplace promo/coupons) | YANDEX_CASHBACK (Plus) | DELIVERY, amount}]. Absent when none.
          - name: _RAW_JSON
            description: >-
              The whole source record as JSON text — parse_json() in staging for anything not broken out into a column.
          - name: _LOADED_AT
            description: >-
              UTC timestamp (ISO 8601) when load_to_snowflake.py wrote the row. Freshness field; with _SOURCE_FILE it identifies
              a load batch.
          - name: _SOURCE_FILE
            description: >-
              Path of the source file relative to data/raw/ (e.g. orders_stats/2026-09-04/2025-01-01_2025-03-31.jsonl).
              Carries the download date and the requested period; replay / dedup key.
      - name: business_orders
        identifier: BUSINESS_ORDERS
        description: >-
          Order history WITH the cancellation reason and the real delivery date, from POST v1/businesses/{id}/orders (2
          383 orders on 2026-09-12, backfilled in 30-day windows by creation date — the API caps one request at 30 days
          and creationDateTo is EXCLUSIVE, so windows abut and an order appears in exactly one file; still deduplicate by
          ORDERID keeping the latest _LOADED_AT, because re-runs overlap). Exists because ORDERS_STATS carries neither SUBSTATUS
          nor any delivery date: there, every unredeemed parcel is CANCELLED_IN_DELIVERY and 'never collected' cannot be
          told from 'refused at the counter'. Three fields here settle it — SUBSTATUS, DELIVERY.dates.realDeliveryDate (the
          day the goods reached the PICKUP POINT) and CANCELREQUESTED. Covers 100 % of the ORDERS_STATS orders (all 2 346
          matched on 2026-09-12) plus 37 newer ones; getOrders would refuse orders cancelled over 30 days ago, this method
          does serve them. Nested JSON kept as text (ITEMS, PRICES, DELIVERY); _RAW_JSON holds the whole record. Money is
          NOT taken from here — fees live in ORDERS_STATS.COMMISSIONS.
        columns:
          - name: BUYERTYPE
            description: PERSON (individual) | BUSINESS (organisation).
          - name: CAMPAIGNID
            description: Campaign / shop id. Constant for this seller.
          - name: CANCELREQUESTED
            description: >-
              TRUE when the BUYER asked to cancel (in the app), FALSE when the cancellation came from the marketplace's
              own processing. The documented filter is DBS-only, but the field is returned for FBY and is the cleanest split
              between 'changed their mind remotely' and 'the parcel was ended at the counter': 101 of 740 unredeemed orders
              have TRUE.
          - name: CREATIONDATE
            description: >-
              Order creation timestamp, ISO 8601 with the +03:00 (Moscow) offset. The field the backfill windows filter
              on.
          - name: DELIVERY
            description: >-
              JSON of the delivery: {type: PICKUP|DELIVERY|POST, serviceName, deliveryServiceId, warehouseId, deliveryPartnerType,
              dispatchType (MARKET_BRANDED_OUTLET = a Market pickup point, UNKNOWN otherwise), dates {fromDate, toDate,
              fromTime, toTime, realDeliveryDate}}. **realDeliveryDate is the reason this source exists**: documented as
              the day the goods reached the pickup point (for self-pickup) or the buyer (for a courier), YYYY-MM-DD in the
              data although the spec says DD.MM.YYYY. Filled on 2 183 of 2 383 orders; on 639 of the 693 unredeemed ones
              — so 92 % of unredeemed parcels did reach the pickup point and only 54 were cancelled before arrival. fromDate/toDate
              are the PLANNED window, not the fact. Every unredeemed order so far is type = PICKUP: courier orders in this
              brand's history never end as an unredeemed parcel.
          - name: EXTERNALORDERID
            description: >-
              Order id in the seller's own system; equals ORDERID for this seller.
          - name: FAKE
            description: >-
              TRUE = marketplace test order. No test orders came back in the backfill (the endpoint excludes them unless
              asked), but keep the filter downstream.
          - name: ITEMS
            description: >-
              JSON array of the order lines: [{id, offerId (= shopSku), offerName, count, prices {payment, subsidy, vat},
              instances [{cis}], requiredInstanceTypes, itemStatuses [{status: CREATED|SHIPPED|CANCELLED|DELIVERED_TO_BUYER|LOST|REJECTED|RETURNED,
              count}]}]. itemStatuses is a per-unit status count and a cross-check on ORDERS_STATS.ITEMS[].details, which
              is what the models use; prices here are per unit and are NOT the fee basis.
          - name: ORDERID
            description: >-
              Marketplace order id. Joins ORDERS_STATS.ID, UNITED_ORDERS_*.ORDER_ID and GOODS_REALIZATION_*.PARTNER_ORDER_ID.
              One row per order per download.
            data_tests:
              - not_null
          - name: PAYMENTMETHOD
            description: >-
              How it was paid: YANDEX (card on the marketplace), CARD_ON_DELIVERY, CASH_ON_DELIVERY, CREDIT, …
          - name: PAYMENTTYPE
            description: >-
              PREPAID (paid before receipt) | POSTPAID (paid on receipt) — the strongest predictor of an unredeemed parcel
              in this data (11 % vs 59 %).
          - name: PRICES
            description: >-
              JSON {payment, subsidy} for the whole order: what the buyer pays and the marketplace-funded part. Benchmark
              only — revenue is built from ORDERS_STATS prices, which reconcile with the realization report.
          - name: PROGRAMTYPE
            description: >-
              Placement model of the shop: FBY for every row here.
          - name: SOURCEPLATFORM
            description: >-
              Where the order was placed: MARKET, and other platforms of the ecosystem.
          - name: STATUS
            description: >-
              Order status in the ORDERS vocabulary, which is NOT the ORDERS_STATS one: CANCELLED (not CANCELLED_IN_DELIVERY
              / _IN_PROCESSING / _BEFORE_PROCESSING), DELIVERED, DELIVERY, PICKUP, PROCESSING, RETURNED, PARTIALLY_RETURNED,
              PENDING, UNPAID. Which kind of cancellation it was is not here — read it from ORDERS_STATS.STATUS, and the
              REASON from SUBSTATUS.
          - name: SUBSTATUS
            description: >-
              Processing stage (STATUS = PROCESSING) or CANCELLATION REASON (STATUS = CANCELLED). Filled on every row. Do
              NOT read it as the buyer's reason on its own: USER_CHANGED_MIND ('cancelled for personal reasons') sits on
              351 unredeemed orders where the parcel had already reached the pickup point and nobody asked to cancel. The
              reason is a combination of SUBSTATUS, realDeliveryDate and CANCELREQUESTED — see int_order_lines. Values seen
              on unredeemed orders (693 on 2026-09-12): USER_CHANGED_MIND 380, PICKUP_EXPIRED 119, FULL_NOT_RANSOM 83 (undocumented;
              literally 'full non-purchase'), USER_HAS_NO_TIME_TO_PICKUP_ORDER 13, USER_BOUGHT_CHEAPER 18, REPLACING_ORDER
              12, USER_REFUSED_QUALITY 8, DELIVERY_SERVICE_UNDELIVERED 8, USER_REFUSED_PRODUCT 6, USER_WANTS_TO_CHANGE_ADDRESS
              9, CUSTOM 10, and a tail of one-offs. The enum is open: the docs say other values may appear and need not
              be handled.
          - name: UPDATEDATE
            description: >-
              Timestamp of the last change, ISO 8601 with offset. On a cancelled order this is the moment of cancellation
              — compared with DELIVERY.dates.realDeliveryDate it says whether the parcel was ended inside the pickup-point
              storage window (7 days at a Market outlet, 2 in a locker) or after it expired. The data shows the shape: 167
              unredeemed orders ended the day the parcel arrived, then a second bump of 73 on day 8.
          - name: _RAW_JSON
            description: >-
              The whole source record as JSON text — parse_json() in staging for anything not broken out into a column.
          - name: _LOADED_AT
            description: >-
              UTC timestamp (ISO 8601) when load_to_snowflake.py wrote the row. Freshness field; with _SOURCE_FILE it identifies
              a load batch.
          - name: _SOURCE_FILE
            description: >-
              Path of the source file relative to data/raw/ (e.g. orders_stats/2026-09-04/2025-01-01_2025-03-31.jsonl).
              Carries the download date and the requested period; replay / dedup key.
          - name: NOTES
            description: >-
              Free-text note attached to the order (present on 196 orders). Not used downstream; may hold support comments.
      - name: offer_mappings
        identifier: OFFER_MAPPINGS
        description: >-
          Catalogue snapshot from POST v2/businesses/{id}/offer-mappings, one row per offer per download (51 SKUs). OFFER
          = seller-side product card, MAPPING = the marketplace card/category it is bound to. Source for dim_products; take
          the latest SNAPSHOT_DATE per offerId.
        columns:
          - name: MAPPING
            description: >-
              JSON — the marketplace card the offer is bound to: {marketSku, marketSkuName, marketCategoryId, marketCategoryName,
              marketModelId, marketModelName (deprecated 2026-10-12)}. Absent fields = not yet bound.
          - name: OFFER
            description: >-
              JSON — seller-side product card: {offerId, name, vendor, category, pictures, description, barcodes, basicPrice
              {value, currencyId, discountBase}, purchasePrice, additionalExpenses, weightDimensions, cardStatus, campaigns,
              sellingPrograms, archived, groupId, …}. offerId = SHOP_SKU.
          - name: SHOWCASEURLS
            description: >-
              JSON array of links to the product on Market's showcases: [{showcaseType, showcaseUrl}].
          - name: SNAPSHOT_DATE
            description: Download date YYYY-MM-DD (added by ingest/yandex_market.py). Take the latest per offer.
