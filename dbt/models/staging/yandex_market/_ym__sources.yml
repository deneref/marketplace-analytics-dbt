              Seller's order number ('Ваш номер заказа') = the marketplace order number as exact text. Join key to ORDERS_STATS.ID
              and UNITED_ORDERS_*.ORDER_ID.
          - name: ORDER_TYPE
            description: >-
              Order type ('Тип заказа'): 'Продажа физлицу' (sale to an individual) for every row so far.
          - name: OFFER_NAME
            description: >-
              Product name as listed on the marketplace ('Название товара').
          - name: SHOP_SKU
            description: >-
              Seller's SKU ('Ваш SKU') — product key; join to OFFER_MAPPINGS / ORDERS_STATS items.
          - name: WAREHOUSE_SKU
            description: >-
              SKU under which the unit is stored at the warehouse ('SKU на складе'); may differ from SHOP_SKU (e.g. K3)
              — do not join on it.
          - name: UNITS_DELIVERED
            description: >-
              Units delivered to the buyer ('Доставлено, шт.' / 'Количество доставленных, шт.').
          - name: UNITS_RETURNED
            description: >-
              Units returned after delivery ('Возвращено, шт.').
          - name: ORDER_DATE
            description: >-
              Order creation date ('Дата оформления заказа'), DD.MM.YYYY.
          - name: SHIPPED_DATE
            description: >-
              Date the unit was handed to delivery ('Дата передачи товара в доставку'), DD.MM.YYYY.
          - name: DELIVERED_DATE
            description: >-
              Delivery date ('Дата доставки товара'), DD.MM.YYYY; empty when not delivered.
          - name: RETURN_RECEIVED_DATE
            description: >-
              Date the returned unit was received by the warehouse or sorting centre ('Дата приёма возврата складом или
              сортировочным центром'), DD.MM.YYYY. Event date of this appendix.
          - name: PAYMENT_METHOD
            description: >-
              Payment method ('Способ оплаты'): Предоплата | При получении | Яндекс.Сплит (предоплата) | Постоплатный Сплит.
              'При получении' / 'Постоплатный…' = paid on receipt.
          - name: VAT_RATE
            description: >-
              VAT rate on the line ('Ставка НДС'); 'Без НДС' for this seller (simplified tax regime).
          - name: PRICE_BEFORE_DISCOUNT
            description: >-
              Price per unit incl. VAT before any discounts, ₽ ('Цена c НДС без учёта скидок за шт.').
          - name: DISCOUNT_MARKETPLACE_PROMO
            description: >-
              Seller-funded discount per unit under a marketplace promotion, ₽ ('Ваша скидка по акции маркетплейса на 1
              шт.').
          - name: DISCOUNT_SBER_SPASIBO
            description: Seller-funded discount per unit paid with SberSpasibo bonuses, ₽.
          - name: DISCOUNT_YANDEX_PLUS
            description: Seller-funded discount per unit paid with Yandex Plus points, ₽.
          - name: PRICE_AFTER_DISCOUNT
            description: >-
              Price per unit incl. VAT after all discounts, ₽ ('Цена с НДС с учётом всех скидок за шт.') — the seller's
              realised price.
          - name: TOTAL_BEFORE_DISCOUNT
            description: >-
              Line total before discounts, ₽ = PRICE_BEFORE_DISCOUNT × the appendix's unit count ('Стоимость всех … без
              учёта скидок').
          - name: TOTAL_DISCOUNT
            description: >-
              Line total of all discounts, ₽ ('Сумма всех скидок').
          - name: TOTAL_AFTER_DISCOUNT
            description: >-
              Line total after discounts, ₽ ('Стоимость всех … с учётом скидок') — revenue to reconcile against.
          - name: TOTAL_VAT
            description: >-
              VAT amount in the line total, ₽ ('Сумма НДС'); 0 for this seller.
          - name: CUSTOMS_DECLARATION_NO
            description: >-
              Customs declaration or traceability batch number (РНПТ) for imported / traceable goods. Empty.
          - name: B2B_ORG_NAME
            description: >-
              Buyer organisation name for B2B orders ('Наименование организации'). Empty — B2C only.
          - name: B2B_INN
            description: >-
              Buyer organisation tax id for B2B orders ('ИНН'). Empty.
          - name: B2B_KPP
            description: >-
              Buyer organisation KPP for B2B orders ('КПП'). Empty.
          - name: B2B_LEGAL_ADDRESS
            description: >-
              Buyer organisation legal address for B2B orders ('Юридический адрес'). Empty.
          - name: UPD_STATUS
            description: >-
              Status of the universal transfer document (УПД) issued for a B2B order ('Статус УПД'). Empty.
          - name: UPD_DATE
            description: >-
              Date of the УПД ('Дата УПД'). Empty.
          - name: UPD_NO
            description: >-
              Number of the УПД ('Номер УПД'). Empty.
          - name: UKD_STATUS
            description: >-
              Status of the universal correction document (УКД) for a B2B return ('Статус УКД'). Empty.
          - name: UKD_DATE
            description: >-
              Date of the УКД ('Дата УКД'). Empty.
          - name: UKD_NO
            description: >-
              Number of the УКД ('Номер УКД'). Empty.
          - name: WAYBILL_DATE
            description: Date of the goods waybill (товарная накладная) for a B2B order. Empty.
          - name: WAYBILL_NO
            description: Number of the goods waybill. Empty.
          - name: INVOICE_DATE
            description: Date of the VAT invoice (счёт-фактура) for a B2B order. Empty.
          - name: INVOICE_NO
            description: Number of the VAT invoice. Empty.
          - name: CORRECTION_INVOICE_DATE
            description: Date of the corrective VAT invoice for a B2B return. Empty.
          - name: CORRECTION_INVOICE_NO
            description: Number of the corrective VAT invoice. Empty.
          - name: REDEEMED_AMOUNT
            description: >-
              Value of the units the buyer kept from a partially returned / unredeemed line, ₽ ('Стоимость выкупленного
              товара'). Empty so far.
          - name: _LOADED_AT
            description: >-
              UTC timestamp (ISO 8601) when load_to_snowflake.py wrote the row. Freshness field; with _SOURCE_FILE it identifies
              a load batch.
          - name: _SOURCE_FILE
            description: >-
              Path of the source file relative to data/raw/ (e.g. orders_stats/2026-09-04/2025-01-01_2025-03-31.jsonl).
              Carries the download date and the requested period; replay / dedup key.
