version: 2

sources:
  - name: yandex_market
    description: "Raw exports from the marketplace seller API, loaded as-is (all VARCHAR) by ingest/load_to_snowflake.py."
    database: MARKETPLACE
    schema: RAW
    loader: ingest/load_to_snowflake.py
    config:
      loaded_at_field: _LOADED_AT::timestamp_ntz
      freshness:
        warn_after: {count: 2, period: day}
        error_after: {count: 7, period: day}
    tables:
      - name: united_orders_orders
        description: "Order lines: one row per order × SKU. Sheet 'Orders' of the united-orders report."
        # TODO(Daniil): align column names with the first real CSV download
      - name: united_orders_services
        description: "Marketplace services (commission, logistics, storage…) per order. Sheet 'Services' of the united-orders report."
      - name: goods_turnover
        description: "Marketplace's own turnover report on a given date: stock, avg daily sales, turnover days, storage fees. Used as the reconciliation benchmark."
      - name: stock_snapshots
        description: "Daily stock snapshot per SKU × warehouse from the stocks endpoint (JSONL)."
        config:
          freshness:
            warn_after: {count: 1, period: day}
            error_after: {count: 3, period: day}
