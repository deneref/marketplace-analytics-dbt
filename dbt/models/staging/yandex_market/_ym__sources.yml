          date from the Market warehouse, one row per order line. Dates DD.MM.YYYY; amounts incl. VAT ('Без НДС' for this
          seller); numbers arrive as '1.0'-style floats; ORDER_ID arrives in scientific notation — use PARTNER_ORDER_ID.
        columns:
          - name: REPORT_MONTH
            description: >-
