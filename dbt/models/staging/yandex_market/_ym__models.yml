version: 2

models:
  - name: stg_ym__order_items
    description: >
      Sheet orders_and_offers_transactions of the united-orders report, typed and de-duplicated by latest load.
      One row per order × SKU × offer status (a partially unredeemed multi-unit order is split into two rows).
    columns:
      - name: order_item_key
        description: "Surrogate key: order_id + sku + offer_status."
        data_tests: [unique, not_null]
      - name: order_id
        data_tests: [not_null]
      - name: sku
        data_tests: [not_null]
      - name: ordered_date
        data_tests: [not_null]
      - name: offer_status
        description: "Line-level status as exported by the marketplace (English labels)."
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - 'Delivered to buyer'
                  - 'Unredeemed received in warehouse'
                  - 'Unredeemed in transit'
                  - 'Unredeemed received'
                  - 'Unredeemed lost'
                  - 'Cancelled'
                  - 'Return received in warehouse'
                  - 'Return in transit'
                  - 'Return issued'
                  - 'Shipped'
                  - 'Issued'
              config: {severity: warn}     # a new status is a heads-up, not a broken build
      - name: units_shipped
        description: "TRANSFERRED_FOR_DELIVERY — units handed to delivery for this line."
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: unit_price
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0

  - name: stg_ym__order_lines
    description: >
      ITEMS array of orders_stats unnested: one row per order × line (array position). Latest load per order wins,
      de-duplicated before flattening. Prices pivoted from the nested prices array. Order-level attributes are in
      stg_ym__orders; line status history is in stg_ym__order_line_events.
    columns:
      - name: order_line_key
        description: "Surrogate key: order_id + line_index (array position). Two lines can share an SKU, so sku is NOT part of the key."
        data_tests: [unique, not_null]
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_ym__orders')
                field: order_id
      - name: sku
        data_tests: [not_null]
      - name: units_ordered
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
      - name: price_buyer_total
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: warehouse_id
        data_tests: [not_null]

  - name: stg_ym__order_line_events
    description: >
      items[].details[] of orders_stats unnested: one row per order × line × event. Present only for units
      that came back — REJECTED (unredeemed) or RETURNED; normally delivered lines have no events.
      Latest load per order wins, de-duplicated before flattening.
    columns:
      - name: order_line_event_key
        description: "Surrogate key: order_id + line_index + event_index. Two events of one line can be identical (same status, same date) — the array index keeps them apart."
        data_tests: [unique, not_null]
      - name: order_line_key
        description: "Same key as in stg_ym__order_lines — join events to lines on it."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_ym__order_lines')
                field: order_line_key
      - name: event_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['REJECTED', 'RETURNED']
              config: {severity: warn}     # a new event type is a heads-up, not a broken build
      - name: event_units
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
      - name: event_date
        description: >
          Date the unit was received back by the warehouse. NULL for ~7% of events (2026-09): the unit is still
          in transit, or the marketplace did not pass the date (a cluster in March 2026). Count units regardless
          of the date; date-based reconciliations (goods_realization unredeemed/returned) use dated events only.
        data_tests:
          - dbt_utils.not_null_proportion:
              arguments:
                at_least: 0.85
              config: {severity: warn}
      - name: stock_type
        description: "Stock the unit was returned into (FIT, DEFECT, …). NULL whenever event_date is NULL."


  - name: stg_ym__order_fees
    description: >
      COMMISSIONS array of orders_stats unnested: one row per order × commission entry (array position).
      The same fee type repeats within an order (DELIVERY_TO_CUSTOMER in particular), so the grain is the array
      position, not the fee type — sum by type downstream. Amounts are in RUB (every order carries currency = RUR);
      negative amounts are fee reversals/corrections and must be summed as-is, never filtered.
      Latest load per order wins, de-duplicated before flattening. Unallocated truth for fct_order_fees;
      the per-line allocation lives in int_order_lines_with_fees.
    columns:
      - name: order_fee_key
        description: "Surrogate key: order_id + fee_index (array position)."
        data_tests: [unique, not_null]
      - name: order_id
        data_tests: [not_null]
        # add when stg_ym__orders exists:
        # - relationships:
        #     arguments:
        #       to: ref('stg_ym__orders')
        #       field: order_id
      - name: fee_index
        description: "Position of the entry in the COMMISSIONS array; distinguishes repeated fee types."
        data_tests: [not_null]
      - name: fee_type
        description: "Marketplace commission type as exported (FEE = sale commission, AUCTION_PROMOTION = boost, AGENCY = payment acceptance, …)."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - 'FEE'
                  - 'DELIVERY_TO_CUSTOMER'
                  - 'AGENCY'
                  - 'PAYMENT_TRANSFER'
                  - 'AUCTION_PROMOTION'
                  - 'CROSSREGIONAL_DELIVERY'
                  - 'RETURN_PROCESSING'
                  - 'LOYALTY_PARTICIPATION_FEE'
              config: {severity: warn}     # a new fee type is a heads-up, not a broken build
      - name: fee_amount
        description: "Fee amount in RUB, number(18,2). Can be negative (reversal) — no lower-bound test on purpose."
        data_tests: [not_null]
