version: 2

models:
  - name: stg_ym__order_items
    description: >
      Sheet orders_and_offers_transactions of the united-orders report, typed and de-duplicated by latest load.
      One row per order × SKU × offer status (a partially unredeemed multi-unit order is split into two rows).
      The report covers only the last 90 days without a paid subscription — kept as a fee benchmark for
      stg_ym__order_fees / fct_order_fees, not as the order source (that is orders_stats → stg_ym__order_lines).
    columns:
      - name: order_item_key
        description: "Surrogate key: order_id + sku + offer_status."
        data_tests: [unique, not_null]
      - name: order_id
        description: "Marketplace order id, as text."
        data_tests: [not_null]
      - name: sku
        description: "Seller's SKU (SHOP_SKU)."
        data_tests: [not_null]
      - name: ordered_date
        description: "Order creation date (CREATION_DATE, DD.MM.YYYY in the source)."
        data_tests: [not_null]
      - name: offer_status
        description: "Line-level status as exported by the marketplace (English labels)."
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - 'Delivered to buyer'
                  - 'Unredeemed received in warehouse'
                  - 'Unredeemed in transit'
                  - 'Unredeemed received'
                  - 'Unredeemed lost'
                  - 'Cancelled'
                  - 'Return received in warehouse'
                  - 'Return in transit'
                  - 'Return issued'
                  - 'Shipped'
                  - 'Issued'
              config: {severity: warn}     # a new status is a heads-up, not a broken build
      - name: units_shipped
        description: "TRANSFERRED_FOR_DELIVERY — units handed to delivery for this line."
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: unit_price
        description: "BILLING_PRICE — line price used by the marketplace for fee calculation, RUB."
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0

  - name: stg_ym__order_lines
    description: >
      ITEMS array of orders_stats unnested: one row per order × line (array position). Latest load per order wins,
      de-duplicated before flattening. The nested prices array is pivoted into price_* columns. Order-level
      attributes (status, payment type, region) are in stg_ym__orders; what happened to the units after shipment
      (unredeemed / returned) is in stg_ym__order_line_events.
    columns:
      - name: order_line_key
        description: "Surrogate key: order_id + line_index (array position). Two lines can share an SKU, so sku is NOT part of the key. Depends on array order at export time — items[] carries no id of its own."
        data_tests: [unique, not_null]
      - name: order_id
        description: "Marketplace order id, as text (same as in stg_ym__orders)."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_ym__orders')
                field: order_id
      - name: line_index
        description: "Position of the line in the ITEMS array: 0, 1, 2 …"
        data_tests: [not_null]
      - name: sku
        description: "Seller's SKU (shopSku) — the key of dim_products and of the cogs_by_sku seed."
        data_tests: [not_null]
      - name: market_sku
        description: "Marketplace's own SKU id (marketSku) for the same offer; informational."
      - name: product_name
        description: "Offer name as shown on the marketplace at order time (offerName)."
      - name: units_ordered
        description: "Units of this SKU in the line (count). Delivered units = units_ordered − rejected − returned, see int_order_lines_status."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
      - name: warehouse_id
        description: "Marketplace warehouse the line shipped from (warehouse.id) — key of dim_warehouses."
        data_tests: [not_null]
      - name: warehouse_name
        description: "Warehouse name as exported (warehouse.name), e.g. 'Яндекс.Маркет (Софьино)'."
      - name: bid_fee
        description: "Boost bid on this line (bidFee), RUB. Not a charged fee — the charged boost is fee_type AUCTION_PROMOTION in stg_ym__order_fees."
      - name: price_buyer_per_item
        description: "Price the buyer paid per unit (prices[type=BUYER].costPerItem), RUB, after all discounts."
      - name: price_buyer_total
        description: "Buyer price × units (prices[type=BUYER].total), RUB. Candidate revenue base — to be confirmed against goods_realization_delivered."
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: price_marketplace_total
        description: "Marketplace price × units (prices[type=MARKETPLACE].total), RUB. Meaning vs price_buyer_total and subsidies is an open question — do not use as revenue until reconciled."
      - name: cashback_total
        description: "Cashback (Plus points) applied on the line (prices[type=CASHBACK].total), RUB. NULL when none."
      - name: details_json
        description: "Raw items[].details array kept as VARIANT for traceability; unnested in stg_ym__order_line_events — do not parse it downstream."

  - name: stg_ym__order_line_events
    description: >
      items[].details[] of orders_stats unnested: one row per order × line × event. Present only for units
      that came back — REJECTED (unredeemed) or RETURNED; normally delivered lines have no events.
      Latest load per order wins, de-duplicated before flattening.
    columns:
      - name: order_line_event_key
        description: "Surrogate key: order_id + line_index + event_index. Two events of one line can be identical (same status, same date) — the array index keeps them apart. Depends on array order at export time."
        data_tests: [unique, not_null]
      - name: order_line_key
        description: "Same key as in stg_ym__order_lines — join events to lines on it."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_ym__order_lines')
                field: order_line_key
      - name: order_id
        description: "Marketplace order id, as text."
        data_tests: [not_null]
      - name: line_index
        description: "Position of the parent line in the ITEMS array."
        data_tests: [not_null]
      - name: event_index
        description: "Position of the event in the line's details array."
        data_tests: [not_null]
      - name: event_status
        description: "REJECTED — the buyer did not collect the unit (unredeemed); RETURNED — the buyer returned it after delivery."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['REJECTED', 'RETURNED']
              config: {severity: warn}     # a new event type is a heads-up, not a broken build
      - name: event_units
        description: "Units affected by this event (itemCount). Sum per line ≤ units_ordered."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
      - name: event_date
        description: >
          Date the unit was received back by the warehouse. NULL for ~7% of events (2026-09): the unit is still
          in transit, or the marketplace did not pass the date (a cluster in March 2026). Count units regardless
          of the date; date-based reconciliations (goods_realization unredeemed/returned) use dated events only.
        data_tests:
          - dbt_utils.not_null_proportion:
              arguments:
                at_least: 0.85
              config: {severity: warn}
      - name: stock_type
        description: "Stock the unit was returned into (FIT = sellable, DEFECT, …). NULL whenever event_date is NULL."

  - name: stg_ym__order_fees
    description: >
      COMMISSIONS array of orders_stats unnested: one row per order × commission entry (array position).
      The same fee type repeats within an order (DELIVERY_TO_CUSTOMER in particular), so the grain is the array
      position, not the fee type — sum by type downstream. Amounts are in RUB (every order carries currency = RUR);
      negative amounts are fee reversals/corrections and must be summed as-is, never filtered.
      Latest load per order wins, de-duplicated before flattening. Unallocated truth for fct_order_fees;
      the per-line allocation lives in int_order_lines_with_fees.
    columns:
      - name: order_fee_key
        description: "Surrogate key: order_id + fee_index (array position)."
        data_tests: [unique, not_null]
      - name: order_id
        description: "Marketplace order id, as text (same as in stg_ym__orders)."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_ym__orders')
                field: order_id
      - name: fee_index
        description: "Position of the entry in the COMMISSIONS array; distinguishes repeated fee types."
        data_tests: [not_null]
      - name: fee_type
        description: "Marketplace commission type as exported (FEE = sale commission, AUCTION_PROMOTION = boost, AGENCY = payment acceptance, …)."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - 'FEE'
                  - 'DELIVERY_TO_CUSTOMER'
                  - 'AGENCY'
                  - 'PAYMENT_TRANSFER'
                  - 'AUCTION_PROMOTION'
                  - 'CROSSREGIONAL_DELIVERY'
                  - 'RETURN_PROCESSING'
                  - 'LOYALTY_PARTICIPATION_FEE'
              config: {severity: warn}     # a new fee type is a heads-up, not a broken build
      - name: fee_amount
        description: "Fee amount in RUB, number(18,2). Can be negative (reversal) — no lower-bound test on purpose."
        data_tests: [not_null]

  - name: stg_ym__order_payments
    description: >
      PAYMENTS array of orders_stats unnested: one row per order × payment. A payment is money moving between the
      buyer and the marketplace: PAYMENT rows and REFUND rows are both positive — net cash from the buyer is
      sum(PAYMENT) − sum(REFUND), never a plain sum. paymentOrder (payout_id / payout_date) is the marketplace's
      transfer of that money to the seller and is NULL until the payout happens (~25% of rows on 2026-09-05).
      Amounts in RUB. Latest load per order wins, de-duplicated before flattening.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [order_id, payment_id]
    columns:
      - name: order_payment_key
        description: "Surrogate key: order_id + payment_id. payment_id is unique within an order, so the key does not depend on array order (unlike fees/events, which have no id of their own)."
        data_tests: [unique, not_null]
      - name: order_id
        description: "Marketplace order id, as text (same as in stg_ym__orders)."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_ym__orders')
                field: order_id
      - name: payment_index
        description: "Position in the PAYMENTS array at export time. Informational only — not part of the key, may change between exports."
      - name: payment_id
        description: "Marketplace payment id, as text."
        data_tests: [not_null]
      - name: payment_type
        description: "PAYMENT — buyer paid; REFUND — money returned to the buyer (unredeemed or returned goods). Both stored as positive amounts."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['PAYMENT', 'REFUND']
              config: {severity: warn}     # a new payment type is a heads-up, not a broken build
      - name: payment_source
        description: "BUYER — paid by the buyer directly; SPLIT — paid via the marketplace's instalment service (Split)."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['BUYER', 'SPLIT']
              config: {severity: warn}
      - name: payment_amount
        description: "Amount in RUB, number(18,2). Always ≥ 0 in the source; a negative value would be a new behaviour worth knowing about."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: payment_date
        description: "Date the payment/refund was registered by the marketplace."
        data_tests: [not_null]
      - name: payout_id
        description: "Id of the marketplace payout (paymentOrder) that transferred this payment to the seller. NULL until paid out."
      - name: payout_date
        description: "Date of that payout. NULL until paid out; the payout usually lands a few days after payment_date."

  - name: stg_ym__offers
    description: >
      Daily catalogue export (offer_mappings) typed and flattened: one row per sku × snapshot_date. OFFER = the
      seller's card (name, vendor, basic price, dimensions), MAPPING = the marketplace's view of it (marketSku,
      model, category). Latest load per sku × day wins. Description, pictures, campaigns and media are left out on
      purpose. Source of dim_products (latest snapshot) and of price/category history.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [sku, snapshot_date]
    columns:
      - name: offer_snapshot_key
        description: "Surrogate key: sku + snapshot_date."
        data_tests: [unique, not_null]
      - name: sku
        description: "Seller's SKU (offerId) — the same value as sku in stg_ym__order_lines and the cogs_by_sku seed."
        data_tests: [not_null]
      - name: snapshot_date
        description: "Date of the catalogue export the row comes from (one export per day by the ingest cron)."
        data_tests: [not_null]
      - name: product_name
        description: "Card name as the seller filled it in (name)."
        data_tests: [not_null]
      - name: vendor
        description: "Brand (vendor) as filled in by the seller."
      - name: vendor_code
        description: "Seller's article (vendorCode); NULL for ~30% of cards."
      - name: seller_category
        description: "Category as the seller typed it (offer.category) — free text, NULL for ~20% of cards. Prefer market_category_name for analysis."
      - name: product_type
        description: "Card type (offer.type), e.g. DEFAULT; NULL for ~20% of cards."
      - name: group_id
        description: "Seller's grouping id (groupId) — links size/colour variants of one model."
      - name: card_status
        description: "Marketplace card status (cardStatus), e.g. HAS_CARD_CAN_UPDATE."
      - name: is_archived
        description: "TRUE when the seller archived the card (archived); FALSE when the flag is absent."
        data_tests: [not_null]
      - name: barcode
        description: "First barcode of the card (barcodes[0])."
      - name: basic_price
        description: "Seller's base price at snapshot time (basicPrice.value), RUB. Changes over time — that is why the grain includes snapshot_date."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
      - name: price_before_discount
        description: "Strike-through price (basicPrice.discountBase), RUB; NULL when no discount is shown."
      - name: price_currency
        description: "Currency of basic_price (basicPrice.currencyId) — RUR for every card so far."
        data_tests:
          - accepted_values:
              arguments:
                values: ['RUR']
              config: {severity: warn}
      - name: price_updated_at
        description: "When the seller last changed the base price (basicPrice.updatedAt)."
      - name: length_cm
        description: "Package length (weightDimensions.length), cm."
      - name: width_cm
        description: "Package width (weightDimensions.width), cm."
      - name: height_cm
        description: "Package height (weightDimensions.height), cm."
      - name: weight_kg
        description: "Package weight (weightDimensions.weight), kg. Candidate base for delivery-fee allocation."
      - name: market_sku
        description: "Marketplace SKU id (mapping.marketSku) — same value as market_sku in stg_ym__order_lines."
        data_tests: [not_null]
      - name: market_sku_name
        description: "Marketplace's name of the SKU (mapping.marketSkuName)."
      - name: market_model_id
        description: "Marketplace model id (mapping.marketModelId) — groups SKUs of one model on the marketplace side."
      - name: market_model_name
        description: "Marketplace model name (mapping.marketModelName)."
      - name: market_category_id
        description: "Marketplace category id (mapping.marketCategoryId)."
      - name: market_category_name
        description: "Marketplace category (mapping.marketCategoryName), e.g. 'Рубашки' — the category to analyse by; present for every card."
        data_tests: [not_null]

  - name: stg_ym__orders
    description: >
      Order-level fields of orders_stats: one row per marketplace order (2025-01 → today, no 90-day limit), latest
      load wins. The nested arrays of the same RAW row live in their own staging models (order_lines,
      order_line_events, order_fees, order_payments) and join back on order_id. Parent of fct_orders.
    columns:
      - name: order_id
        description: "Marketplace order id (id), as text — the join key for every other orders_stats staging model."
        data_tests: [unique, not_null]
      - name: partner_order_id
        description: "Order id as shown to the seller (partnerOrderId); equals order_id for this seller. Also the join key to goods_realization (PARTNER_ORDER_ID there)."
        data_tests: [not_null]
      - name: ordered_date
        description: "Order creation date (creationDate). The 'as of' date for demand metrics; delivery/payout dates live in realization and payments."
        data_tests: [not_null]
      - name: status_updated_at
        description: "Last status change (statusUpdateDate, ISO 8601 with +03:00 offset), timestamp_tz. Use it — not ordered_date — as the incremental watermark: statuses change weeks after the order."
        data_tests: [not_null]
      - name: order_status
        description: >
          Final order status. DELIVERED; CANCELLED_IN_DELIVERY = unredeemed (buyer did not collect);
          CANCELLED_IN_PROCESSING / CANCELLED_BEFORE_PROCESSING = cancelled before shipment; RETURNED;
          PARTIALLY_DELIVERED = some lines unredeemed/returned (see order_line_events); PICKUP / DELIVERY /
          PROCESSING = still in flight.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - 'DELIVERED'
                  - 'CANCELLED_IN_DELIVERY'
                  - 'CANCELLED_IN_PROCESSING'
                  - 'CANCELLED_BEFORE_PROCESSING'
                  - 'RETURNED'
                  - 'PARTIALLY_DELIVERED'
                  - 'PICKUP'
                  - 'DELIVERY'
                  - 'PROCESSING'
              config: {severity: warn}     # a new status is a heads-up, not a broken build
      - name: payment_type
        description: "PREPAID (paid at checkout) or POSTPAID (paid on receipt). Order-level — the reason unredeemed rate is an order metric, not a line metric."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['PREPAID', 'POSTPAID']
      - name: buyer_type
        description: "PERSON (all orders so far) or BUSINESS."
      - name: currency
        description: "Order currency — RUR for every order so far; amounts elsewhere are RUB."
        data_tests:
          - accepted_values:
              arguments:
                values: ['RUR']
              config: {severity: warn}
      - name: is_test_order
        description: "Marketplace's test-order flag (fake). FALSE for every order so far; filter on it downstream anyway."
        data_tests: [not_null]
      - name: delivery_region_id
        description: "Marketplace geo id of the delivery region (deliveryRegion.id), e.g. 213 = Москва."
        data_tests: [not_null]
      - name: delivery_region_name
        description: "Delivery region name (deliveryRegion.name) — city/region label used for the regional cut."
        data_tests: [not_null]
      - name: subsidies_json
        description: "Raw subsidies array kept as VARIANT: [{operationType: ACCRUAL|DEDUCTION, type: SUBSIDY|YANDEX_CASHBACK, amount}]. Present for ~70% of orders. Unnest in a stg_ym__order_subsidies model when the revenue base question is settled."

  - name: stg_ym__business_orders
    description: >
      Order-level fields of the business-orders endpoint (POST v1/businesses/{id}/orders): one row per marketplace
      order, latest load wins. Counts in this block are a census as of 2026-09-12 (2 383 orders), taken from the raw
      files; "unredeemed" throughout means the 740 orders with at least one unit that came back uncollected — 693
      cancelled in delivery plus 47 partially delivered — and where only the fully cancelled 693 are meant, it says so.
      Why a second order source: orders_stats has neither a cancellation reason nor any delivery date, so an unredeemed
      parcel there is only CANCELLED_IN_DELIVERY. This model adds the three columns that separate the cases —
      order_substatus (the reason as the marketplace records it), real_delivery_date (the day the goods reached the
      pickup point) and is_cancel_requested (the buyer pressed cancel) — plus the delivery channel, the shipping
      warehouse at order level and the payment method. Money, the fine-grained order status and the per-unit
      REJECTED / RETURNED events stay with orders_stats, whose figures reconcile with the realization report.
      Nothing reads this model yet: the loss-reason tree that will consume it is the next change in int_order_lines,
      and the storage windows that tree needs are its business logic, not this model's.
      Loaded by a one-off backfill; there is no scheduled catch-up yet, so the 21 orders still in flight keep a stage
      substatus while orders_stats moves them on. Staleness is not guarded by source freshness (a manual backfill
      would warn forever and be ignored) but by tests/assert_business_orders_matches_orders_stats.sql, which names the
      orders that are missing here.
    data_tests:
      # Trap 2 as a test: on a delivered order the substatus is the delivery stage, never a reason (1 521 / 1 521).
      # If this warns, the reason mapping downstream is reading a column that no longer means what it did.
      - dbt_utils.expression_is_true:
          arguments:
            expression: "order_status_coarse <> 'DELIVERED' or order_substatus = 'DELIVERY_SERVICE_DELIVERED'"
          config: {severity: warn}
      # The invariant that makes real_delivery_date trustworthy AND the only real detector of a date-format change:
      # a delivered order always has it (1 521 / 1 521), and a failed parse empties the column and fails here.
      # The range test below cannot do that job — it skips nulls by construction.
      - dbt_utils.expression_is_true:
          arguments:
            expression: "order_status_coarse <> 'DELIVERED' or real_delivery_date is not null"
      # a parcel cannot arrive before the order was placed (marketplace wall clock, as everywhere in the project)
      - dbt_utils.expression_is_true:
          arguments:
            expression: "real_delivery_date is null or real_delivery_date >= {{ moscow_date('ordered_at') }}"
      # the promised window is a window
      - dbt_utils.expression_is_true:
          arguments:
            expression: "planned_delivery_to_date >= planned_delivery_from_date"
    columns:
      - name: order_id
        description: "Marketplace order id (orderId), as text — the join key to stg_ym__orders and every other orders_stats staging model. Coverage between the two sources is checked by tests/assert_business_orders_matches_orders_stats.sql, not by a relationships test: this source refreshes on its own schedule, so 37 orders here are newer than the last orders_stats pull and a forward relationships test would warn on every run."
        data_tests: [unique, not_null]
      - name: program_type
        description: "Placement model of the shop for this order: FBY on every order so far. The only per-order source of it — orders_stats has no such field — so it survives a future FBS mix."
      - name: order_status_coarse
        description: >
          Status in the ORDERS vocabulary, which is coarser than orders_stats.order_status and is not a substitute for
          it: DELIVERED (1 521) covers delivered, partially delivered and fully returned orders; CANCELLED (841) covers
          cancelled-before-processing, cancelled-in-processing and unredeemed alike. Its job here is to say which
          vocabulary order_substatus is speaking in — hence the name. For the real status join stg_ym__orders.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['DELIVERED', 'CANCELLED', 'PICKUP', 'DELIVERY', 'PROCESSING']
              config: {severity: warn}     # PENDING / UNPAID / PARTIALLY_RETURNED exist in the API and have not occurred yet
      - name: order_substatus
        description: >
          Processing stage while the order is live, cancellation REASON once it is cancelled — one column, two
          meanings, told apart by order_status_coarse. Filled on every row. Never read it as the buyer's reason on its
          own: USER_CHANGED_MIND ("cancelled for personal reasons") sits on 351 unredeemed orders whose parcel had
          already reached the pickup point and where nobody pressed cancel. The reason is built in int_order_lines
          from this column together with real_delivery_date and is_cancel_requested, and the mapping from value to
          reason lives there — this list is flat on purpose, so the two do not drift apart. FULL_NOT_RANSOM is in the
          API enum but absent from its documentation (literally "full non-purchase"); it is not a synonym of
          PICKUP_EXPIRED — the parcel had arrived in every case observed. The docs allow unlisted values, so the test
          warns rather than fails, but a new value must be classified in int_order_lines before it lands in the
          default branch unnoticed.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['STARTED', 'READY_TO_SHIP', 'READY_FOR_LAST_MILE', 'DELIVERY_SERVICE_RECEIVED',
                         'PICKUP_SERVICE_RECEIVED', 'DELIVERY_SERVICE_DELIVERED', 'USER_CHANGED_MIND',
                         'USER_BOUGHT_CHEAPER', 'USER_REFUSED_PRODUCT', 'USER_REFUSED_QUALITY',
                         'USER_REFUSED_DELIVERY', 'USER_WANTS_TO_CHANGE_ADDRESS', 'USER_WANTS_TO_CHANGE_DELIVERY_DATE',
                         'USER_WANTED_ANOTHER_PAYMENT_METHOD', 'USER_FORGOT_TO_USE_BONUS', 'USER_NOT_PAID',
                         'USER_HAS_NO_TIME_TO_PICKUP_ORDER', 'REPLACING_ORDER', 'PICKUP_EXPIRED', 'FULL_NOT_RANSOM',
                         'DELIVERY_SERVICE_UNDELIVERED', 'DELIVERY_PROBLEMS', 'DELIVERY_NOT_MANAGED_REGION',
                         'WAREHOUSE_FAILED_TO_SHIP', 'DAMAGED_BOX', 'SERVICE_FAULT', 'CUSTOM']
              config: {severity: warn}
      - name: is_cancel_requested
        description: >
          TRUE when the BUYER pressed cancel (101 of the 740 unredeemed orders). FALSE means no cancellation request
          was recorded — on a delivered order that is simply "nothing to cancel", and on a cancelled one it covers
          everything else at once: refused at the counter, storage expired, or the marketplace itself ended the order.
          So it is one-sided evidence: TRUE is a fact about the buyer, FALSE is the absence of one. Read it only
          together with order_status_coarse. The documented filter for this field is DBS-only, yet it is returned for
          FBY on every row — which is why the test below warns instead of failing.
        data_tests:
          - not_null:
              config: {severity: warn}     # the vendor does not list it as required: a gap is news, not a broken build
      - name: ordered_at
        description: "Order creation timestamp (creationDate), timestamp_tz with the +03:00 offset. Equals stg_ym__orders.ordered_date at day level on every shared order — checked, and kept checked by tests/assert_business_orders_matches_orders_stats.sql. The number of fractional digits varies across the history, hence try_to_timestamp_tz."
        data_tests: [not_null]
      - name: order_updated_at
        description: >
          Timestamp of the last change (updateDate). On a cancelled order this is the moment of cancellation, not the
          day the parcel came back: it equals orders_stats.status_updated_at to the second on 2 331 of the 2 346 shared
          orders (the other 15 changed after that source was last pulled), while the warehouse books the returned units
          1 to 5 days later. Compared with real_delivery_date it says whether the parcel was ended inside the
          pickup-point storage window or after it expired — the raw shape: 167 unredeemed parcels ended on the day they
          arrived, then a second bump of 73 on day 8, and a third at day 15 (a buyer can extend storage), which is why
          the threshold is a decision for int_order_lines and not a constant here. Prefixed to keep it apart from
          stg_ym__orders.status_updated_at in joins.
        data_tests:
          - not_null:
              config: {severity: warn}     # not listed as required by the vendor
      - name: delivery_type
        description: "PICKUP (self-pickup, 1 936 orders) | DELIVERY (courier, 447) | POST. Every unredeemed parcel in this brand's history is PICKUP — courier orders never end as an unredeemed parcel, which is itself worth knowing."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['PICKUP', 'DELIVERY', 'POST']
              config: {severity: warn}     # the API enum also has DIGITAL and UNKNOWN
      - name: dispatch_type
        description: >
          Where the order was dispatched to, as the marketplace classifies it: MARKET_BRANDED_OUTLET (1 925) |
          UNKNOWN (458); the API enum also holds BUYER and SHOP_OUTLET, unseen so far. NOT a pickup-vs-courier flag
          and not a substitute for delivery_type: the cross-tab is 1 901 pickup + outlet, 423 courier + unknown, but
          also 35 pickups with UNKNOWN and 24 courier orders with MARKET_BRANDED_OUTLET. And it does not tell a
          staffed outlet (7 days of storage) from a locker (2 days) — the enum has no locker value at all, so the
          locker branch of the loss-reason tree has no source in this data and int_order_lines must not pretend it
          does; the window has to be keyed on delivery_type = 'PICKUP' and treat UNKNOWN as unknown.
        data_tests:
          - not_null:
              config: {severity: warn}
          - accepted_values:
              arguments:
                values: ['MARKET_BRANDED_OUTLET', 'UNKNOWN']
              config: {severity: warn}
      - name: delivery_service_id
        description: "Id of the last-mile service, as text: 418 orders on 18881, then a long tail of ids with a handful of orders each. The tail looks like outlet-level granularity, which would make a per-outlet unredeemed rate possible — but the API we use has no mapping from these ids to names or addresses, so nothing may be built on that reading until it is verified."
      - name: order_warehouse_id
        description: "Market warehouse the order shipped FROM (172 Софьино, 313, 300, 305, 302 …), as text. Same id space as stg_ym__order_lines.warehouse_id but ORDER-level, and available on cancelled orders too — which is what lets the open question 'do regional shipments get unredeemed more often' be answered at all. Prefixed because a multi-warehouse order contradicts the line-level column, and a silent swap would answer that question wrongly."
        data_tests:
          - not_null:
              config: {severity: warn}     # not listed as required by the vendor
      - name: planned_delivery_from_date
        description: "First day of the delivery window the buyer was promised. PLANNED, not fact."
        data_tests: [not_null]
      - name: planned_delivery_to_date
        description: "Last day of the promised window; falls back to planned_delivery_from_date, which is what the API means by an absent toDate. PLANNED — never date anything by it, the fact is real_delivery_date."
        data_tests: [not_null]
      - name: real_delivery_date
        description: >
          The day the goods reached the PICKUP POINT (for self-pickup) or the buyer (for a courier) — the API's own
          definition, and the most useful column here: its presence proves the parcel travelled the whole way. Filled
          on 2 183 of 2 383 orders and on 639 of the 693 fully unredeemed ones, so 92 % of unredeemed parcels did
          arrive and only 54 were cancelled earlier. NULL means "never arrived" OR "not yet" — read it with
          order_status_coarse, never alone.
          **It is not the day of purchase and must not become the sales date.** Checked on 1 070 delivered pickup
          orders: the buyer collects the parcel the same day in 37 % of cases, the next day in 25 %, and 3 % wait
          eight days or more. The receipt date the project already uses (status_updated_at of a delivered order) is
          therefore the closer figure, and this column's own use is the other way round: the gap between the two is
          how long a parcel waits at the counter.
        data_tests:
          - dbt_utils.not_null_proportion:
              arguments:
                at_least: 0.85
              config: {severity: warn}     # 0.92 today; a drop means either a parse failure or a shift in the delivery mix
      - name: payment_type
        description: "PREPAID (1 381) | POSTPAID (1 002). Deliberately the same name and meaning as stg_ym__orders.payment_type — the two are compared in tests/assert_business_orders_matches_orders_stats.sql, which today names exactly one order where they differ (orders_stats reports the type of a cancelled order as UNKNOWN in some cases)."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['PREPAID', 'POSTPAID']
              config: {severity: warn}     # UNKNOWN is documented for cancelled orders
      - name: payment_method
        description: "How it was paid — information orders_stats does not carry at all: YANDEX (card at checkout, 1 299), BOUND_CARD_ON_DELIVERY (847), CARD_ON_DELIVERY (87), SBP (82), BNPL_ON_DELIVERY / BNPL_BANK_ON_DELIVERY / BNPL_TBYB (68 together — pay later, TBYB = try before you buy). Worth watching against the unredeemed rate: these are the cheapest ways for a buyer to reserve a fitting."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['YANDEX', 'BOUND_CARD_ON_DELIVERY', 'CARD_ON_DELIVERY', 'SBP', 'BNPL_ON_DELIVERY', 'BNPL_BANK_ON_DELIVERY', 'BNPL_TBYB']
              config: {severity: warn}
      - name: is_test_order
        description: "Marketplace test order (fake). FALSE everywhere — the endpoint excludes test orders unless asked — but filter on it downstream anyway, as with orders_stats."
        data_tests: [not_null]

  - name: stg_ym__realization_lines
    description: >
      The five appendices of the monthly goods-realization report ("Отчёт по реализации") unioned into one event
      table: one row per report_month × event_type × order line. event_type = shipped | delivered | unredeemed |
      returned | lost; event_units and event_date are the appendix-specific unit count and date, everything else
      is shared. This is the accounting truth for revenue (price_after_discount on delivered) — fct_sales_daily
      reconciles against it — and its event dates are the warehouse-side dates for unredeemed/returned units.
      No 90-day limit: 2025-01 → 2026-08 loaded. Amounts in RUB, "Без НДС" for this seller.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [report_month, event_type, order_id, sku]
    columns:
      - name: realization_line_key
        description: "Surrogate key: report_month + event_type + order_id + sku."
        data_tests: [unique, not_null]
      - name: report_month
        description: "Report month 'YYYY-MM' — the accounting period the row belongs to (not necessarily the month of ordered_date)."
        data_tests: [not_null]
      - name: event_type
        description: "Which appendix the row comes from: shipped (handed to delivery), delivered, unredeemed (came back uncollected), returned (returned after delivery), lost (lost in delivery, compensated by the marketplace)."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['shipped', 'delivered', 'unredeemed', 'returned', 'lost']
      - name: order_id
        description: "PARTNER_ORDER_ID as text — equals stg_ym__orders.order_id. The report's own ORDER_ID column is not used (exported in scientific notation)."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_ym__orders')
                field: order_id
              config: {severity: warn}     # realization can mention orders older than the orders_stats backfill
      - name: sku
        description: "Seller's SKU (SHOP_SKU)."
        data_tests: [not_null]
      - name: warehouse_sku
        description: "SKU as labelled in the marketplace warehouse (WAREHOUSE_SKU); can differ from sku for old cards."
      - name: product_name
        description: "Offer name as printed in the report."
      - name: order_type
        description: "'Продажа физлицу' for every row so far (B2C)."
      - name: payment_method
        description: "Payment method label as printed: Предоплата, При получении, Яндекс.Сплит (предоплата), Постоплатный Сплит. Maps to stg_ym__orders.payment_type (PREPAID/POSTPAID) and payment_source (SPLIT)."
        data_tests:
          - accepted_values:
              arguments:
                values: ['Предоплата', 'При получении', 'Яндекс.Сплит (предоплата)', 'Постоплатный Сплит']
              config: {severity: warn}
      - name: vat_rate
        description: "VAT label — 'Без НДС' for this seller, so total_vat is 0."
      - name: ordered_date
        description: "Order date (ORDER_DATE)."
        data_tests: [not_null]
      - name: shipped_date
        description: "Date handed to delivery (SHIPPED_DATE)."
      - name: delivered_date
        description: "Delivery date (DELIVERED_DATE); NULL for rows never delivered."
      - name: event_date
        description: "Date of the event this row records: shipped_date / delivered_date / unredeemed received / return received / lost received. The date basis for month-level reconciliation."
        data_tests:
          - not_null:
              config: {severity: warn}
      - name: event_units
        description: "Units the event applies to (UNITS_SHIPPED / UNITS_DELIVERED / UNITS_UNREDEEMED / UNITS_RETURNED)."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
      - name: price_before_discount
        description: "Unit price before discounts, RUB."
      - name: discount_marketplace_promo
        description: "Unit discount funded by the marketplace's promo, RUB."
      - name: discount_sber_spasibo
        description: "Unit discount paid with SberSpasibo points, RUB."
      - name: discount_yandex_plus
        description: "Unit discount paid with Yandex Plus points, RUB."
      - name: price_after_discount
        description: "Unit price after all discounts, RUB — the seller's realization price per unit."
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: total_before_discount
        description: "price_before_discount × units, RUB."
      - name: total_discount
        description: "Sum of the three discounts × units, RUB."
      - name: total_after_discount
        description: "price_after_discount × units, RUB — the revenue figure to reconcile fct_sales_daily against (delivered rows)."
      - name: total_vat
        description: "VAT amount, RUB — 0 for this seller."
      - name: redeemed_amount
        description: "For unredeemed/returned rows: amount actually redeemed/kept, RUB (REDEEMED_AMOUNT). NULL for other appendices."

  - name: stg_ym__stock_levels
    description: >
      Daily stock snapshot (stock_snapshots) typed and flattened: one row per snapshot_date × sku × warehouse_id ×
      stock_type, units = count. Offers listed at a warehouse with no stock ('[]' in RAW) are kept as one row with
      stock_type NULL and units 0 (is_empty_stock = TRUE). Latest load per offer × warehouse × day wins. Stock types
      are not additive (FIT = AVAILABLE + FREEZE) — int_stock_daily picks the types it needs; never sum across them.
      Source of fct_inventory_daily and dim_warehouses.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [snapshot_date, sku, warehouse_id, stock_type]
    columns:
      - name: stock_level_key
        description: "Surrogate key: snapshot_date + sku + warehouse_id + stock_type (NULL type gets the dbt_utils null placeholder, so empty rows are keyed too)."
        data_tests: [unique, not_null]
      - name: snapshot_date
        description: "Date of the snapshot (added by ingest/yandex_market.py, one snapshot per day by cron)."
        data_tests: [not_null]
      - name: sku
        description: "Seller's SKU (offerId) — the same value as sku in stg_ym__offers and stg_ym__order_lines."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_ym__offers')
                field: sku
              config: {severity: warn}
      - name: warehouse_id
        description: "Market warehouse id (FBY) the stock is held at; ~8 warehouses so far. Key of dim_warehouses."
        data_tests: [not_null]
      - name: stock_type
        description: >
          Stock bucket: FIT (sellable or reserved = AVAILABLE + FREEZE), AVAILABLE (sellable now), FREEZE (reserved
          for orders), QUARANTINE, DEFECT, EXPIRED, UTILIZATION. NULL only for empty-stock rows. Open list — the
          accepted_values test warns, not fails.
        data_tests:
          - accepted_values:
              arguments:
                values: ['FIT', 'AVAILABLE', 'FREEZE', 'QUARANTINE', 'DEFECT', 'EXPIRED', 'UTILIZATION']
              config: {severity: warn}
      - name: units
        description: "Units in this bucket (count); 0 for empty-stock rows."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: is_empty_stock
        description: "TRUE when RAW STOCKS was '[]' — the offer is listed at the warehouse but has no stock of any type."
        data_tests: [not_null]
      - name: stock_updated_at
        description: "When the marketplace last updated the stock figure (updatedAt); NULL for empty-stock rows."

  - name: stg_ym__turnover_report
    description: >
      Marketplace's own goods-turnover report (goods_turnover) typed: one row per report_date × sku × cluster_name.
      report_date is cut out of _source_file (…/<report_date>/turnover.csv) — the CSV has no date column. Latest
      load per sku × cluster × date wins. TURNOVER 'Нет продаж' → turnover_days NULL + has_sales FALSE; AMOUNT '-' →
      storage_amount NULL. Reconciliation benchmark for turnover computed from stock_levels + order_lines
      (assert_turnover_matches_marketplace, ±10%); not a source for marts on its own.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [report_date, sku, cluster_name]
    columns:
      - name: turnover_report_key
        description: "Surrogate key: report_date + sku + cluster_name."
        data_tests: [unique, not_null]
      - name: report_date
        description: "Date the report was requested for (last day of the period), from the _source_file path. NULL would mean the path layout changed."
        data_tests:
          - not_null
          # month-end contract: fct_inventory_turnover_monthly keys on report_month, a mid-month report would double a month
          - dbt_utils.expression_is_true:
              arguments:
                expression: "= last_day(report_date)"
      - name: sku
        description: "Seller's SKU (SHOP_SKU) — the same value as sku in stg_ym__offers and stg_ym__stock_levels."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_ym__offers')
                field: sku
              config: {severity: warn}
      - name: cluster_name
        description: "Warehouse cluster / macro-region (MACROREGION_NAME): Москва, Санкт-Петербург, Екатеринбург, Казань, Ростов. A cluster, not a warehouse_id — map to warehouses in dim_warehouses."
        data_tests: [not_null]
      - name: market_sku
        description: "Marketplace card id (MARKET_SKU); matches market_sku in stg_ym__offers."
      - name: offer_name
        description: "Product name as printed in the report."
      - name: market_category_name
        description: "Marketplace category (CATEGORY)."
      - name: length_mm
        description: "Package length, mm (the report uses mm; stg_ym__offers uses cm)."
      - name: width_mm
        description: "Package width, mm."
      - name: height_mm
        description: "Package height, mm."
      - name: volume_l
        description: "Package volume, litres — the unit storage is billed in."
      - name: turnover_days
        description: "Marketplace's turnover in days = stock ÷ average daily sales over the period; NULL when 'Нет продаж'."
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: has_sales
        description: "FALSE when the report says 'Нет продаж' for this sku × cluster (turnover_days is NULL then)."
        data_tests: [not_null]
      - name: avg_daily_units_sold
        description: "Average daily units sold over the period (AVG_SOLD_ITEMS)."
        data_tests: [not_null]
      - name: avg_daily_volume_sold_l
        description: "Average daily volume sold, litres (AVG_SOLD_VOLUME)."
      - name: avg_daily_volume_on_stock_l
        description: "Average daily volume in stock, litres (AVG_SOLD_VOLUME_ON_STOCK)."
      - name: units_on_stock
        description: "Units in stock on the last day of the period (ITEMS_ON_STOCK) — compare with stg_ym__stock_levels FIT on report_date, summed over the cluster's warehouses."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: storage_amount
        description: "Paid-storage cost for the period, RUB (AMOUNT); NULL when '-' (storage was free — every row so far)."
      - name: market_recommendation
        description: "Marketplace's free-text advice for the sku in this cluster (MARKET_RECOMMENDATION)."
