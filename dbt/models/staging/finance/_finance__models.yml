version: 2

models:
  - name: stg_finance__unit_costs
    description: >
      Unit cost per SKU × validity period, typed. Latest loaded file wins as a whole. One row per cost version;
      versions of one SKU are contiguous and do not overlap (tests/assert_unit_cost_versions_are_continuous.sql).
      Joined into fct_order_lines by sku and delivered_date between valid_from and coalesce(valid_to, '9999-12-31');
      tests/assert_delivered_lines_have_unit_cost.sql checks every delivered line finds exactly one version.
    data_tests:
      - dbt_utils.expression_is_true:
          name: unit_cost_equals_sum_of_items
          arguments:
            expression: >
              abs(unit_cost - (cost_materials + cost_manufacturing + cost_print + cost_label
                               + cost_packaging + cost_shipping + cost_other)) < 0.01
      - dbt_utils.expression_is_true:
          name: unit_cost_valid_to_not_before_valid_from
          arguments:
            expression: "valid_to is null or valid_to >= valid_from"
      - dbt_utils.expression_is_true:
          name: unit_cost_estimate_flag_matches_basis
          arguments:
            expression: "is_estimate = (cost_basis = 'plan_2024')"
    columns:
      - name: sku_cost_key
        description: "Surrogate key: sku + valid_from."
        data_tests: [unique, not_null]
      - name: sku
        description: "Seller's SKU — the join key to stg_ym__order_lines.sku and stg_ym__offers.sku."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_ym__offers')
                field: sku
              config:
                where: "sku_in_catalogue"      # SKUs we assigned ourselves before the listing are expected to be missing
                severity: warn
      - name: valid_from
        description: "First day the version applies."
        data_tests: [not_null]
      - name: valid_to
        description: "Last day the version applies; null = current version."
      - name: unit_cost
        description: "Cost per unit, RUB. Equals the sum of the seven cost_* items (model-level test)."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: false
      - name: cost_materials
        data_tests: [{dbt_utils.accepted_range: {arguments: {min_value: 0}}}]
      - name: cost_manufacturing
        data_tests: [{dbt_utils.accepted_range: {arguments: {min_value: 0}}}]
      - name: cost_print
        data_tests: [{dbt_utils.accepted_range: {arguments: {min_value: 0}}}]
      - name: cost_label
        data_tests: [{dbt_utils.accepted_range: {arguments: {min_value: 0}}}]
      - name: cost_packaging
        data_tests: [{dbt_utils.accepted_range: {arguments: {min_value: 0}}}]
      - name: cost_shipping
        description: "Inbound logistics of the batch per unit. Not the marketplace delivery fee."
        data_tests: [{dbt_utils.accepted_range: {arguments: {min_value: 0}}}]
      - name: cost_other
        data_tests: [{dbt_utils.accepted_range: {arguments: {min_value: 0}}}]
      - name: currency
        data_tests:
          - accepted_values:
              arguments:
                values: ['RUB']
      - name: cost_basis
        description: "batch_actual | supply_allocated | plan_2024 — how much to trust the number."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['batch_actual', 'supply_allocated', 'plan_2024']
      - name: is_estimate
        description: "true = planned cost. Carried into fct_order_lines as cogs_estimated so margin quality is visible in BI."
        data_tests: [not_null]
      - name: has_cost_breakdown
        data_tests: [not_null]
      - name: sku_in_catalogue
        description: "Snapshot flag from file build time; the relationships test on sku is the live check."
      - name: _source_file
        description: "The one file the current version of the table comes from."
