version: 2

models:
  - name: int_order_lines
    description: >
      The order line as an analytical entity: one row per order × line (same grain as stg_ym__order_lines),
      with the order's attributes, what happened to the units (rejected / returned → delivered, line_status) and
      the order's fees allocated to the line proportionally to price_buyer_total, rounding residual on the most
      expensive line so the sum per order matches stg_ym__order_fees exactly. Parent of fct_order_lines and
      fct_sales_daily. Filter on is_test_order and is_final downstream.
    data_tests:
      # returned + rejected can never exceed what was ordered
      - dbt_utils.expression_is_true:
          arguments:
            expression: "units_delivered >= 0"
      # a terminal order has a terminal line status
      - dbt_utils.expression_is_true:
          arguments:
            expression: "not (is_final and line_status = 'in_flight')"
      # a cancelled line delivered nothing
      - dbt_utils.expression_is_true:
          arguments:
            expression: "not (line_status = 'cancelled' and units_delivered <> 0)"
    columns:
      - name: order_line_key
        description: "Surrogate key from stg_ym__order_lines (order_id + line_index)."
        data_tests: [unique, not_null]
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_ym__orders')
                field: order_id
      - name: sku
        data_tests: [not_null]
      - name: ordered_date
        description: "Order creation date — the date basis of fct_sales_daily."
        data_tests: [not_null]
      - name: status_updated_at
        description: "Incremental watermark for fct_order_lines."
        data_tests: [not_null]
      - name: order_status
        data_tests: [not_null]
      - name: is_final
        description: "TRUE when the order is in a terminal status; delivered units of a non-final line are provisional."
        data_tests: [not_null]
      - name: line_status
        description: >
          delivered | unredeemed (parcel travelled, buyer did not collect — REJECTED events on the full quantity) |
          cancelled (order cancelled before shipment — by order status, such lines carry no events) | returned
          (RETURNED events on the full quantity; the order status stays DELIVERED) | partially_delivered (part of
          the quantity unredeemed or returned) | in_flight. Derivation verified with analyses/line_status_combinations.sql.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['delivered', 'unredeemed', 'cancelled', 'returned', 'partially_delivered', 'in_flight']
      - name: units_ordered
        data_tests: [not_null]
      - name: units_rejected
        data_tests: [not_null]
      - name: units_returned
        data_tests: [not_null]
      - name: units_delivered
        description: "units_ordered − units_rejected − units_returned; 0 for orders cancelled before shipment (they carry no events). Provisional while is_final is FALSE."
        data_tests: [not_null]
      - name: fee_share
        description: "Share of the line in the order's price_buyer_total (falls back to units when the order is free). Sums to 1 per order."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: fee_total
        description: "All fees of the order allocated to this line, RUB. Sum per order = sum(stg_ym__order_fees.fee_amount) — see tests/assert_fees_allocation_sums.sql."
        data_tests: [not_null]

  - name: int_stock_daily
    description: >
      Stock of one SKU at one warehouse on one snapshot day, stock types pivoted to columns from
      stg_ym__stock_levels. Types are not additive — units_fit = units_available + units_freeze — so downstream
      picks a column, never sums across them. An offer listed at a warehouse with no stock is a row of zeros.
      No calendar fill: days without a snapshot are absent. Parent of fct_inventory_daily.
    data_tests:
      # grain
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [snapshot_date, sku, warehouse_id]
      # documented relation between the types (getStocks: FIT = sellable or reserved); warn if the data disagrees
      - dbt_utils.expression_is_true:
          arguments:
            expression: "units_fit = units_available + units_freeze"
          config: {severity: warn}
    columns:
      - name: snapshot_date
        data_tests: [not_null]
      - name: sku
        data_tests: [not_null]
      - name: warehouse_id
        data_tests: [not_null]
      - name: units_fit
        description: "Good stock: sellable or reserved (FIT). Base for stock value and days of cover."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: units_available
        description: "Sellable right now (AVAILABLE) — what the buyer sees."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: units_freeze
        description: "Reserved for placed, not yet shipped orders (FREEZE)."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: units_defect
        description: "Damaged units, incl. damaged returns (DEFECT); not coming back to sale."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: units_quarantine
        description: "Temporarily blocked from sale (QUARANTINE), e.g. pending an intake check."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: stock_updated_at
        description: "Latest updatedAt of the offer × warehouse in the snapshot."
      - name: is_out_of_stock
        description: "units_available = 0 — nothing sellable; units_fit may still be > 0 when everything is reserved."
        data_tests: [not_null]
