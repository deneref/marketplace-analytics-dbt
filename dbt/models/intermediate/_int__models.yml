version: 2

models:
  - name: int_order_lines
    description: >
      The order line as an analytical entity, one row per order × line (same grain as stg_ym__order_lines).
      Carries the order's attributes, what happened to the units (rejected and returned units, then delivered,
      plus line_status) and the order's fees. Fees are allocated to lines in proportion to price_buyer_total, and
      the rounding residual goes to the most expensive line so the per-order sum matches stg_ym__order_fees.
      Parent of fct_order_lines and fct_sales_daily. Filter on is_test_order and is_final downstream.
    data_tests:
      # returned + rejected can never exceed what was ordered
      - dbt_utils.expression_is_true:
          arguments:
            expression: "units_delivered >= 0"
      # a terminal order has a terminal line status
      - dbt_utils.expression_is_true:
          arguments:
            expression: "not (is_final and line_status = 'in_flight')"
      # a cancelled line delivered nothing
      - dbt_utils.expression_is_true:
          arguments:
            expression: "not (line_status = 'cancelled' and units_delivered <> 0)"
      # a reason goes only on lines that lost units. An order-level attribute smeared over the lines the buyer KEPT
      # is how a dashboard ends up reporting refusals on sold goods
      - dbt_utils.expression_is_true:
          arguments:
            expression: "loss_reason is null or units_rejected + units_returned > 0"
      # the reason and its inference flag are two separate CASE expressions over the same conditions, so they have to
      # be set together or not at all
      - dbt_utils.expression_is_true:
          arguments:
            expression: "(loss_reason is null or loss_reason in ('unknown', 'not_in_source')) = (loss_reason_is_inferred is null)"
    columns:
      - name: order_line_key
        description: "Surrogate key from stg_ym__order_lines (order_id + line_index)."
        data_tests: [unique, not_null]
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_ym__orders')
                field: order_id
      - name: sku
        data_tests: [not_null]
      - name: ordered_date
        description: "Order creation date. fct_sales_daily is dated by it."
        data_tests: [not_null]
      - name: status_updated_at
        description: "Incremental watermark for fct_order_lines."
        data_tests: [not_null]
      - name: order_status
        data_tests: [not_null]
      - name: is_final
        description: "TRUE when the order is in a terminal status; delivered units of a non-final line are provisional."
        data_tests: [not_null]
      - name: line_status
        description: >
          delivered | unredeemed (parcel travelled, buyer did not collect; REJECTED events on the full quantity) |
          cancelled (order cancelled before shipment, detected by order status since such lines carry no events) |
          returned (RETURNED events on the full quantity; the order status stays DELIVERED) | partially_delivered (part of
          the quantity unredeemed or returned) | in_flight. Derivation checked in analyses/line_status_combinations.sql.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['delivered', 'unredeemed', 'cancelled', 'returned', 'partially_delivered', 'in_flight']
      - name: units_ordered
        data_tests: [not_null]
      - name: units_rejected
        data_tests: [not_null]
      - name: units_returned
        data_tests: [not_null]
      - name: units_rejected_defect
        description: "Of units_rejected, the units the marketplace warehouse booked as DEFECT. Lower bound: stockType is only set once the parcel is processed."
        data_tests: [not_null]
      - name: units_returned_defect
        description: "Of units_returned, the units booked as DEFECT. Same lower bound."
        data_tests: [not_null]
      - name: units_delivered
        description: "units_ordered − units_rejected − units_returned; 0 for orders cancelled before shipment (they carry no events). Provisional while is_final is FALSE."
        data_tests: [not_null]
      - name: loss_reason
        description: >
          Why the units of THIS line came back: refused_at_handover | not_collected | cancelled_by_buyer | not_paid |
          delivery_failed | unknown | not_in_source. NULL when nothing came back (the normal case). Also NULL on
          returned lines. A return happens after receipt, and the buyer's own reason for it lives in the returns API,
          which we don't ingest; 'unknown' there would pretend the question had been asked.
          Two sources feed this column, and line-level evidence takes priority over the order's reason. If the order
          kept some units and lost others, the parcel was opened, so the line gets 'refused_at_handover'. A partially
          unredeemed order is not cancelled at all and the marketplace gives no reason for it. All other lines take
          the order's reason from int_order_cancellations.
          Two values describe the state of the pipeline, and they mean different things. 'not_in_source' means the
          order has not been pulled from the business-orders source yet. 'unknown' means the order IS there, but either
          the tree found no evidence (no arrival recorded) or that source still shows the order as live while
          orders_stats has already cancelled it (the source lags). tests/assert_loss_reason_coverage.sql watches both.
        data_tests:
          - accepted_values:
              arguments:
                values: ['refused_at_handover', 'not_collected', 'cancelled_by_buyer', 'not_paid', 'delivery_failed',
                         'unknown', 'not_in_source']
      - name: loss_reason_is_inferred
        description: "TRUE when this line's reason comes from the storage-window inference (int_order_cancellations), FALSE when it rests on a statement. Also FALSE for line-level evidence, where the parcel was demonstrably opened. NULL when there is no reason to speak of: no refusal on the line, or a reason we do not have ('unknown' / 'not_in_source'). FALSE in those cases would read as 'rests on a statement'."
      - name: order_cancellation_reason
        description: "The ORDER-level reason as int_order_cancellations decided it. It is the input to loss_reason and is kept for audit. NULL unless the order was cancelled, so do not read it as the line's reason: on a partially unredeemed order it is NULL while loss_reason is 'refused_at_handover'."
      - name: order_reason_is_inferred
        description: "The order-level inference flag from int_order_cancellations, next to order_cancellation_reason. Use loss_reason_is_inferred for anything line-level."
      - name: is_in_business_orders
        description: "Whether the order exists in the newer source at all. Separates 'the order has no reason' from 'the order has not been pulled yet'. The second case becomes loss_reason 'not_in_source', and tests/assert_loss_reason_coverage.sql watches it so a stale backfill cannot grow unnoticed."
        data_tests: [not_null]
      - name: order_substatus
        description: "Raw marketplace substatus from the business-orders source, for ANY order: a processing stage on live orders, a cancellation reason on cancelled ones. Taken straight from staging, since int_order_cancellations keeps only cancellations. Carried so a single order can be audited without joining back."
      - name: real_delivery_date
        description: "Day the parcel reached the pickup point or the buyer. NOT a sales date (for self-pickup the buyer collects 0 to 8+ days later). Use it for the gap to delivered_date, i.e. how long a parcel waited at the counter."
      - name: order_units_delivered
        description: "Units the whole ORDER kept, repeated on every line of it. Order-level, so never sum it at line grain. It is there to derive is_order_partly_kept and for analyses."
        data_tests: [not_null]
      - name: order_units_lost
        description: "Units the whole ORDER lost (rejected + returned), repeated on every line. Order-level and not additive at this grain."
      - name: order_units_rejected
        description: "Units the whole ORDER lost to REFUSAL (rejected only, no returns), repeated on every line. is_order_partly_kept is built on it. Returns are left out because a return happens after the whole order was received and says nothing about a refusal at the counter."
        data_tests: [not_null]
      - name: is_order_partly_kept
        description: >
          The order kept at least one unit AND had at least one REJECTED. That means the parcel reached the buyer, was
          opened, and part of it was handed back. Only rejections count here. With returns included, a fully received
          order would qualify and a post-purchase return would be labelled a refusal at the counter.
          In stats/orders this is the only evidence that separates "did not collect the parcel" from "held the item and
          handed it back". The marketplace reports both as CANCELLED_IN_DELIVERY, and this report has no substatus.
          rpt_sales_daily uses it to split unredeemed. True on 55 lines of 47 orders as of 2026-09-14.
          It is not proof, since a multi-parcel order could deliver one parcel and lose another in transit.
        data_tests: [not_null]
      - name: fee_share
        description: "Share of the line in the order's price_buyer_total (falls back to units when the order is free). Sums to 1 per order."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: fee_total
        description: "All fees of the order allocated to this line, RUB. Sum per order = sum(stg_ym__order_fees.fee_amount), checked by tests/assert_fees_allocation_sums.sql."
        data_tests: [not_null]

  - name: int_order_cancellations
    description: >
      Why an order was cancelled, one row per cancelled order (841 of 2 383; census as of 2026-09-12). The marketplace
      has no such column. stats/orders carries no reason at all, and the business-orders substatus alone is misleading:
      USER_CHANGED_MIND sits on 356 cancellations where the parcel had already reached the pickup point and nobody
      pressed cancel. So the reason is decided from three fields (order_substatus, real_delivery_date,
      is_cancel_requested) plus the storage window. The model's header explains the order of the rules and why each
      one sits where it does. reason_rule says which rule fired, and reason_is_inferred says whether that rule was a
      statement or our inference. 442 of the 841 rows are inferences (402 of the 415 refusals among the 693 fully
      unredeemed orders). Any number built on them is a floor that rests on assumptions, not a measurement.
      Consumed by int_order_lines, which decides how a reason belonging to an ORDER may be applied to a line. The
      planned rpt_order_economics can read it directly at its own grain. Not filtered on is_test_order (filter
      downstream, as everywhere).
    data_tests:
      # a refusal at handover is impossible unless the parcel got there, and all rules that produce it require arrival
      - dbt_utils.expression_is_true:
          arguments:
            expression: "cancellation_reason <> 'refused_at_handover' or parcel_arrived"
      # the window rules can only produce these two verdicts; anything else means the mapping and the flag drifted apart
      - dbt_utils.expression_is_true:
          arguments:
            expression: "not reason_is_inferred or cancellation_reason in ('refused_at_handover', 'not_collected')"
      # default branch: an order whose parcel never arrived and about which nothing else is known. 0 rows today.
      # A row here isn't a bug, but it is a case to look at before trusting the mix, so severity is warn.
      - dbt_utils.expression_is_true:
          arguments:
            expression: "cancellation_reason <> 'unknown'"
          config: {severity: warn}
    columns:
      - name: order_id
        description: "Marketplace order id, the join key to int_order_lines and stg_ym__orders. The unique test matters here: int_order_lines joins this model BEFORE the fee-allocation window functions, and a duplicate would silently double the allocated commissions."
        data_tests: [unique, not_null]
      - name: cancellation_reason
        description: >
          Counts are over all 841 cancelled orders. In brackets is the subset that matters for losses, the 693 fully
          unredeemed ones, with the commissions at stake.
          refused_at_handover: the parcel reached the buyer or the pickup point and was not taken. Either the marketplace
          says so outright (13) or the order ended inside the storage window without a cancellation request (410).
          Total 423 (415 orders, 58 797 ₽).
          not_collected: the marketplace states the parcel was not collected, by expiry or because the buyer said they
          have no time (136), or the order ended after the window (32). Total 168 (164, 25 898 ₽).
          cancelled_by_buyer: the buyer pressed cancel, wherever the parcel was. 168 (98, 16 271 ₽).
          not_paid: the order died at checkout (unpaid, wrong payment method, a forgotten bonus). 66 (3, 681 ₽; almost
          none reach a loss row because nothing was shipped).
          delivery_failed: delivery or the warehouse broke it. 16 (13, 2 018 ₽).
          unknown: no arrival recorded and nothing else known. 0, and the warn test above keeps an eye on it.
          A reason here describes the ORDER; int_order_lines decides which lines it may be attached to.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['refused_at_handover', 'not_collected', 'cancelled_by_buyer', 'not_paid', 'delivery_failed',
                         'unknown']
      - name: reason_rule
        description: >
          Which rule decided the reason, in evaluation order: stated_not_collected (136), stated_failure (16),
          payment_abandoned (66), buyer_request (168), stated_refusal (13), no_evidence (0), arrival_is_handover (0),
          within_storage_window (410), after_storage_window (32). Kept as a column so one order can be audited without
          re-reading the CASE. The reason and the inference flag are both read off it, so they cannot drift apart.
          Only two substatuses reach the window rules today, USER_CHANGED_MIND (356) and FULL_NOT_RANSOM (86).
          tests/assert_cancellation_substatuses_known.sql warns when a third one starts arriving there. A value the
          tree does not know won't become 'unknown'. It falls through into the window rules and ends up in the
          headline number.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['stated_not_collected', 'stated_failure', 'payment_abandoned', 'buyer_request',
                         'stated_refusal', 'no_evidence', 'arrival_is_handover', 'within_storage_window',
                         'after_storage_window']
      - name: reason_is_inferred
        description: "TRUE when the verdict came from the storage-window rules (or from courier arrival), FALSE when it came from the marketplace's own statement or the buyer's request. TRUE on 442 of 841 cancellations, including 402 of the 415 refusals among the 693 unredeemed orders. The marketplace records no visit to a pickup point, so this is the point where the reasoning stops being evidence."
        data_tests: [not_null]
      - name: is_cancel_requested
        description: "Whether the BUYER pressed cancel. A NULL in staging is read as FALSE here, meaning 'no request on record' and never 'maybe'. Decides 168 of the 841 verdicts. If the marketplace ever stops filling it, those orders move into the window rules, which is why staging has a not_null test at warn severity on it."
        data_tests: [not_null]
      - name: parcel_arrived
        description: >
          Whether a delivery to the pickup point (or to the buyer, for a courier) was RECORDED, i.e. real_delivery_date
          is not null. TRUE on 639 of the 693 fully unredeemed orders. Be careful with the other 54. All of them have
          REJECTED units, so a parcel did travel and come back. FALSE here means "no arrival on record" and does not
          mean "the parcel never got there". All 54 are classified by an earlier rule (a request, a statement) and none
          becomes 'unknown'. Still, the column must not be read as proof of the negative.
        data_tests: [not_null]
      - name: real_delivery_date
        description: "Day the parcel arrived (stg_ym__business_orders). NOT the day of purchase: for self-pickup the buyer collects 0 to 8+ days later, so this must never become the sales date."
      - name: cancelled_at
        description: "Moment the order was cancelled (stg_ym__business_orders.order_updated_at, which equals orders_stats.status_updated_at to the second). The warehouse books the returned units 1 to 5 days later, and that later date is what dates the loss in reporting."
      - name: days_at_pickup
        description: "Days from recorded arrival to cancellation; NULL when no arrival was recorded, 0 when the order ended the day the parcel arrived (167 of 639). Compared with storage_days_allowed it decides refused_at_handover against not_collected."
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: storage_days_allowed
        description: >
          The window this row was judged against: var pickup_storage_days (7, the marketplace's official period at a
          branded outlet) for all channels except courier. For courier, arrival already is handover and the window
          is NULL. Using a single window has a cost. A locker keeps a parcel 2 days and a post office 5, and nothing
          in the source marks either. Sensitivity on the 693 unredeemed orders: 7 days gives 415 refusals against 164 not-collected,
          14 days gives 446/133, and 2 days (the locker period, i.e. the worst case if a large share of these were
          lockers) gives 291/288. The direction of the answer holds across these thresholds, but the size of the
          refusal bucket depends on the window, so always quote it together with the window.
      - name: order_substatus
        description: "The marketplace's own substatus, carried raw. The reason above is a reading of it and does not replace it. A new value must be classified in this model's Jinja sets before it reaches the window rules."
        data_tests: [not_null]
      - name: delivery_type
        description: "PICKUP | DELIVERY | POST. Decides whether the storage window applies. Only a courier order (DELIVERY) skips it, because there arrival means the goods were in the buyer's hands. All unredeemed orders so far are PICKUP."
        data_tests: [not_null]
      - name: dispatch_type
        description: "MARKET_BRANDED_OUTLET | UNKNOWN. Carried for the report page. NOT used to pick the window, since it separates neither outlets from lockers nor pickup from courier (see stg_ym__business_orders)."
      - name: is_test_order
        description: "Marketplace test order. Filter downstream, as with every other model."
        data_tests: [not_null]

  - name: int_stock_daily
    description: >
      End-of-day stock of one SKU at one warehouse, with the stock buckets of stg_ym__stock_levels pivoted to columns
      (the stocks-on-warehouses report; daily history from 2025-01-08). Buckets are not additive
      (units_fit = units_available + units_freeze), so downstream picks one column and never sums across them.
      A SKU listed at a warehouse with no stock is a row of zeros. The native key is the warehouse NAME as the report
      prints it. warehouse_id is resolved from stg_ym__warehouses and is NULL for a name the marketplace no longer
      lists (assert_stock_warehouses_resolve). fct_inventory_daily cannot key a row with units on such a name and
      excludes it; tests/assert_inventory_daily_excludes_no_units.sql makes that an error. sku is the seller's code
      (report ARTICLE), and reported_sku keeps the warehouse label (K4). There is no calendar fill, so days without
      a report are absent. Parent of fct_inventory_daily.
    data_tests:
      # grain
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [snapshot_date, sku, warehouse_name]
      # documented relation between the buckets (VALID = AVAILABLE_FOR_ORDER + RESERVED); warn if the report disagrees
      - dbt_utils.expression_is_true:
          arguments:
            expression: "units_fit = units_available + units_freeze"
          config: {severity: warn}
    columns:
      - name: snapshot_date
        description: "Day the stock is as of (end of day, Moscow), i.e. the reportDate of the report. Stock before an order placed on day D is the row of D − 1."
        data_tests: [not_null]
      - name: sku
        description: "Seller's SKU (the report's ARTICLE). All other models key on this code."
        data_tests: [not_null]
      - name: reported_sku
        description: "Label the warehouse printed for the sku that day (K4 for CAP-Bur-006); the smaller label if the report printed two for one article at one warehouse."
        data_tests: [not_null]
      - name: warehouse_name
        description: "Warehouse name as printed by the report. This is the key the model is unique on."
        data_tests: [not_null]
      - name: warehouse_id
        description: "Marketplace warehouse id from stg_ym__warehouses by exact name. NULL when unresolved (closed warehouse); see assert_stock_warehouses_resolve."
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_ym__warehouses')
                field: warehouse_id
      - name: units_fit
        description: "Good stock: sellable or reserved (report VALID = FIT). Base for stock value and days of cover."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: units_available
        description: "Sellable right now (report AVAILABLE_FOR_ORDER = AVAILABLE), i.e. what the buyer sees."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: units_freeze
        description: "Reserved for placed, not yet shipped orders (report RESERVED = FREEZE)."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: units_defect
        description: "Damaged units, incl. damaged returns (DEFECT); not coming back to sale."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: units_quarantine
        description: "Temporarily blocked from sale (QUARANTINE), e.g. pending an intake check."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: units_expired
        description: "Expired units (EXPIRED). Always 0 for apparel; kept because the report has the column."
        data_tests: [not_null]
      - name: units_utilization
        description: "Units handed over for disposal (UTILIZATION)."
        data_tests: [not_null]
      - name: is_out_of_stock
        description: "units_available = 0, nothing sellable. units_fit may still be > 0 when everything is reserved."
        data_tests: [not_null]
