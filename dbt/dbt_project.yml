name: marketplace_analytics
version: 1.0.0
profile: marketplace_analytics

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  use_demo_seeds: false        # dbt build --vars '{"use_demo_seeds": true}' runs on synthetic seeds, no API needed
  restock_lead_days: 60               # production lead time in days: rpt_stock_sku flags a restock candidate when its
                                      # cover in days is shorter than this (the batch started today lands after the shelf empties)
  restock_horizon_days: 120           # days a batch must cover after it lands (lead + time to see it sell and start the next one);
                                      # also the length of the season window a year back that velocity_restock reads
  velocity_min_units: 10              # units a window must hold before its rate is trusted over a wider one (rpt_stock_sku)
  fct_order_lines_lookback_days: 30   # incremental window: late fees and return events do not move status_updated_at
  pickup_storage_days: 7              # days a parcel waits at a Market pickup point before storage expires (official: 7;
                                      # lockers get 2, but nothing in the data marks a locker). int_order_cancellations
                                      # uses it to tell "refused at the counter" from "never collected"; the direction of
                                      # the answer survives the threshold (7 vs 14 days moves 31 of 693 unredeemed
                                      # orders, 2 days would move 124), the size of the refusal bucket does not.
                                      # CHANGING THIS RESTATES HISTORY: the views recompute, the incremental
                                      # fct_order_lines does not — follow any change with a --full-refresh run.

models:
  marketplace_analytics:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view        # not ephemeral (queryable while debugging), not table (only dbt run reads it,
      +schema: intermediate      # cannot go stale); see models/intermediate/README.md for the trade-off
    marts:
      +materialized: table
      +schema: marts
    reporting:
      +materialized: view
      +schema: reporting

seeds:
  marketplace_analytics:
    +schema: seeds
    +column_types:
      # keep raw-like seeds as strings; staging casts them
      _LOADED_AT: varchar
