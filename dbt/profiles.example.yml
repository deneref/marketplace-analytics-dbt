# Copy to ~/.dbt/profiles.yml — never commit the real one. Values come from environment variables (see .env.example);
# dbt does not read .env itself: `set -a; source .env; set +a` before running dbt.
#
# Auth = key pair on a SERVICE user (Snowflake enforces MFA on human/password users, which breaks dbt, the loader,
# CI and the Looker Studio connector). See README "Snowflake setup".
marketplace_analytics:
  target: dev
  outputs:
    dev:                              # your laptop: real data, schema DBT_DEV
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      private_key_path: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PATH') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE', 'SYSADMIN') }}"
      warehouse: DBT_WH
      database: MARKETPLACE
      schema: DBT_DEV
      threads: 4
      client_session_keep_alive: false
    ci:                               # GitHub Actions: synthetic seeds, schemas DBT_CI_* — never touches dev
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      # dbt does not support passing the key itself through env_var() (docs.getdbt.com, Connect Snowflake):
      # the workflow writes the PEM from the GitHub secret to a file and points this variable at it.
      private_key_path: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PATH') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE', 'SYSADMIN') }}"
      warehouse: DBT_WH
      database: MARKETPLACE
      schema: DBT_CI                  # macros/generate_schema_name.sql prefixes every custom schema with it
      threads: 4
